    });
    ins('payment', { reservation_id: rParcial.id, kind: 'integral', method: 'pix', amount: brutoP, state: 'pago', paid_at: D(-5) + 'T14:50:00.000Z', created_by: users.atendimento[1].id });
    ins('payment', { reservation_id: rParcial.id, kind: 'multa', method: 'pix', amount: Math.round(brutoP * 0.2 * 1 * 100) / 100, state: 'pendente', due_at: T, notes: '1 dia(s) de atraso · 1 peça(s) ainda na rua', created_by: users.atendimento[1].id });
    ins('reservation_state_history', { reservation_id: rParcial.id, from_state: 'em_uso', to_state: 'aguardando_devolucao', reason: 'Devolução parcial — 1 peça recebida, 1 pendente', occurred_at: D(-1) + 'T18:20:00.000Z', user_id: users.atendimento[1].id });
    ins('contract', { reservation_id: rParcial.id, number: rParcial.code.replace('RS', 'CT'), version: 1, body_rendered: '', generated_at: rParcial.created_at, signed_at: D(-5) + 'T14:55:00.000Z', signer_name: customers[11].full_name, signature_kind: 'presencial', created_by: users.atendimento[1].id });
  }

  /* ==================================================================
     v0.2 · RETIRADA AUTORIZADA COM SALDO PENDENTE
     ================================================================== */
  const gAut = byName('Positano') === multiPecas[0] ? byName('Milano') : byName('Milano');
  if (gAut) {
    const rAut = ins('reservation', {
      code: nextCode(), customer_id: customers[13].id, state: 'em_uso',
      event_date: D(0), event_type: 'Festa corporativa', event_venue: 'Hotel Serrano · Araguaína',
      pickup_date: D(-1), return_due_date: D(2), channel: 'loja',
      total_gross: gAut.rental_price, discount: 0, total_net: gAut.rental_price,
      deposit_amount: 0, late_fee: 0, picked_up_at: D(-1) + 'T17:10:00.000Z',
      created_by: users.atendimento[0].id,
      notes: 'Cliente pagou metade; combinou o restante por PIX até as 18h de hoje.',
      created_at: new Date(Date.now() - 11 * 864e5).toISOString()
    });
    ins('reservation_item', {
      reservation_id: rAut.id, garment_id: gAut.id, unit_price: gAut.rental_price,
      gross_amount: gAut.rental_price, item_discount: 0, allocated_order_discount: 0,
      net_revenue: gAut.rental_price, discount: 0, line_total: gAut.rental_price,
      item_state: 'retirado', picked_up_at: D(-1) + 'T17:10:00.000Z', returned_at: null,
      pickup_note: 'Entregue com capa protetora.'
    });
    const bufA = cats[gAut.category_slug].default_cleaning_days;
    ins('garment_calendar_block', { garment_id: gAut.id, reservation_id: rAut.id, kind: 'locacao', start_date: D(-1), end_date: D(2), note: 'Locação' });
    ins('garment_calendar_block', { garment_id: gAut.id, reservation_id: rAut.id, kind: 'higienizacao', start_date: D(3), end_date: D(2 + bufA), note: 'Higienização pós-uso' });
    db.update('garment', gAut.id, { state: 'em_uso' }, { silent: true, batch: true });
    ins('payment', { reservation_id: rAut.id, kind: 'sinal', method: 'pix', amount: Math.round(gAut.rental_price / 2), state: 'pago', paid_at: new Date(Date.now() - 11 * 864e5).toISOString(), created_by: users.atendimento[0].id });
    ins('exception_authorization', {
      reservation_id: rAut.id, kind: 'retirada_com_saldo',
      amount: gAut.rental_price - Math.round(gAut.rental_price / 2),
      reason: 'Pagamento combinado para as 18h de hoje; cliente recorrente com histórico limpo.',
      authorized_by: users.gestor[0].id, authorized_by_name: users.gestor[0].full_name,
      authorized_by_role: 'Gestor', authorized_at: D(-1) + 'T17:05:00.000Z'
    });
    ins('reservation_state_history', { reservation_id: rAut.id, from_state: 'confirmada', to_state: 'em_uso', reason: `Exceção autorizada: retirada com saldo (${users.gestor[0].full_name})`, occurred_at: D(-1) + 'T17:10:00.000Z', user_id: users.gestor[0].id });
    ins('contract', { reservation_id: rAut.id, number: rAut.code.replace('RS', 'CT'), version: 1, body_rendered: '', generated_at: rAut.created_at, signed_at: D(-1) + 'T17:05:00.000Z', signer_name: customers[13].full_name, signature_kind: 'presencial', created_by: users.atendimento[0].id });
    ins('appointment', { kind: 'devolucao', customer_id: customers[13].id, reservation_id: rAut.id, starts_at: D(2) + 'T11:00:00', title: 'Devolução', state: 'agendado' });
  }

  /* ==================================================================
     v0.2 · PROVAS
     Uma convertida, uma perdida, uma acontecendo hoje, e uma peça que
     encanta na prova e quase nunca fecha.
     ================================================================== */
  let provaSeq = 0;
  const provaCode = () => { provaSeq++; return `PR-${new Date().getFullYear()}-${String(provaSeq).padStart(4, '0')}`; };

  const criaProva = (cu, quando, state, pecas, extra) => {
    const f = ins('fitting_session', {
      code: provaCode(), customer_id: cu.id, state,
      scheduled_at: quando,
      started_at: state === 'agendada' ? null : quando,
      ended_at: ['convertida', 'perdida', 'no_show', 'concluida'].includes(state) ? quando : null,
      attendant_id: (extra && extra.attendant) || users.atendimento[0].id,
      event_type: (extra && extra.event_type) || null,
      event_date: (extra && extra.event_date) || null,
      budget: (extra && extra.budget) || null,
      notes: (extra && extra.notes) || null,
      outcome_notes: (extra && extra.outcome_notes) || null,
      reservation_id: (extra && extra.reservation_id) || null,
      created_by: users.atendimento[0].id
    });
    pecas.forEach(([g, outcome, nota, ajuste], i) => {
      if (!g) return;
      ins('fitting_item', {
        fitting_session_id: f.id, garment_id: g.id, position: i,
        outcome, needs_alteration: !!ajuste, note: nota || null,
        recorded_by: f.attendant_id,
        recorded_at: outcome === 'nao_provou' ? null : quando
      });
      if (outcome === 'favorita') ins('customer_favorite', {
        customer_id: cu.id, garment_id: g.id, source: 'prova', note: nota || null,
        created_by: f.attendant_id, created_at: quando
      });
    });
    ins('appointment', {
      kind: 'prova', customer_id: cu.id, fitting_id: f.id, starts_at: quando,
      title: 'Prova', state: state === 'agendada' ? 'agendado' : state === 'no_show' ? 'no_show' : 'concluido',
      assigned_to: f.attendant_id, notes: (extra && extra.notes) || null
    });
    return f;
  };

  // 1 · convertida — virou a reserva RS do Verona (Mariana)
  criaProva(customers[0], D(-21) + 'T19:30:00', 'convertida', [
    [byName('Verona'), 'favorita', 'Amou o comprimento e a fenda. Disse que era exatamente o que imaginava.', false],
    [byName('Amalfi'), 'nao_gostou', 'Achou a manga pesada para novembro.', false],
    [byName('Modena'), 'apertada', 'Marcou no quadril; não quis ajuste.', false]
  ], {
    event_type: 'Casamento', event_date: D(7), budget: 1000, reservation_id: rSemana.id,
    notes: 'Trouxe o sapato do evento.', attendant: users.atendimento[0].id,
    outcome_notes: 'Fechou o Verona na hora.'
  });

  // 2 · perdida — orçamento
  criaProva(customers[9], D(-12) + 'T18:00:00', 'perdida', [
    [byName('Portofino'), 'favorita', 'Apaixonou-se, mas disse que passava do orçamento.', false],
    [byName('Bolonha'), 'gostou', 'Gostou, achou parecido demais com um que já usou.', false],
    [byName('Milano'), 'larga', 'Ficou larga no busto; precisaria de ajuste grande.', true]
  ], {
    event_type: 'Premiação', event_date: D(4), budget: 700,
    outcome_notes: 'Ficou de voltar depois do 13º. Peça favorita R$ 1.250, acima do orçamento de R$ 700.',
    attendant: users.atendimento[1].id
  });

  // 3 · hoje, em curso
  const provaHoje = criaProva(customers[5], T + 'T09:00:00', 'em_curso', [
    [byName('Siena'), 'serviu', 'Serviu bem; achou o vermelho forte para o ambiente.', false],
    [byName('Milano'), 'nao_provou', null, false],
    [byName('Bari'), 'nao_provou', null, false]
  ], {
    event_type: 'Jantar de noivado', event_date: D(25), budget: 650,
    notes: 'Quer ver midi e curto, tons sóbrios. Executiva, prefere fora do horário comercial.',
    attendant: users.atendimento[0].id
  });

  // 4 · agendada para amanhã
  criaProva(customers[12], D(2) + 'T15:00:00', 'agendada', [
    [byName('Bolonha'), 'nao_provou', null, false],
    [byName('Firenze'), 'nao_provou', null, false]
  ], { event_type: 'Casamento civil', event_date: D(10), budget: 950, attendant: users.atendimento[1].id });

  // 5 · a peça que encanta e não fecha — Milano: muita prova, nenhuma conversão.
  //     Em quase todas, a cliente levou OUTRA peça: a prova converteu, o Milano não.
  const milano = byName('Milano');
  [[2, 'larga', 'Ficou larga no busto.', true],
   [5, 'nao_gostou', 'Gola alta incomodou.', true],
   [7, 'apertada', 'Alfaiataria não cedeu na cintura.', true],
   [8, 'gostou', 'Gostou do modelo, mas levou o outro que provou junto.', true],
   [10, 'descartada', 'Achou séria demais para festa.', false],
   [1, 'precisa_ajuste', 'Precisaria de ajuste grande na cintura — não compensava.', false]
  ].forEach(([ci, outcome, nota, converteu], i) => {
    const cu = customers[ci];
    // procura uma locação real dessa cliente para amarrar a conversão
    const dela = db.all('reservation').filter(r => r.customer_id === cu.id && r.state === 'finalizada');
    const alvo = converteu && dela.length ? dela[i % dela.length] : null;
    const levada = alvo ? db.get('garment', (db.first('reservation_item', x => x.reservation_id === alvo.id) || {}).garment_id) : null;
    const pecas = [[milano, outcome, nota, outcome === 'precisa_ajuste']];
    if (levada && levada.id !== milano.id) pecas.push([levada, 'favorita', 'Provou junto e levou esta.', false]);
    criaProva(cu, D(-100 + i * 13) + 'T16:00:00', alvo ? 'convertida' : 'perdida', pecas, {
      event_type: pick(EVENTOS), event_date: alvo ? alvo.event_date : null,
      reservation_id: alvo ? alvo.id : null,
      outcome_notes: alvo ? `Levou ${levada ? levada.name : 'outra peça'}; o Milano ficou.` : nota,
      attendant: pick(users.atendimento).id
    });
  });

  // 6 · provas convertidas normais, para a taxa geral ficar realista
  [[0, 'Firenze', -60], [4, 'Lecce', -47], [8, 'Toscana', -33], [2, 'Sorrento', -25], [7, 'Ostuni', -17]
  ].forEach(([ci, nome, quandoD]) => {
    const cu = customers[ci], g = byName(nome); if (!g) return;
    const dela = db.all('reservation').filter(r => r.customer_id === cu.id && r.state === 'finalizada'
      && db.first('reservation_item', x => x.reservation_id === r.id && x.garment_id === g.id));
    const alvo = dela[0];
    if (!alvo) return;
    criaProva(cu, D(quandoD) + 'T18:30:00', 'convertida',
      [[g, 'favorita', 'Fechou na prova.', false]],
      { event_type: alvo.event_type, event_date: alvo.event_date, reservation_id: alvo.id,
        budget: Math.round(g.rental_price * 1.2 / 50) * 50, attendant: pick(users.atendimento).id,
        outcome_notes: 'Saiu daqui com a reserva feita.' });
  });

  /* Favoritos fora da prova */
  [[0, 'Firenze', 'Salvou no Instagram e pediu para guardar.'],
   [2, 'Toscana', 'Quer para o casamento da irmã em dezembro.'],
   [4, 'Lecce', 'Marcou na vitrine.'],
   [7, 'Ostuni', 'Pediu para avisar quando liberar.']
  ].forEach(([ci, nome, nota]) => {
    const g = byName(nome); if (!g) return;
    if (db.data.customer_favorite.some(x => x.customer_id === customers[ci].id && x.garment_id === g.id)) return;
    ins('customer_favorite', {
      customer_id: customers[ci].id, garment_id: g.id, source: 'manual', note: nota,
      created_by: pick(users.atendimento).id,
      created_at: new Date(Date.now() - ri(3, 60) * 864e5).toISOString()
    });
  });

  /* Fotos de inspeção em duas devoluções recentes */
  SZ.sortBy(db.all('garment_inspection'), i => i.inspected_at, -1).slice(0, 3).forEach(insp => {
    ['devolucao', 'detalhe'].forEach((kind, i) => ins('garment_photo', {
      garment_id: insp.garment_id, inspection_id: insp.id, reservation_id: insp.reservation_id,
      url: `storage://inspecoes/${insp.id}/${kind}-${i + 1}.jpg`, kind, position: i, is_cover: false
    }));
  });

  /* --------------------------------------- checklist oficial de inspeção */
  ['Manchas', 'Rasgos e furos', 'Costuras', 'Zíper e fechos', 'Aplicações e pedrarias',
   'Barra', 'Odor', 'Desgaste do tecido', 'Forro', 'Alças e sustentação'
  ].forEach((label, i) => ins('inspection_checklist_item', { label, sort_order: i, is_active: true }));

  ins('contract_template', {
    name: 'Contrato padrão de locação — Senzie Club', version: 1, is_active: true,
    body_md: '(gerado dinamicamente pelo motor de contratos)',
    clauses: { multa_diaria_percent: 20, cancelamento: '15/7 dias', caucao: 'facultativa' }
  });

  db.data._seeded_at = T;
  db.persist();
};

/* =====================================================================
   SENZIE OS — 04 · Casca, roteador e componentes
   ===================================================================== */
const UI = { ACT: {}, VIEWS: {}, state: {} };
SZ.UI = UI;

const el = (sel, root) => (root || document).querySelector(sel);
const els = (sel, root) => Array.from((root || document).querySelectorAll(sel));
UI.el = el; UI.els = els;
UI.val = (sel) => { const n = el(sel); return n ? n.value.trim() : ''; };
UI.numval = (sel) => { const n = el(sel); return n ? (parseFloat(String(n.value).replace(',', '.')) || 0) : 0; };

/* ----------------------------------------------------------- navegação */
/* Cada item do menu declara a permissão que o abre. O menu não é
   escondido "por perfil" — é escondido pela mesma permissão que a rota
   exige, então menu e rota nunca divergem. */
const NAV = [
  { r: '', icon: 'dashboard',    label: 'Dashboard',     perm: 'dashboard.view' },
  { r: 'agenda', icon: 'agenda', label: 'Agenda',        perm: 'agenda.view' },
  { r: 'reservas', icon: 'reservas', label: 'Reservas',  perm: 'reserva.view' },
  { r: 'acervo', icon: 'acervo', label: 'Acervo',        perm: 'acervo.view' },
  { r: 'clientes', icon: 'clientes', label: 'Clientes',  perm: 'cliente.view' },
  { r: 'operacao', icon: 'operacao', label: 'Operação',  perm: 'operacao.view' },
  { r: 'financeiro', icon: 'financeiro', label: 'Financeiro', perm: 'financeiro.view' },
  { r: 'inteligencia', icon: 'inteligencia', label: 'Inteligência', perm: 'inteligencia.view' },
  { r: 'config', icon: 'config', label: 'Configurações', perm: 'config.view' }
];

/* Rotas que não estão no menu também precisam de guarda. */
const ROUTE_PERM = { provas: 'prova.view' };
UI.routePerm = (route) => {
  const n = NAV.find(x => x.r === route);
  return n ? n.perm : (ROUTE_PERM[route] || null);
};
UI.can = (p) => SZ.can(p);

UI.navCounts = () => {
  const db = SZ.db, E = SZ.E;
  return {
    reservas: db.all('reservation').filter(r => SZ.ACTIVE_RESERVATION_STATES.includes(r.state)).length,
    acervo: db.all('garment').filter(g => g.state !== 'baixado').length,
    clientes: db.all('customer').length,
    operacao: db.all('garment').filter(g => ['inspecao', 'higienizacao', 'ajuste', 'manutencao'].includes(g.state)).length,
    agenda: SZ.E.agendaFor(SZ.today()).filter(a => a.state === 'agendado').length
  };
};

UI.renderRail = () => {
  const route = UI.currentRoute();
  const c = UI.navCounts();
  const u = SZ.currentUser();
  const role = u ? SZ.db.get('role', u.role_id) : null;
  const visiveis = NAV.filter(n => !n.perm || SZ.can(n.perm));
  el('#rail').innerHTML = `
    <div class="brand"><span class="mark">Senzie</span><span class="os">OS</span></div>
    <button class="rail-search" data-act="palette">
      ${SZ.icon('busca', 15)}<span>Buscar…</span><kbd>⌘K</kbd>
    </button>
    <nav class="nav" aria-label="Navegação principal">
      ${visiveis.map(n => `<a href="#/${n.r}" class="${route === n.r ? 'on' : ''}" ${route === n.r ? 'aria-current="page"' : ''}>
        ${SZ.icon(n.icon, 16)}<span>${n.label}</span>
        ${c[n.r] != null ? `<span class="count">${c[n.r]}</span>` : ''}
      </a>`).join('')}
    </nav>
    <div class="rail-foot">
      <div class="whoami">
        <button class="av" data-act="userMenu" title="Trocar de usuário" aria-label="Trocar de usuário"
          style="border:1px solid var(--accent-line);cursor:pointer">${SZ.initials(u ? u.full_name : '?')}</button>
        <button class="who" data-act="userMenu" style="background:none;border:none;text-align:left;cursor:pointer;padding:0;min-width:0">
          <b>${SZ.esc(u ? u.full_name : 'Sem sessão')}</b><span>${SZ.esc(role ? role.name : '—')}</span>
        </button>
        <button class="icon-btn" data-act="theme" title="Alternar tema" aria-label="Alternar tema">
          ${SZ.icon(document.documentElement.dataset.theme === 'dark' ? 'sol' : 'lua', 15)}
        </button>
      </div>
    </div>`;
};

/* ------------------------------------------------ troca de sessão (demo)
   → EM PRODUÇÃO: substituído por Supabase Auth (magic link / senha) e a
     sessão vem do JWT, não de um seletor. O seletor existe para que a
     Senzie consiga avaliar o sistema pelos olhos de cada colaboradora. */
UI.ACT.userMenu = () => {
  const atual = SZ.db.session.user_id;
  const users = SZ.db.all('app_user').filter(u => u.is_active !== false);
  UI.modal({
    title: 'Entrar como', sub: 'Troque de colaboradora para ver o sistema como ela vê',
    body: `<div style="display:flex;flex-direction:column;gap:8px">
        ${users.map(u => {
          const role = SZ.db.get('role', u.role_id);
          const n = SZ.effectivePermissions(u).length;
          const on = u.id === atual;
          return `<button data-act="switchUser" data-id="${u.id}" class="card" style="text-align:left;cursor:pointer;
              padding:12px 14px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;
              ${on ? 'box-shadow:0 0 0 1.5px var(--accent), var(--shadow-1)' : ''}">
            <span class="avatar-lg" style="width:36px;height:36px;font-size:13px">${SZ.initials(u.full_name)}</span>
            <span>
              <span style="display:block;font-weight:600;font-size:13.5px">${SZ.esc(u.full_name)}</span>
              <span class="tiny dim">${SZ.esc(role ? role.name : '')} · ${n} permissões · ${SZ.esc(u.job_title || '')}</span>
            </span>
            <span>${on ? SZ.pill('sessão atual', 'green') : SZ.pill('entrar', 'plain')}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="note info">${SZ.icon('escudo')}<span>O menu, as ações e os dados sensíveis mudam conforme o perfil.
        <b>Operação</b> não vê financeiro nem inteligência; <b>Atendimento</b> vê a cobrança da reserva, mas não o
        resultado consolidado da empresa.</span></div>`,
    footer: `<button class="btn" data-act="closeModal">Fechar</button>`
  });
};

UI.ACT.switchUser = (d) => {
  const u = SZ.db.get('app_user', d.id);
  if (!u || u.is_active === false) { UI.toast('Usuário inativo', 'Reative o acesso em Configurações.', 'err'); return; }
  SZ.db.session.user_id = d.id;
  SZ.db.update('app_user', d.id, { last_seen_at: SZ.nowISO() }, { silent: true });
  SZ.db.audit('app_user', d.id, 'update', null, null, `Sessão assumida por ${u.full_name}`);
  UI.closeModal();
  const rota = UI.currentRoute();
  const p = UI.routePerm(rota);
  if (p && !SZ.can(p)) { UI.go('#/'); }
  UI.toast('Sessão trocada', `Agindo como ${u.full_name}.`, 'ok');
  UI.render();
};

/* Tela de acesso restrito — mesma guarda usada pelo menu. */

  const u = SZ.currentUser();

    <div class="view"><section class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:14px;padding:32px">
      <div class="row" style="gap:12px">
        <span class="avatar-lg" style="background:var(--t-stone-bg);color:var(--t-stone);border-color:var(--t-stone-line)">
          ${SZ.icon('escudo', 24)}</span>
        <div>
          <div style="font-family:var(--f-display);font-size:20px">Você não tem acesso a esta área</div>
          <div class="muted" style="font-size:13px;margin-top:3px">
            ${SZ.esc(u ? u.full_name : '')} · ${SZ.esc(role ? role.name : '')} —
            falta a permissão <span class="mono">${SZ.esc(perm)}</span>
            (${SZ.esc(SZ.PERMISSIONS[perm] || '')}).
          </div>
        </div>
      </div>
      <div class="note info">${SZ.icon('escudo')}<span>Peça a um administrador para conceder essa permissão em
        <b>Configurações → Usuários e acessos</b>, ou troque de sessão pelo seu nome no canto inferior.</span></div>
      <div class="row">
        <button class="btn primary" data-act="userMenu">${SZ.icon('clientes', 14)} Trocar de usuário</button>
        <a class="btn" href="#/">Voltar ao início</a>
      </div>
    </div></section></div>`;
};

UI.currentRoute = () => (location.hash.replace(/^#\/?/, '').split('/')[0] || '');
UI.currentId = () => (location.hash.replace(/^#\/?/, '').split('/')[1] || null);
UI.go = (hash) => { location.hash = hash.startsWith('#') ? hash : '#/' + hash; };

UI.header = (title, sub, actions) => `
  <div class="topbar">
    <div><h1 class="display">${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <div class="actions">${actions || ''}</div>
  </div>`;

UI.render = () => {
  const route = UI.currentRoute(), id = UI.currentId();
  SZ.E.expireHolds();
  UI.renderRail();

  /* Guarda de rota: digitar #/financeiro na barra de endereços não burla
     o menu escondido. A permissão que esconde é a mesma que bloqueia. */
  const perm = UI.routePerm(route);
  const view = UI.VIEWS[route];
  if (!view) {
    const inicial = NAV.find(n => SZ.can(n.perm));
    el('#main').innerHTML = inicial && inicial.r !== route
      ? (UI.VIEWS[inicial.r] || UI.VIEWS[''])(null)
      : UI.denied(perm || 'dashboard.view');
  } else if (perm && !SZ.can(perm)) {
    el('#main').innerHTML = UI.denied(perm);
  } else {
    el('#main').innerHTML = view(id);
  }

  window.scrollTo(0, 0);
  els('[data-tabs]').forEach(UI.bindTabs);
  els('[data-chart-hover]').forEach(UI.bindChartHover);
};

  let box = el('#toasts');

  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateX(8px)'; }, 3600);

UI.ACT.palette = () => {
  UI.modal({
    title: 'Busca', sub: 'Peça, cliente, reserva ou contrato',
    body: '', wide: false,
    onMount: (w) => {
      const m = el('.modal', w);
      m.classList.add('pal');
      m.innerHTML = `<input id="pal-q" placeholder="SZ-0187, Mariana, 63 99612…, RS-2026-0004" autocomplete="off" aria-label="Busca global">
        <div class="results" id="pal-r"><div class="empty">Digite para buscar em todo o sistema.</div></div>`;
      const input = el('#pal-q', w), out = el('#pal-r', w);
      let sel = 0, rows = [];
      const draw = () => {
        if (!rows.length) { out.innerHTML = `<div class="empty">${input.value ? 'Nada encontrado para “' + SZ.esc(input.value) + '”.' : 'Digite para buscar em todo o sistema.'}</div>`; return; }
        out.innerHTML = rows.map((r, i) => `<div class="res ${i === sel ? 'sel' : ''}" data-go="${r.route}">
          <span class="tp">${r.type}</span>
          <span><span class="t1">${SZ.esc(r.label)}</span><br><span class="t2">${SZ.esc(r.sub || '')}</span></span></div>`).join('');
        els('.res', out).forEach(n => n.onclick = () => { UI.closeModal(); UI.go(n.dataset.go); });
      };
      input.oninput = () => { rows = SZ.E.search(input.value); sel = 0; draw(); };
      input.onkeydown = (e) => {
        if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault(); }
        if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
        if (e.key === 'Enter' && rows[sel]) { UI.closeModal(); UI.go(rows[sel].route); }
      };
      setTimeout(() => input.focus(), 40);
      draw();
    }
  });
};

/* ============================ GRÁFICOS ==============================
   Uma escala por gráfico; rótulos sempre dentro do viewBox; cores do
   texto vêm dos tokens do tema; série única não leva legenda.
   ==================================================================== */
UI.lineChart = (opts) => {
  const { points, height = 190, valueFmt = SZ.brl0, id = 'lc' + Math.random().toString(36).slice(2, 7) } = opts;
  const W = 760, H = height, padL = 54, padR = 16, padT = 16, padB = 26;
  const max = Math.max.apply(null, points.map(p => p.v).concat([1]));
  const nice = Math.pow(10, Math.floor(Math.log10(max)));
  const top = Math.ceil(max / (nice / 2)) * (nice / 2) || 1;
  const x = (i) => padL + (points.length <= 1 ? 0 : i * (W - padL - padR) / (points.length - 1));
  const y = (v) => padT + (1 - v / top) * (H - padT - padB);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = line + ` L${x(points.length - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const ticks = [0, top / 2, top];
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-chart-hover="${id}" role="img"
      aria-label="${SZ.esc(opts.aria || 'Série temporal')}" preserveAspectRatio="none" style="height:${H}px">
    ${ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--chart-grid)" stroke-width="1"/>
      <text x="${padL - 8}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${valueFmt(t)}</text>`).join('')}
    <path d="${area}" fill="var(--chart-fill)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<g><circle cx="${x(i)}" cy="${y(p.v)}" r="${i === points.length - 1 ? 4 : 2.6}"
        fill="${i === points.length - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>
      <title>${SZ.esc(p.k)} — ${valueFmt(p.v)}</title></g>`).join('')}
    ${points.map((p, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${SZ.esc(p.k)}</text>`).join('')}
    <text x="${x(points.length - 1)}" y="${Math.max(padT + 10, y(last.v) - 10)}" text-anchor="end"
      font-size="11.5" font-weight="600" fill="var(--ink)">${valueFmt(last.v)}</text>
  </svg>`;
};
UI.bindChartHover = () => {};

UI.hbars = (rows, opts = {}) => {
  const max = Math.max.apply(null, rows.map(r => Math.abs(r.v)).concat([1]));
  const fmt = opts.fmt || SZ.num;
  return `<div style="display:flex;flex-direction:column;gap:10px">
    ${rows.map((r, i) => `<div class="bar-line">
      <div class="lb"><span>${r.href ? `<a href="${r.href}">${SZ.esc(r.k)}</a>` : SZ.esc(r.k)}${r.note ? ` <span class="dim tiny">${SZ.esc(r.note)}</span>` : ''}</span>
        <span class="num" style="font-weight:600">${fmt(r.v)}</span></div>
      <div class="tr"><div class="fl" style="width:${Math.max(2, Math.abs(r.v) / max * 100)}%;background:${r.color || 'var(--accent)'}"></div></div>
    </div>`).join('')}
  </div>`;
};

        style="height:${Math.max(3, r.v / max * 100)}%;background:${r.color || 'var(--accent)'};border-radius:4px 4px 2px 2px"></div>
      <div class="tiny dim" style="text-align:center;line-height:1.2">${SZ.esc(r.k)}</div>

  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = UI.ACT[a.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(a.dataset, a, e); }
});

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); UI.ACT.palette(); }

  }
});

UI.authorize = (opts) => {
  const autorizadores = SZ.db.all('app_user')
    .filter(u => u.is_active !== false && SZ.canUser(u, 'reserva.authorize'));
  const eu = SZ.currentUser();
  const possoSozinha = eu && SZ.can('reserva.authorize');

  UI.modal({
    title: opts.title || 'Autorização necessária',
    sub: 'A exceção fica registrada na auditoria com responsável, motivo e horário',
    body: `
      <div class="note amber">${SZ.icon('escudo')}<span>${opts.detail || ''}</span></div>
      ${possoSozinha
        ? `<div class="note green">${SZ.icon('check')}<span><b>${SZ.esc(eu.full_name)}</b> —
             ${SZ.esc((SZ.db.get('role', eu.role_id) || {}).name || '')} pode autorizar esta exceção.</span></div>`
        : `<div class="field"><label for="au-who">Quem está autorizando *</label>
             <select id="au-who"><option value="">— selecionar responsável —</option>
               ${autorizadores.map(u => `<option value="${u.id}">${SZ.esc(u.full_name)} · ${SZ.esc((SZ.db.get('role', u.role_id) || {}).name || '')}</option>`).join('')}
             </select>
             <span class="hint">${SZ.esc(eu ? eu.full_name.split(' ')[0] : 'Este perfil')} não pode autorizar sozinha — é preciso um gestor ou administrador.</span>
           </div>`}
      <div class="field"><label for="au-why">Motivo *</label>
        <input id="au-why" placeholder="Pagamento combinado para as 18h de hoje, cliente recorrente.">
        <span class="hint">Escreva o que você diria a quem auditar isso daqui a três meses.</span></div>`,
    footer: `<button class="btn" data-act="closeModal">Cancelar</button>
             <button class="btn primary" id="au-ok">Autorizar e continuar</button>`,
    onMount: (w) => {
      UI.el('#au-ok', w).onclick = () => {
        const why = UI.val('#au-why');
        if (!why || why.length < 6) { UI.toast('Informe o motivo', 'A exceção precisa de justificativa registrada.', 'err'); return; }
        let user_id = eu ? eu.id : null;

          user_id = UI.val('#au-who');
          if (!user_id) { UI.toast('Selecione o responsável', 'Alguém com permissão precisa autorizar.', 'err'); return; }

};

(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;

  /* ------------------------------------------------- helpers de período */
  const RANGES = { '7': ['Últimos 7 dias', 7], '30': ['Este mês', 30], '90': ['90 dias', 90] };
  UI.state.range = UI.state.range || '30';
  const rangeStart = () => {
    if (UI.state.range === '30') { const d = new Date(); return SZ.ISO(new Date(d.getFullYear(), d.getMonth(), 1)); }
    return SZ.addDays(SZ.today(), -Number(UI.state.range) + 1);
  };
  UI.ACT.setRange = (d) => { UI.state.range = d.r; UI.render(); };

  const revenueBetween = (from, to) => SZ.sum(
    db.all('payment').filter(p => p.state === 'pago' && !['caucao', 'estorno'].includes(p.kind)
      && p.paid_at && p.paid_at.slice(0, 10) >= from && p.paid_at.slice(0, 10) <= to), p => p.amount);

  const rentalsBetween = (from, to) => db.all('reservation').filter(r =>
    SZ.REALIZED_RESERVATION_STATES.includes(r.state) && r.pickup_date >= from && r.pickup_date <= to);

  SZ.metrics = { revenueBetween, rentalsBetween, rangeStart };

  /* ================================================================ */

    const hoje = SZ.today();

                    ? `<button class="btn sm" data-act="doPickup" data-id="${a.reservation.id}">Retirar</button>` : ''}
                  ${a.kind === 'devolucao' && a.reservation && SZ.can('reserva.return') && E.itemSummary(a.reservation.id).retirado > 0

                </span>
              </div>`;
            }).join('')}</div>` : UI.empty('Nenhum compromisso hoje', 'A agenda aparece aqui automaticamente ao criar reservas e provas.')}
          </div>
        </section>

        <section class="card">
          <div class="card-h">
            <h3>Alertas operacionais</h3>
            ${criticos.length ? SZ.pill(`${criticos.length} crítico${criticos.length > 1 ? 's' : ''}`, 'red') : SZ.pill('tudo sob controle', 'green')}
          </div>
          <div class="card-b flush" style="max-height:430px;overflow-y:auto">
            ${alerts.length ? alerts.slice(0, 14).map(a => {
              const tone = a.sev === 'critico' ? 'red' : a.sev === 'atencao' ? 'amber' : 'stone';
              return `<div class="insight" data-go="${a.route}" style="cursor:pointer">
                <span class="ic" style="background:var(--t-${tone}-bg);color:var(--t-${tone})">${SZ.icon(a.icon, 14)}</span>
                <span class="tx"><b>${SZ.esc(a.title)}</b><span class="why">${SZ.esc(a.detail)}</span></span>

          </div>

      <div class="grid g-wide">
        ${SZ.can('financeiro.view') ? `
        <section class="card">
          <div class="card-h">
            <h3>Faturamento recebido</h3>
            <span class="dim tiny">7 meses · corrente parcial</span>
            <div class="actions">
              <div class="seg">${Object.entries(RANGES).map(([k, v]) =>
                `<button class="${UI.state.range === k ? 'on' : ''}" data-act="setRange" data-r="${k}">${v[0]}</button>`).join('')}</div>
            </div>
          </div>
          <div class="card-b">
            <div class="row" style="gap:26px;margin-bottom:14px">
              <div><div class="eyebrow">${RANGES[UI.state.range][0]}</div>
                <div class="display" style="font-size:29px">${SZ.brl0(rev)}</div></div>
              <div><div class="eyebrow">Ticket médio</div>
                <div class="display" style="font-size:29px">${SZ.brl0(ticket)}</div></div>
              <div><div class="eyebrow">Locações</div>
                <div class="display" style="font-size:29px">${rents.length}</div></div>
            </div>
            ${UI.lineChart({ points: serie, height: 180, aria: 'Faturamento recebido por mês' })}
          </div>
        </section>` : `
        <section class="card">
          <div class="card-h"><h3>Provas de hoje e amanhã</h3>
            <div class="actions">${SZ.can('prova.view') ? '<a class="btn sm ghost" href="#/provas">Ver todas</a>' : ''}</div></div>
          <div class="card-b flush">
            ${(() => {
              const proximas = SZ.sortBy(db.all('fitting_session').filter(f => ['agendada', 'em_curso'].includes(f.state)
                && String(f.scheduled_at).slice(0, 10) <= SZ.addDays(hoje, 1)), f => f.scheduled_at);
              if (!proximas.length) return UI.empty('Nenhuma prova em aberto', 'As provas aparecem aqui ao serem agendadas.');
              return proximas.map(f => {
                const cli = db.get('customer', f.customer_id);
                const qtd = db.where('fitting_item', i => i.fitting_session_id === f.id).length;
                return `<div class="ag-item" data-go="#/provas/${f.id}" style="grid-template-columns:62px 1fr auto">
                  <span class="hh">${SZ.ftime(f.scheduled_at)}</span>
                  <span><span class="ttl">${SZ.esc(cli ? cli.full_name : '')}</span>
                    <span class="sub2">${f.code} · ${qtd} peça(s) separada(s)</span></span>
                  <span>${SZ.pill((SZ.FITTING_STATE[f.state] || {}).label || f.state, (SZ.FITTING_STATE[f.state] || {}).tone || 'stone')}</span>

              }).join('');

        <section class="card">

  /* ==================================================== AGENDA GERAL */
  UI.state.agendaDate = null;
  UI.state.agendaView = 'semana';
  UI.state.agendaFilter = 'todos';
  UI.ACT.agendaView = (d) => { UI.state.agendaView = d.v; UI.render(); };
  UI.ACT.agendaMove = (d) => {
    const step = UI.state.agendaView === 'dia' ? 1 : UI.state.agendaView === 'semana' ? 7 : 30;
    UI.state.agendaDate = SZ.addDays(UI.state.agendaDate || SZ.today(), Number(d.n) * step);
    UI.render();
  };
  UI.ACT.agendaToday = () => { UI.state.agendaDate = SZ.today(); UI.render(); };
  UI.ACT.agendaFilter = (d) => { UI.state.agendaFilter = d.k; UI.render(); };

  UI.VIEWS.agenda = function agenda() {
    const base = UI.state.agendaDate || SZ.today();
    const view = UI.state.agendaView;
    let dias = [];
    if (view === 'dia') dias = [base];
    else if (view === 'semana') {
      const start = SZ.addDays(base, -SZ.dow(base));
      for (let i = 0; i < 7; i++) dias.push(SZ.addDays(start, i));
    } else {
      const d = SZ.parse(base);
      const first = new Date(d.getFullYear(), d.getMonth(), 1);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      for (let i = 0; i < last.getDate(); i++) dias.push(SZ.ISO(new Date(d.getFullYear(), d.getMonth(), i + 1)));
    }
    const filtro = UI.state.agendaFilter;
    const tipos = ['todos'].concat(Object.keys(E.AG_KIND));

    const periodoLabel = view === 'dia' ? SZ.fdweek(base)
      : view === 'semana' ? `${SZ.fd(dias[0])} – ${SZ.fdy(dias[6])}`
      : `${SZ.MESL[SZ.parse(base).getMonth()]} de ${SZ.parse(base).getFullYear()}`;

    const blocosDoDia = (d) => {
      // além dos compromissos, a agenda mostra o que o acervo está fazendo
      const blocks = db.all('garment_calendar_block').filter(b => !b.released_at &&
        d >= b.start_date && d <= b.end_date && ['higienizacao', 'manutencao', 'ajuste', 'bloqueio_manual', 'editorial'].includes(b.kind));
      return blocks;
    };

    return UI.header('Agenda', periodoLabel.replace(/^./, c => c.toUpperCase()), `
        <div class="seg">
          <button class="${view === 'dia' ? 'on' : ''}" data-act="agendaView" data-v="dia">Dia</button>
          <button class="${view === 'semana' ? 'on' : ''}" data-act="agendaView" data-v="semana">Semana</button>
          <button class="${view === 'mes' ? 'on' : ''}" data-act="agendaView" data-v="mes">Mês</button>
        </div>
        <button class="icon-btn" data-act="agendaMove" data-n="-1" aria-label="Anterior">${SZ.icon('chevronL', 16)}</button>
        <button class="btn sm" data-act="agendaToday">Hoje</button>
        <button class="icon-btn" data-act="agendaMove" data-n="1" aria-label="Próximo">${SZ.icon('chevron', 16)}</button>`) + `
    <div class="view">
      <div class="chips">
        ${tipos.map(t => `<button class="chip ${filtro === t ? 'on' : ''}" data-act="agendaFilter" data-k="${t}">${t === 'todos' ? 'Todos' : E.AG_KIND[t].label}</button>`).join('')}
      </div>

      ${view === 'mes' ? mesGrid(dias, base, filtro) : `
      <div class="grid g-days" style="gap:12px">
        ${dias.map(d => {
          let items = E.agendaFor(d);
          if (filtro !== 'todos') items = items.filter(i => i.kind === filtro);
          const ops = blocosDoDia(d);
          const isHoje = d === SZ.today();
          return `<section class="card" style="${isHoje ? 'box-shadow:0 0 0 1.5px var(--accent), var(--shadow-1)' : ''}">
            <div class="card-h" style="padding:10px 12px">
              <div><div class="eyebrow">${SZ.DIAS[SZ.dow(d)].slice(0, 3)}</div>
                <h3 style="font-size:15px" class="display">${SZ.fd(d)}</h3></div>
              ${isHoje ? SZ.pill('hoje', 'wine') : ''}
            </div>
            <div class="card-b" style="padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:120px">
              ${items.map(i => {
                const k = E.AG_KIND[i.kind];
                return `<div ${i.reservation ? `data-go="#/reservas/${i.reservation.id}"` : i.customer ? `data-go="#/clientes/${i.customer.id}"` : ''}
                  style="cursor:pointer;border-left:2.5px solid var(--t-${k.tone});padding-left:8px">
                  <div class="mono tiny dim">${i.time}</div>
                  <div style="font-size:12.5px;font-weight:550;line-height:1.3">${k.label}</div>
                  <div class="tiny dim">${SZ.esc(i.customer ? i.customer.full_name : (i.title || ''))}</div>
                </div>`;
              }).join('') || '<div class="tiny dim">—</div>'}
              ${ops.length ? `<div style="margin-top:4px;padding-top:7px;border-top:1px dashed var(--line)">
                ${ops.slice(0, 4).map(b => {
                  const g = db.get('garment', b.garment_id), k = SZ.BLOCK_KIND[b.kind];
                  return `<div class="tiny" style="color:var(--t-${k.tone})" data-go="#/acervo/${b.garment_id}">
                    <span class="mono">${g ? g.code : ''}</span> · ${k.label}</div>`;
                }).join('')}
                ${ops.length > 4 ? `<div class="tiny dim">+${ops.length - 4} peças</div>` : ''}</div>` : ''}
            </div>
          </section>`;
        }).join('')}
      </div>`}
    </div>`;
  };

  function mesGrid(dias, base, filtro) {
    const first = dias[0];
    const pad = SZ.dow(first);
    const cells = [];
    for (let i = 0; i < pad; i++) cells.push(null);
    dias.forEach(d => cells.push(d));
    return `<section class="card"><div class="card-b">
      <div class="cal" style="grid-template-columns:repeat(7,1fr)">
        ${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dow">${d}</div>`).join('')}
        ${cells.map(d => {
          if (!d) return '<div class="d pad"></div>';
          let items = E.agendaFor(d);
          if (filtro !== 'todos') items = items.filter(i => i.kind === filtro);
          const isHoje = d === SZ.today();
          return `<div class="d ${isHoje ? 'today' : ''}" style="aspect-ratio:1/.95;overflow:hidden">
            <span class="n">${SZ.parse(d).getDate()}</span>
            ${items.slice(0, 3).map(i => {
              const k = E.AG_KIND[i.kind];
              return `<span class="tag" style="background:var(--t-${k.tone}-bg);color:var(--t-${k.tone})">${i.time.slice(0, 5)} ${k.label.slice(0, 6)}</span>`;
            }).join('')}
            ${items.length > 3 ? `<span class="tiny dim">+${items.length - 3}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div></section>`;
  }
})();

(function () {

      <div class="seg">

          <div class="field" style="flex:1;min-width:200px">

        </div>
        <div class="chips">
          <button class="chip ${f.cat === 'todas' ? 'on' : ''}" data-act="acFilter" data-k="cat" data-v="todas">Todas as categorias</button>
          ${cats.map(c => `<button class="chip ${f.cat === c.slug ? 'on' : ''}" data-act="acFilter" data-k="cat" data-v="${c.slug}">${c.name}</button>`).join('')}
        </div>
        <div class="chips">
          <button class="chip ${f.st === 'todos' ? 'on' : ''}" data-act="acFilter" data-k="st" data-v="todos">Qualquer estado</button>
          <button class="chip ${f.st === 'disponivel' ? 'on' : ''}" data-act="acFilter" data-k="st" data-v="disponivel">Disponível</button>

      ${list.length === 0 ? `<section class="card">${UI.empty('Nenhuma peça encontrada', 'Ajuste os filtros ou cadastre uma nova peça.')}</section>`
        : f.mode === 'galeria'
        ? `<div class="gallery">${list.map(UI.gcard).join('')}</div>`
        : `<section class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Código</th><th>Peça</th><th>Cor</th><th>Tam.</th><th>Estado</th>
              <th class="r">Locação</th><th class="r">Locações</th><th class="r">Provas</th>
              ${SZ.can('acervo.cost') ? '<th class="r">Receita</th><th class="r">Payback</th>' : ''}</tr></thead>
            <tbody>${list.map(g => {
              const ec = E.economics(g), st = SZ.GARMENT_STATE[g.state], fst = E.fittingStats(g.id);
              return `<tr data-go="#/acervo/${g.id}">
                <td class="mono tiny">${g.code}</td>
                <td class="lead">${SZ.esc(g.name)}<br><span class="dim tiny">${SZ.esc(g.fabric || '')}</span></td>
                <td><span class="row" style="gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:${g.color_hex};border:1px solid var(--line-2);display:inline-block"></i>${SZ.esc(g.color_primary)}</span></td>
                <td>${g.label_size}</td>

  // busca com debounce próprio (o input não é recriado a cada tecla)
  document.addEventListener('input', (e) => {
    if (e.target.id === 'ac-q') {

        UI.state.acervo.q = v; UI.render();
        const n = UI.el('#ac-q'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
      }, 260);
    }
    if (e.target.id === 'cl-q') {
      clearTimeout(UI.state._clT);
      const v = e.target.value;
      UI.state._clT = setTimeout(() => {
        UI.state.clientes.q = v; UI.render();
        const n = UI.el('#cl-q'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
      }, 260);
    }
  });

  /* ------------------------------------------------------------ FICHA */

  };

    const st = SZ.GARMENT_STATE[g.state];
    const ec = E.economics(g);
    const fs = E.fittingStats(g.id);
    const favoritas = db.where('customer_favorite', x => x.garment_id === g.id)
      .map(x => db.get('customer', x.customer_id)).filter(Boolean);
    const provas = SZ.sortBy(db.where('fitting_item', i => i.garment_id === g.id)
      .map(i => ({ i, f: db.get('fitting_session', i.fitting_session_id) }))
      .filter(x => x.f), x => x.f.scheduled_at, -1);
    const buf = E.buffer(g);
    const cat = db.get('garment_category', g.category_id);

  /* ------------------------------------------------- calendário da peça */
  function calendarPane(g, blocks) {
    const anchor = UI.state.calAnchor || SZ.today();
    const d = SZ.parse(anchor);
    const months = [0, 1].map(off => new Date(d.getFullYear(), d.getMonth() + off, 1));
    const hoje = SZ.today();
    const dias = E.calendar(g.id, SZ.today(), SZ.addDays(SZ.today(), 44));

    const usados = {};
    blocks.forEach(b => usados[b.kind] = true);

    const monthGrid = (m) => {
      const first = new Date(m.getFullYear(), m.getMonth(), 1);
      const last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
      const pad = first.getDay();
      const cells = [];
      for (let i = 0; i < pad; i++) cells.push(null);
      for (let i = 1; i <= last.getDate(); i++) cells.push(SZ.ISO(new Date(m.getFullYear(), m.getMonth(), i)));
      return `<div>
        <div class="eyebrow" style="margin-bottom:8px">${SZ.MESL[m.getMonth()]} ${m.getFullYear()}</div>
        <div class="cal">
          ${['d', 's', 't', 'q', 'q', 's', 's'].map((x, i) => `<div class="dow">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][i].slice(0, 3)}</div>`).join('')}
          ${cells.map(c => {
            if (!c) return '<div class="d pad"></div>';
            const b = blocks.find(x => c >= x.start_date && c <= x.end_date);
            const k = b ? SZ.BLOCK_KIND[b.kind] : null;
            const tone = k ? k.tone : (c < hoje ? '' : 'green');
            return `<div class="d ${c === hoje ? 'today' : ''}" ${tone ? `data-tone="${tone}"` : ''} title="${SZ.fdy(c)} — ${k ? k.label : 'Disponível'}">
              <span class="n">${SZ.parse(c).getDate()}</span>
              ${k ? `<span class="tag">${k.tag}</span>` : ''}
            </div>`;
          }).join('')}
        </div></div>`;
    };

    return `<section class="card">
      <div class="card-h">
        <h3>Calendário da peça</h3>
        <span class="dim tiny">a disponibilidade é lida daqui — não de um campo de status</span>
        <div class="actions">
          <button class="icon-btn" data-act="calMove" data-n="-1" aria-label="Mês anterior">${SZ.icon('chevronL', 15)}</button>
          <button class="icon-btn" data-act="calMove" data-n="1" aria-label="Próximo mês">${SZ.icon('chevron', 15)}</button>
        </div>
      </div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:16px">
        <div>
          <div class="eyebrow" style="margin-bottom:6px">Próximos 60 dias</div>
          <div class="strip">${dias.map(x => `<span class="s" data-tone="${x.tone}" title="${SZ.fdy(x.date)} — ${x.label}"></span>`).join('')}</div>
          <div class="row" style="justify-content:space-between;margin-top:5px">
            <span class="tiny dim">${SZ.fd(dias[0].date)}</span><span class="tiny dim">${SZ.fd(dias[dias.length - 1].date)}</span>
          </div>
        </div>
        <div class="grid g2">${months.map(monthGrid).join('')}</div>
        <div class="legend">
          <span><i style="background:var(--t-green-line)"></i>Disponível</span>
          ${Object.entries(SZ.BLOCK_KIND).filter(([k]) => usados[k]).map(([k, v]) =>
            `<span><i style="background:var(--t-${v.tone}-line)"></i>${v.label}</span>`).join('')}
        </div>
        ${blocks.filter(b => b.end_date >= hoje).length ? `
        <div>
          <div class="eyebrow" style="margin-bottom:7px">Compromissos futuros</div>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Período</th><th>Tipo</th><th>Referência</th><th></th></tr></thead>
            <tbody>${SZ.sortBy(blocks.filter(b => b.end_date >= hoje), b => b.start_date).map(b => {
              const k = SZ.BLOCK_KIND[b.kind];
              const r = b.reservation_id ? db.get('reservation', b.reservation_id) : null;
              const c = r ? db.get('customer', r.customer_id) : null;
              return `<tr ${r ? `data-go="#/reservas/${r.id}"` : 'style="cursor:default"'}>
                <td class="mono tiny">${SZ.fd(b.start_date)} – ${SZ.fd(b.end_date)}</td>
                <td>${SZ.pill(k.label, k.tone)}</td>
                <td class="tiny">${r ? `<span class="mono">${r.code}</span> · ${SZ.esc(c ? c.full_name : '')}` : SZ.esc(b.note || '—')}
                  ${b.expires_at ? `<br><span class="dim">expira ${SZ.fdt(b.expires_at)}</span>` : ''}</td>
                <td class="r"><span class="row" style="gap:4px;justify-content:flex-end">
                  <button class="icon-btn" data-act="blockDetail" data-id="${b.id}" title="Detalhes do compromisso" aria-label="Detalhes">${SZ.icon('olho', 15)}</button>
                  ${!r && b.kind === 'bloqueio_manual' && SZ.can('acervo.block') ? `<button class="btn sm ghost" data-act="unblock" data-id="${b.id}">Remover</button>` : ''}
                </span></td>
              </tr>`;
            }).join('')}</tbody></table></div>
        </div>` : ''}
      </div>
    </section>`;
  }

  /* ------------------------------------------------------------ ações */
  UI.ACT.unblock = (d) => {
    E.releaseBlocks(b => b.id === d.id);
    E.reconcile();
    UI.toast('Bloqueio removido', 'O calendário da peça foi liberado.', 'ok');
    UI.render();
  };

  UI.ACT.releaseGarment = (d) => SZ.require('operacao.release', () => {
    const g = db.get('garment', d.id);
    UI.confirm('Liberar peça para o acervo',
      `Encerrar higienização, ajuste ou manutenção em aberto de <b>${SZ.esc(g.name)}</b> (${g.code}) e devolvê-la ao acervo?
       Os bloqueios operacionais atuais serão removidos do calendário.`,
      'Liberar peça', () => {
        const s = E.releaseGarment(d.id, 'Liberada pela Operação');
        UI.toast('Peça liberada', `${g.code} agora está ${SZ.GARMENT_STATE[s].label.toLowerCase()}.`, 'ok');
        UI.render();
      });
  });

  UI.ACT.blockGarment = (d) => SZ.require('acervo.block', () => {
    const g = db.get('garment', d.id);
    UI.modal({
      title: 'Bloquear peça', sub: `${g.code} · ${g.name}`,
      body: `<div class="fgrid">
          <div class="field"><label for="bk-from">Início</label><input type="date" id="bk-from" value="${SZ.today()}"></div>
          <div class="field"><label for="bk-to">Fim</label><input type="date" id="bk-to" value="${SZ.addDays(SZ.today(), 3)}"></div>
          <div class="field full"><label for="bk-note">Motivo</label>
            <input id="bk-note" placeholder="Ensaio fotográfico, empréstimo institucional, avaliação…"></div>
        </div>
        <div class="note info">${SZ.icon('alerta')}<span>O bloqueio ocupa o calendário da peça e impede novas reservas no período.</span></div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="bk-ok">Bloquear</button>`,
      onMount: (w) => {
        UI.el('#bk-ok', w).onclick = () => {
          const from = UI.val('#bk-from'), to = UI.val('#bk-to');
          if (!from || !to || to < from) { UI.toast('Datas inválidas', 'O fim precisa ser igual ou posterior ao início.', 'err'); return; }
          const c = E.check(g.id, from, to);
          if (!c.ok) { UI.toast('Conflito no período', `A peça já tem ${c.conflicts[0].kind.label} de ${c.conflicts[0].period}.`, 'err'); return; }
          E.blockGarment(g.id, from, to, UI.val('#bk-note') || 'Bloqueio manual');
          UI.closeModal(); UI.toast('Peça bloqueada', `${g.code} · ${SZ.fd(from)} a ${SZ.fd(to)}`, 'ok'); UI.render();
        };
      }
    });
  });

  UI.ACT.closeMaint = (d) => SZ.require('operacao.maintenance', () => {
    const m = db.get('garment_maintenance', d.id);
    const g = db.get('garment', m.garment_id);
    UI.modal({
      title: 'Concluir ' + (m.kind === 'higienizacao' ? 'higienização' : 'manutenção'),
      sub: `${g.code} · ${g.name}`,
      body: `<div class="fgrid">
          <div class="field"><label for="mt-cost">Custo (R$)</label><input id="mt-cost" type="number" min="0" step="0.01" value="${m.kind === 'higienizacao' ? '58' : '0'}"></div>
          <div class="field"><label for="mt-prov">Fornecedor</label><input id="mt-prov" value="${SZ.esc(m.provider || '')}"></div>
          <div class="field full"><label for="mt-note">Observação</label><input id="mt-note" placeholder="O que foi feito"></div>
          <label class="field full row" style="flex-direction:row;gap:8px;align-items:center">
            <input type="checkbox" id="mt-release" checked style="width:auto"> <span>Liberar a peça para o acervo ao concluir</span></label>
        </div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="mt-ok">Concluir</button>`,
      onMount: (w) => {
        UI.el('#mt-ok', w).onclick = () => {
          const cost = UI.numval('#mt-cost');
          E.closeMaintenance(m.id, cost, UI.val('#mt-note'));
          if (UI.el('#mt-release').checked) E.releaseGarment(g.id, 'Liberada após ' + m.kind);
          UI.closeModal();
          UI.toast('Concluído', `${g.code} · ${cost ? SZ.brl(cost) + ' lançado no custo da peça' : 'sem custo'}`, 'ok');
          UI.render();
        };
      }
    });
  });

  /* ------------------------------------------------- cadastro de peça */
  const CATS = () => db.all('garment_category');
  const garmentForm = (g) => `
    <div class="fgrid g3c">
      <div class="field"><label for="gf-name">Nome / modelo *</label><input id="gf-name" value="${SZ.esc(g ? g.name : '')}" placeholder="Vestido Verona"></div>
      <div class="field"><label for="gf-cat">Categoria</label><select id="gf-cat">
        ${CATS().map(c => `<option value="${c.slug}" ${g && g.category_slug === c.slug ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label for="gf-brand">Marca</label><input id="gf-brand" list="brands" value="${SZ.esc(g && g.brand_id ? (db.get('brand', g.brand_id) || {}).name : '')}">
        <datalist id="brands">${db.all('brand').map(b => `<option value="${SZ.esc(b.name)}">`).join('')}</datalist></div>
      <div class="field"><label for="gf-size">Tamanho da etiqueta</label><input id="gf-size" value="${SZ.esc(g ? g.label_size : '')}" placeholder="38"></div>
      <div class="field"><label for="gf-equiv">Equivalência</label><select id="gf-equiv">
        ${['PP', 'P', 'M', 'G', 'GG', 'U'].map(s => `<option ${g && g.size_equiv === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="gf-len">Comprimento</label><select id="gf-len">
        ${['curto', 'midi', 'longo'].map(s => `<option ${g && g.length === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="gf-color">Cor</label><input id="gf-color" value="${SZ.esc(g ? g.color_primary : '')}" placeholder="Verde esmeralda"></div>
      <div class="field"><label for="gf-hex">Tom</label><input type="color" id="gf-hex" value="${g ? g.color_hex : '#7A2E43'}" style="padding:3px;height:34px"></div>
      <div class="field"><label for="gf-fabric">Tecido</label><input id="gf-fabric" value="${SZ.esc(g ? g.fabric : '')}" placeholder="Crepe com fenda"></div>
      <div class="field"><label for="gf-neck">Decote</label><input id="gf-neck" value="${SZ.esc(g ? g.neckline : '')}"></div>
      <div class="field"><label for="gf-sleeve">Manga</label><input id="gf-sleeve" value="${SZ.esc(g ? g.sleeve : '')}"></div>
      <div class="field"><label for="gf-style">Estilo</label><input id="gf-style" value="${SZ.esc(g ? g.style : '')}"></div>
      <div class="field"><label for="gf-cost">Custo de aquisição (R$)</label><input type="number" id="gf-cost" min="0" step="0.01" value="${g ? g.acquisition_cost : ''}"></div>
      <div class="field"><label for="gf-ref">Valor de referência (R$)</label><input type="number" id="gf-ref" min="0" step="0.01" value="${g ? g.retail_reference || '' : ''}"></div>
      <div class="field"><label for="gf-price">Valor da locação (R$) *</label><input type="number" id="gf-price" min="0" step="0.01" value="${g ? g.rental_price : ''}"></div>
      <div class="field"><label for="gf-clean">Higienização (dias)</label><input type="number" id="gf-clean" min="0" max="15" value="${g && g.cleaning_days != null ? g.cleaning_days : ''}" placeholder="herda da categoria"></div>
      <div class="field"><label for="gf-loc">Localização física</label><input id="gf-loc" value="${SZ.esc(g ? g.location : '')}" placeholder="Arara B · pos. 4"></div>
      <div class="field"><label for="gf-occ">Ocasiões</label><input id="gf-occ" value="${g ? (g.occasions || []).join(', ') : ''}" placeholder="Casamento, Formatura"></div>
      <div class="field full"><label for="gf-fit">Observações de caimento</label>
        <textarea id="gf-fit" placeholder="Veste um número abaixo. Cintura marcada, costuma precisar de ajuste.">${SZ.esc(g ? g.fit_notes || '' : '')}</textarea></div>
    </div>
    <div class="note info">${SZ.icon('camera')}<span><b>Fotos.</b> Neste pré-MVP a peça é representada por uma silhueta gerada na cor cadastrada.
      No sistema em produção, esta área recebe múltiplas imagens (frente, costas, lateral, detalhe, editorial) via Supabase Storage —
      o modelo de dados já tem a tabela <span class="mono">garment_photo</span> pronta.</span></div>`;

  const readGarment = () => {
    const slug = UI.val('#gf-cat');
    const cat = CATS().find(c => c.slug === slug);
    const bname = UI.val('#gf-brand');
    let brand = bname ? db.first('brand', b => b.name.toLowerCase() === bname.toLowerCase()) : null;
    if (bname && !brand) brand = db.insert('brand', { name: bname }, { batch: true });
    const clean = UI.val('#gf-clean');
    return {
      name: UI.val('#gf-name'), category_id: cat.id, category_slug: slug,
      brand_id: brand ? brand.id : null,
      label_size: UI.val('#gf-size') || 'U', size_equiv: UI.val('#gf-equiv'),
      length: UI.val('#gf-len'), color_primary: UI.val('#gf-color') || 'Sem cor definida',
      color_hex: UI.val('#gf-hex'), fabric: UI.val('#gf-fabric'),
      neckline: UI.val('#gf-neck'), sleeve: UI.val('#gf-sleeve'), style: UI.val('#gf-style'),
      occasions: UI.val('#gf-occ').split(',').map(s => s.trim()).filter(Boolean),
      acquisition_cost: UI.numval('#gf-cost'), retail_reference: UI.numval('#gf-ref') || null,
      rental_price: UI.numval('#gf-price'),
      cleaning_days: clean === '' ? null : Number(clean),
      location: UI.val('#gf-loc'), fit_notes: UI.val('#gf-fit')
    };
  };

  UI.ACT.newGarment = () => SZ.require('acervo.create', () => {
    UI.modal({
      title: 'Nova peça', sub: 'O código é gerado automaticamente na sequência do acervo', wide: true,
      body: garmentForm(null),
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="gf-ok">Cadastrar peça</button>`,
      onMount: (w) => {
        UI.el('#gf-ok', w).onclick = () => {
          const d = readGarment();
          const code = E.nextCode('SZ-', 'garment', 'code');
          const erros = E.validateGarment(Object.assign({ code }, d));
          if (erros.length) { UI.toast('Revise a peça', erros[0], 'err'); return; }
          const g = db.insert('garment', Object.assign({
            code, state: 'disponivel', prep_days: null, allows_alteration: true,
            has_lining: true, deposit_suggested: 0, acquired_at: SZ.today()
          }, d));
          db.insert('garment_measurement', { garment_id: g.id }, { batch: true });
          db.insert('garment_state_history', {
            garment_id: g.id, from_state: null, to_state: 'disponivel',
            reason: 'Peça cadastrada no acervo', ref_type: 'manual',
            occurred_at: SZ.nowISO(), user_id: db.session.user_id
          }, { batch: true });
          if (d.acquisition_cost > 0) db.insert('expense', {
            garment_id: g.id, kind: 'aquisicao', amount: d.acquisition_cost,
            incurred_at: SZ.today(), description: 'Compra da peça', created_by: db.session.user_id
          }, { batch: true });
          db.persist();
          UI.closeModal();
          UI.toast('Peça cadastrada', `${code} · ${g.name} já está disponível para reserva.`, 'ok');
          UI.go('#/acervo/' + g.id);
        };
      }
    });
  });

  UI.ACT.editGarment = (d) => SZ.require('acervo.edit', () => {
    const g = db.get('garment', d.id);
    UI.modal({
      title: 'Editar peça', sub: `${g.code} · alterações ficam registradas na auditoria`, wide: true,
      body: garmentForm(g),
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="gf-ok">Salvar</button>`,
      onMount: (w) => {
        UI.el('#gf-ok', w).onclick = () => {
          const d2 = readGarment();
          const erros = E.validateGarment(Object.assign({ code: g.code }, d2), g.id);
          if (erros.length) { UI.toast('Revise a peça', erros[0], 'err'); return; }
          db.update('garment', g.id, d2, { note: 'Edição da ficha da peça' });
          UI.closeModal(); UI.toast('Peça atualizada', g.code, 'ok'); UI.render();
        };
      }
    });
  });
})();

/* =====================================================================
   v0.2 · complementos do acervo

(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;

  /* Detalhe de um compromisso do calendário — por que a peça está ocupada. */
  UI.ACT.blockDetail = (d) => {
    const b = db.get('garment_calendar_block', d.id); if (!b) return;
    const g = db.get('garment', b.garment_id);
    const k = SZ.BLOCK_KIND[b.kind] || { label: b.kind, tone: 'stone' };
    const r = b.reservation_id ? db.get('reservation', b.reservation_id) : null;
    const c = r ? db.get('customer', r.customer_id) : null;
    const m = b.maintenance_id ? db.get('garment_maintenance', b.maintenance_id) : null;
    const quem = b.created_by ? db.get('app_user', b.created_by) : null;
    const dias = SZ.diffDays(b.start_date, b.end_date) + 1;

    UI.modal({
      title: k.label, sub: `${g ? g.code + ' · ' + g.name : ''}`,
      body: `
        <div class="row" style="gap:10px">${SZ.pill(k.label, k.tone)}
          ${b.released_at ? SZ.pill('encerrado', 'stone') : SZ.pill('ativo', 'green')}
          ${b.expires_at ? SZ.pill('expira ' + SZ.fdt(b.expires_at), 'amber') : ''}</div>
        <dl class="kv" style="grid-template-columns:150px 1fr">
          <dt>Período</dt><dd>${SZ.fdy(b.start_date)} a ${SZ.fdy(b.end_date)} <span class="dim">(${dias} dia${dias > 1 ? 's' : ''})</span></dd>
          <dt>Motivo</dt><dd>${SZ.esc(b.note || k.label)}</dd>
          ${r ? `<dt>Reserva</dt><dd><a href="#/reservas/${r.id}">${r.code}</a> · ${(SZ.RESERVATION_STATE[r.state] || {}).label}</dd>` : ''}
          ${r && c && SZ.can('cliente.view') ? `<dt>Cliente</dt><dd><a href="#/clientes/${c.id}">${SZ.esc(c.full_name)}</a></dd>` : ''}
          ${r ? `<dt>Evento</dt><dd>${SZ.esc(r.event_type || '—')} em ${SZ.fdy(r.event_date)}</dd>` : ''}
          ${m ? `<dt>Ordem de serviço</dt><dd>${SZ.esc(SZ.MAINTENANCE_KIND[m.kind] || m.kind)} · ${SZ.esc(m.description || '')}</dd>` : ''}
          ${m && m.provider ? `<dt>Fornecedor</dt><dd>${SZ.esc(m.provider)}</dd>` : ''}
          <dt>Registrado por</dt><dd>${SZ.esc(quem ? quem.full_name : 'sistema')} · ${SZ.fdt(b.created_at)}</dd>
        </dl>
        <div class="note info">${SZ.icon('agenda')}<span>Enquanto este compromisso existir, nenhuma reserva pode ser
          confirmada para a peça neste período — nem pela tela, nem pela busca de disponibilidade.</span></div>`,
      footer: `<button class="btn" data-act="closeModal">Fechar</button>
        ${!r && b.kind === 'bloqueio_manual' && !b.released_at && SZ.can('acervo.block')
          ? `<button class="btn danger" data-act="unblock" data-id="${b.id}">Remover bloqueio</button>` : ''}`
    });
  };

  /* Caimento observado — alimentado manualmente pelas atendentes. */
  UI.ACT.editFit = (d) => SZ.require('acervo.edit', () => {
    const g = db.get('garment', d.id);
    const meas = db.first('garment_measurement', m => m.garment_id === g.id) || {};
    UI.modal({
      title: 'Caimento observado', sub: `${g.code} · ${g.name}`,
      body: `
        <div class="note info">${SZ.icon('regua')}<span>Isto não é a etiqueta — é o que a equipe aprendeu vestindo a peça.
          É o dado que responde “será que serve nela?” antes de a cliente chegar.</span></div>
        <div class="fgrid">
          <div class="field full"><label for="ft-runs">Como veste</label><select id="ft-runs">
            <option value="">— não registrado —</option>
            ${Object.entries(SZ.FIT_RUNS).map(([k, v]) => `<option value="${k}" ${g.fit_runs === k ? 'selected' : ''}>${v}</option>`).join('')}
          </select></div>
          <div class="field"><label for="ft-bust">Busto confortável até (cm)</label>
            <input type="number" id="ft-bust" min="0" value="${g.bust_comfort_cm || ''}" placeholder="${meas.bust_cm || ''}"></div>
          <div class="field"><label for="ft-waist">Cintura máxima observada (cm)</label>
            <input type="number" id="ft-waist" min="0" value="${g.waist_max_cm || ''}" placeholder="${meas.waist_cm || ''}"></div>
          <div class="field"><label for="ft-hip">Quadril máximo observado (cm)</label>
            <input type="number" id="ft-hip" min="0" value="${g.hip_max_cm || ''}" placeholder="${meas.hip_cm || ''}"></div>
          <div class="field"><label for="ft-heel">Barra prevista para salto (cm)</label>
            <input type="number" id="ft-heel" min="0" max="20" value="${g.hem_heel_cm || ''}" placeholder="9"></div>
          <div class="field full"><label for="ft-alt">Ajuste mais comum</label>
            <input id="ft-alt" value="${SZ.esc(g.common_alteration || '')}" placeholder="Pences na cintura; barra solta 2 cm"></div>
          <div class="field full"><label for="ft-notes">Observação de caimento</label>
            <textarea id="ft-notes" placeholder="Veste um número abaixo. Cintura marcada, quase sempre precisa de ajuste.">${SZ.esc(g.fit_notes || '')}</textarea></div>
        </div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="ft-ok">Salvar</button>`,
      onMount: (w) => {
        UI.el('#ft-ok', w).onclick = () => {
          db.update('garment', g.id, {
            fit_runs: UI.val('#ft-runs') || null,
            bust_comfort_cm: UI.numval('#ft-bust') || null,
            waist_max_cm: UI.numval('#ft-waist') || null,
            hip_max_cm: UI.numval('#ft-hip') || null,
            hem_heel_cm: UI.numval('#ft-heel') || null,
            common_alteration: UI.val('#ft-alt') || null,
            fit_notes: UI.val('#ft-notes') || null
          }, { note: 'Atualização do caimento observado' });
          UI.closeModal(); UI.toast('Caimento atualizado', `${g.code} · aparece na prova e na busca de peça`, 'ok'); UI.render();
        };
      }
    });
  });
})();


/* ═══════════ 07-views-clientes.js ═══════════ */
/* =====================================================================
   SENZIE OS — 07 · Clientes / CRM e memória de atendimento
   ===================================================================== */
(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;
  UI.state.clientes = { q: '', sort: 'nome' };
  UI.ACT.clSort = (d) => { UI.state.clientes.sort = d.v; UI.render(); };

  UI.VIEWS.clientes = function clientes(id) {
    if (id) return customerDetail(id);
    const f = UI.state.clientes;
    const norm = SZ.norm;
    let list = db.all('customer');
    if (f.q) list = list.filter(c => norm(`${c.full_name} ${c.phone} ${c.whatsapp} ${c.instagram} ${c.code} ${c.city}`).includes(norm(f.q)));
    const withStats = list.map(c => ({ c, s: E.customerStats(c) }));
    if (f.sort === 'nome') withStats.sort((a, b) => a.c.full_name.localeCompare(b.c.full_name, 'pt-BR'));
    if (f.sort === 'gasto') withStats.sort((a, b) => b.s.spent - a.s.spent);
    if (f.sort === 'locacoes') withStats.sort((a, b) => b.s.rentals - a.s.rentals);
    if (f.sort === 'recente') withStats.sort((a, b) => String(b.c.created_at).localeCompare(String(a.c.created_at)));

    const todas = db.all('customer');
    const stats = todas.map(c => E.customerStats(c));

/* ═══════════ 08-views-reservas.js ═══════════ */
/* =====================================================================
   SENZIE OS — 08 · Reservas: fluxo completo, conflito e contrato
   ===================================================================== */
(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;
  UI.state.reservas = { filtro: 'ativas' };
  UI.ACT.rsFilter = (d) => { UI.state.reservas.filtro = d.v; UI.render(); };

  const FILTROS = [
    ['ativas', 'Ativas'], ['hoje', 'Hoje'], ['pre', 'Pré-reservas'],
    ['pagamento', 'Aguardando pagamento'], ['rua', 'Fora da loja'],
    ['inspecao', 'Em inspeção'], ['futuras', 'Futuras'], ['encerradas', 'Encerradas'], ['todas', 'Todas']
  ];

  UI.VIEWS.reservas = function reservas(id) {
    if (id) return reservationDetail(id);
    const hoje = SZ.today();
    const f = UI.state.reservas.filtro;
    let list = db.all('reservation');
    const A = SZ.ACTIVE_RESERVATION_STATES;
    if (f === 'ativas') list = list.filter(r => A.includes(r.state) || r.state === 'em_inspecao' || r.state === 'prova_agendada');
    if (f === 'hoje') list = list.filter(r => r.pickup_date === hoje || r.return_due_date === hoje || r.event_date === hoje);
    if (f === 'pre') list = list.filter(r => r.state === 'pre_reserva');
    if (f === 'pagamento') list = list.filter(r => r.state === 'aguardando_pagamento' || (A.includes(r.state) && E.balance(r).due > 0));
    if (f === 'rua') list = list.filter(r => ['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state));
    if (f === 'inspecao') list = list.filter(r => ['devolvida', 'em_inspecao'].includes(r.state));
    if (f === 'futuras') list = list.filter(r => A.includes(r.state) && r.pickup_date > hoje);
    if (f === 'encerradas') list = list.filter(r => ['finalizada', 'cancelada', 'no_show'].includes(r.state));
    list = SZ.sortBy(list, r => r.pickup_date || r.created_at, f === 'encerradas' ? -1 : 1);

    const ativas = db.all('reservation').filter(r => A.includes(r.state));
    const receitaAberta = SZ.sum(ativas, r => E.balance(r).due);

    return UI.header('Reservas',
      `${ativas.length} em curso${SZ.can('financeiro.view') ? ` · ${SZ.brl0(receitaAberta)} a receber` : ''}`, `
      ${SZ.can('reserva.create') ? `<button class="btn primary" data-act="newReservation">${SZ.icon('plus', 14)} Nova reserva</button>` : ''}`) + `
    <div class="view">
      <section class="card"><div class="card-b"><div class="chips">
        ${FILTROS.map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="rsFilter" data-v="${k}">${l}</button>`).join('')}
      </div></div></section>

      <section class="card"><div class="card-b flush">
        ${list.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Reserva</th><th>Cliente</th><th>Peças</th><th>Evento</th><th>Retirada → Devolução</th>
            <th>Estado</th>${SZ.can('financeiro.view') ? '<th>Pagamento</th><th class="r">Valor</th>' : ''}</tr></thead>
          <tbody>${list.map(r => {
            const c = db.get('customer', r.customer_id);
            const gs = db.where('reservation_item', i => i.reservation_id === r.id).map(i => db.get('garment', i.garment_id)).filter(Boolean);
            const bal = E.balance(r);
            const atrasada = r.return_due_date < hoje && ['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state);
            return `<tr data-go="#/reservas/${r.id}">
              <td class="mono tiny">${r.code}</td>
              <td class="lead">${SZ.esc(c ? c.full_name : '—')}</td>
              <td class="tiny">${gs.map(g => `<span class="mono">${g.code}</span> ${SZ.esc(g.name.replace(/^(Vestido|Macacão|Conjunto|Saia|Clutch) /, ''))}`).join('<br>')}</td>
              <td class="tiny">${SZ.fd(r.event_date)}<br><span class="dim">${SZ.esc(r.event_type || '')}</span></td>
              <td class="tiny mono">${SZ.fd(r.pickup_date)} → ${SZ.fd(r.return_due_date)}
                ${atrasada ? `<br><span style="color:var(--t-red);font-weight:600">${SZ.diffDays(r.return_due_date, hoje)}d de atraso</span>` : ''}</td>
              <td>${SZ.resPill(r.state)}</td>
              ${SZ.can('financeiro.view') ? `<td>${['cancelada', 'no_show', 'atendimento', 'prova_agendada'].includes(r.state) ? '<span class="dim tiny">—</span>'
                    : SZ.pill(E.PAYSTATE[bal.status].label, E.PAYSTATE[bal.status].tone)}</td>
              <td class="r num">${SZ.brl0(r.total_net)}${bal.due > 0 && !['cancelada', 'no_show'].includes(r.state) ? `<br><span class="dim tiny">falta ${SZ.brl0(bal.due)}</span>` : ''}</td>` : ''}
            </tr>`;
          }).join('')}</tbody></table></div>` : UI.empty('Nenhuma reserva neste filtro', 'Troque o filtro acima ou crie uma nova reserva.')}
      </div></section>
    </div>`;
  };

  /* ------------------------------------------------------ FICHA RESERVA */
  function reservationDetail(id) {
    const r = db.get('reservation', id);
    if (!r) return UI.header('Reserva não encontrada', '') + `<div class="view"><section class="card">${UI.empty('Reserva não encontrada', '')}</section></div>`;
    const c = db.get('customer', r.customer_id);
    const items = db.where('reservation_item', i => i.reservation_id === r.id)
      .map(i => ({ i, g: db.get('garment', i.garment_id) })).filter(x => x.g);
    const bal = E.balance(r);
    const pays = SZ.sortBy(E.payments(r), p => p.paid_at || p.created_at, -1);
    const contrato = db.first('contract', ct => ct.reservation_id === r.id);
    const hist = SZ.sortBy(db.where('reservation_state_history', h => h.reservation_id === r.id), h => h.occurred_at, -1);
    const hoje = SZ.today();
    const atraso = ['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state) ? Math.max(0, SZ.diffDays(r.return_due_date, hoje)) : 0;
    const st = SZ.RESERVATION_STATE[r.state];

    const resumo = E.itemSummary(r.id);
    const podeRetirar = resumo.pendente + resumo.nao_entregue > 0;
    const podeDevolver = resumo.retirado > 0;
    const autorizacoes = db.where('exception_authorization', a => a.reservation_id === r.id);
    const prova = db.first('fitting_session', f => f.reservation_id === r.id);

    const acoes = [];
    if (r.state === 'pre_reserva' && SZ.can('reserva.confirm'))
      acoes.push(`<button class="btn primary" data-act="confirmRes" data-id="${r.id}">${SZ.icon('check', 14)} Confirmar reserva</button>`);
    if (['aguardando_pagamento', 'confirmada', 'pronta_retirada', 'pre_reserva'].includes(r.state) && bal.due > 0 && SZ.can('financeiro.payment'))
      acoes.push(`<button class="btn ${r.state === 'aguardando_pagamento' ? 'primary' : ''}" data-act="addPayment" data-id="${r.id}">${SZ.icon('moeda', 14)} Registrar pagamento</button>`);
    if (['confirmada', 'pronta_retirada', 'aguardando_pagamento', 'retirada'].includes(r.state) && podeRetirar && SZ.can('reserva.pickup'))
      acoes.push(`<button class="btn ${bal.due <= 0 ? 'primary' : ''}" data-act="doPickup" data-id="${r.id}">${SZ.icon('presente', 14)} ${resumo.retirado ? 'Retirar o restante' : 'Registrar retirada'}</button>`);
    if (podeDevolver && SZ.can('reserva.return'))
      acoes.push(`<button class="btn primary" data-act="doReturn" data-id="${r.id}">${SZ.icon('refresh', 14)} Registrar devolução</button>`);
    if (['devolvida', 'em_inspecao'].includes(r.state) && SZ.can('operacao.inspect'))
      acoes.push(`<button class="btn primary" data-act="goInspect" data-id="${r.id}">${SZ.icon('operacao', 14)} Inspecionar peças</button>`);
    if (!['finalizada', 'cancelada', 'no_show'].includes(r.state) && SZ.can('reserva.cancel'))
      acoes.push(`<button class="btn" data-act="cancelRes" data-id="${r.id}">${SZ.icon('x', 14)} Cancelar</button>`);

    return UI.header(r.code, `${SZ.esc(c ? c.full_name : '')} · ${SZ.esc(r.event_type || 'Evento')} em ${SZ.fdlong(r.event_date)}`,
      acoes.join('')) + `
    <div class="view">
      ${atraso > 0 ? `<div class="note red">${SZ.icon('alerta')}<span><b>Devolução atrasada em ${atraso} dia(s).</b>
        Prevista para ${SZ.fdy(r.return_due_date)}. A multa contratual é de ${E.cfg().late_fee_percent}% ao dia sobre ${SZ.brl(r.total_net)} —
        ${SZ.brl(r.total_net * E.cfg().late_fee_percent / 100 * atraso)} até agora. As peças seguem bloqueadas para novas reservas.</span></div>` : ''}
      ${r.state === 'pre_reserva' && r.hold_expires_at ? `<div class="note amber">${SZ.icon('relogio')}
        <span><b>Pré-reserva expira ${SZ.fdt(r.hold_expires_at)}.</b> Se não for confirmada, as peças voltam automaticamente ao acervo.</span></div>` : ''}
      ${r.state === 'cancelada' ? `<div class="note info">${SZ.icon('x')}<span><b>Reserva cancelada.</b> ${SZ.esc(r.cancel_reason || '')}</span></div>` : ''}

      <div class="profile">
        <aside class="side">
          <section class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:13px">
            <div class="spread"><span class="eyebrow">Estado</span>${SZ.resPill(r.state)}</div>
            <dl class="kv">
              <dt>Cliente</dt><dd><a href="#/clientes/${c.id}">${SZ.esc(c.full_name)}</a></dd>
              <dt>Contato</dt><dd>${SZ.esc(c.whatsapp || c.phone || '—')}</dd>
              <dt>Evento</dt><dd>${SZ.esc(r.event_type || '—')}</dd>
              <dt>Data do evento</dt><dd>${SZ.fdy(r.event_date)}</dd>
              <dt>Local</dt><dd>${SZ.esc(r.event_venue || '—')}</dd>
              <dt>Retirada</dt><dd>${SZ.fdy(r.pickup_date)} <span class="dim">${SZ.rel(r.pickup_date)}</span></dd>
              <dt>Devolução</dt><dd>${SZ.fdy(r.return_due_date)} <span class="dim">${SZ.rel(r.return_due_date)}</span></dd>
              <dt>Canal</dt><dd>${SZ.esc(r.channel || '—')}</dd>
            </dl>
            ${SZ.can('financeiro.view') ? `
            <hr class="sep">
            <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
              <div class="spread"><span class="muted">Locação</span><span class="num">${SZ.brl(r.total_gross)}</span></div>
              ${r.discount ? `<div class="spread"><span class="muted">Desconto</span><span class="num">− ${SZ.brl(r.discount)}</span></div>` : ''}
              ${r.late_fee ? `<div class="spread"><span class="muted">Multa por atraso</span><span class="num" style="color:var(--t-red)">${SZ.brl(r.late_fee)}</span></div>` : ''}
              <div class="spread" style="font-weight:650"><span>Total</span><span class="num">${SZ.brl(bal.devido)}</span></div>
              <div class="spread"><span class="muted">Pago</span><span class="num">${SZ.brl(bal.pago)}</span></div>
              <div class="spread" style="font-weight:650"><span>Saldo</span>
                <span class="num" style="color:${bal.due > 0 ? 'var(--t-red)' : 'var(--t-green)'}">${SZ.brl(bal.due)}</span></div>
            </div>` : ''}
            ${r.notes ? `<div class="note info">${SZ.icon('editar')}<span>${SZ.esc(r.notes)}</span></div>` : ''}
          </div></section>
        </aside>

        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          ${prova ? `<div class="note info">${SZ.icon('prova')}<span>Esta reserva nasceu da prova
            <a href="#/provas/${prova.id}">${prova.code}</a> de ${SZ.fdy(String(prova.scheduled_at).slice(0, 10))}.</span></div>` : ''}
