          ${autorizacoes.length ? autorizacoes.map(a => `<div class="note amber">${SZ.icon('escudo')}<span>
            <b>Exceção autorizada.</b> ${a.kind === 'retirada_com_saldo' ? 'Retirada com saldo de' : 'Desconto de'}
            ${SZ.brl(a.amount)} autorizado por ${SZ.esc(a.authorized_by_name)} — ${SZ.esc(a.authorized_by_role)},
            em ${SZ.fdt(a.authorized_at)}.<br><span style="opacity:.85">Motivo: ${SZ.esc(a.reason || 'não informado')}</span></span></div>`).join('') : ''}

          <section class="card">
            <div class="card-h">
              <h3>Peças da reserva</h3>
              <span class="dim tiny">${items.length} item(ns) · ${resumo.retirado} com a cliente · ${resumo.devolvido + resumo.inspecionado} de volta</span>
            </div>
            <div class="card-b flush">
              ${items.map((x, idx) => {
                const st = SZ.ITEM_STATE[x.i.item_state || 'pendente'] || SZ.ITEM_STATE.pendente;
                const rateio = (Number(x.i.allocated_order_discount) || 0) > 0;
                return `<div style="padding:12px 16px;border-bottom:${idx === items.length - 1 ? 'none' : '1px solid var(--line)'};
                    display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:start">
                  <span style="width:52px;height:68px;border-radius:5px;overflow:hidden;cursor:pointer" data-go="#/acervo/${x.g.id}">${SZ.silhouette(x.g)}</span>
                  <span style="min-width:0;cursor:pointer" data-go="#/acervo/${x.g.id}">
                    <span style="display:block;font-weight:600;font-size:13.5px">${SZ.esc(x.g.name)}
                      <span class="mono dim tiny">${x.g.code}</span></span>
                    <span class="tiny dim" style="display:block">${SZ.esc(x.g.color_primary)} · tam. ${x.g.label_size} ·
                      estado da peça: ${(SZ.GARMENT_STATE[x.g.state] || {}).label}</span>
                    ${x.i.alteration_notes ? `<span class="tiny" style="display:block;color:var(--t-ochre);margin-top:3px">${SZ.icon('costura', 11)} ${SZ.esc(x.i.alteration_notes)}</span>` : ''}
                    ${x.i.pickup_note ? `<span class="tiny" style="display:block;color:var(--ink-2);margin-top:3px">Retirada: ${SZ.esc(x.i.pickup_note)}</span>` : ''}
                    ${x.i.return_note ? `<span class="tiny" style="display:block;color:var(--ink-2);margin-top:3px">Devolução: ${SZ.esc(x.i.return_note)}</span>` : ''}
                    <span class="tiny dim" style="display:block;margin-top:3px">
                      ${x.i.picked_up_at ? `saiu ${SZ.fdt(x.i.picked_up_at)}` : 'ainda na loja'}${x.i.returned_at ? ` · voltou ${SZ.fdt(x.i.returned_at)}` : ''}</span>
                  </span>
                  <span style="text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end">
                    ${SZ.pill(st.label, st.tone)}
                    ${SZ.can('financeiro.view') ? `<span class="num" style="font-weight:600">${SZ.brl(E.itemRevenue(x.i))}</span>
                      ${rateio ? `<span class="tiny dim">${SZ.brl(x.i.gross_amount)} − ${SZ.brl(x.i.allocated_order_discount)} de rateio</span>` : ''}` : ''}
                  </span>
                </div>`;
              }).join('')}
            </div>
          </section>

          ${UI.tabs('r', [
            SZ.can('financeiro.view') ? { k: 'pag', label: 'Pagamentos', n: pays.length } : null,
            { k: 'ct', label: 'Contrato' },
            { k: 'hist', label: 'Histórico' }
          ].filter(Boolean))}

          ${SZ.can('financeiro.view') ? UI.pane('r', 'pag', `<section class="card">
            <div class="card-h"><h3>Pagamentos</h3>
              ${SZ.pill(E.PAYSTATE[bal.status].label, E.PAYSTATE[bal.status].tone)}
              <div class="actions"><button class="btn sm" data-act="addPayment" data-id="${r.id}">${SZ.icon('plus', 13)} Lançar</button></div></div>
            <div class="card-b flush">${pays.length ? `<div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Data</th><th>Tipo</th><th>Forma</th><th>Situação</th><th>Referência</th><th class="r">Valor</th></tr></thead>
              <tbody>${pays.map(p => `<tr style="cursor:default">
                <td class="mono tiny">${p.paid_at ? SZ.fdy(p.paid_at.slice(0, 10)) : (p.due_at ? 'vence ' + SZ.fd(p.due_at) : '—')}</td>
                <td class="tiny">${SZ.PAYMENT_KIND[p.kind] || p.kind}</td>
                <td class="tiny">${SZ.PAYMENT_METHOD[p.method] || p.method}</td>
                <td>${SZ.pill({ pago: 'Pago', pendente: 'Pendente', parcial: 'Parcial', estornado: 'Estornado', cancelado: 'Cancelado' }[p.state],
                  p.state === 'pago' ? 'green' : p.state === 'pendente' ? 'amber' : 'stone')}</td>
                <td class="tiny dim">${SZ.esc(p.notes || p.reference || '')}</td>
                <td class="r num">${SZ.brl(p.amount)}</td></tr>`).join('')}</tbody></table></div>`
              : UI.empty('Nenhum pagamento lançado', 'Registre o sinal ou o valor integral.')}
            </div></section>`, true) : ''}

          ${UI.pane('r', 'ct', `<section class="card">
            <div class="card-h"><h3>Contrato de locação</h3>
              ${contrato ? `<span class="dim tiny mono">${contrato.number}${contrato.signed_at ? ' · assinado ' + SZ.fdy(contrato.signed_at.slice(0, 10)) : ' · não assinado'}</span>` : ''}
              <div class="actions">
                <button class="btn sm" data-act="viewContract" data-id="${r.id}">${SZ.icon('doc', 13)} Visualizar</button>
                <button class="btn sm" data-act="copyContract" data-id="${r.id}">${SZ.icon('copiar', 13)} Copiar texto</button>
              </div></div>
            <div class="card-b" style="display:flex;flex-direction:column;gap:12px">
              <div class="note info">${SZ.icon('doc')}<span>O contrato é gerado a partir dos dados da reserva no momento da confirmação e
                guardado como <b>snapshot imutável</b> — mudar o preço da peça depois não altera o contrato já emitido.</span></div>
              <div class="row">
                <button class="btn" disabled>${SZ.icon('doc', 14)} Gerar PDF</button>
                <button class="btn" disabled>${SZ.icon('check', 14)} Assinatura eletrônica</button>
                <button class="btn" disabled>${SZ.icon('seta', 14)} Enviar por WhatsApp</button>
                <span class="tiny dim">previstos na arquitetura · fora do escopo deste pré-MVP</span>
              </div>
              ${!c.document ? `<div class="note amber">${SZ.icon('alerta')}<span>A cliente ainda não tem CPF cadastrado.
                O contrato sai com o campo em branco — <a href="#" data-act="editCustomer" data-id="${c.id}">completar cadastro</a>.</span></div>` : ''}
            </div></section>`, !SZ.can('financeiro.view'))}

          ${UI.pane('r', 'hist', `<section class="card">
            <div class="card-h"><h3>Histórico da reserva</h3></div>
            <div class="card-b"><div class="tline">
              ${hist.map(h => `<div class="ev">
                <span class="dt">${SZ.fdt(h.occurred_at)}</span>
                <span class="ln"><i style="background:var(--t-${(SZ.RESERVATION_STATE[h.to_state] || { tone: 'stone' }).tone})"></i></span>
                <span class="bd"><span class="t2">${(SZ.RESERVATION_STATE[h.to_state] || {}).label || h.to_state}</span>
                  <span class="n2">${SZ.esc(h.reason || '')}${h.user_id ? ' · ' + SZ.esc(((db.get('app_user', h.user_id) || {}).full_name || '').split(' ')[0]) : ''}</span></span>
              </div>`).join('')}
            </div></div></section>`)}
        </div>
      </div>
    </div>`;
  }

  /* =================================================== NOVA RESERVA */
  UI.ACT.newReservation = (d) => {
    if (!SZ.can('reserva.create')) return SZ.require('reserva.create', () => {});
    const daProva = (d.garments || '').split(',').filter(Boolean);
    const S = {
      customer_id: d.customer || '',
      garments: d.garment ? [d.garment] : daProva,
      fitting_id: d.fitting || null,
      event_date: d.eventDate || SZ.addDays(SZ.today(), 10),
      pickup_offset: 2, return_offset: 1,
      discount: 0, q: '', notes: '', event_type: d.eventType || 'Casamento'
    };
    const dates = () => ({
      pickup: SZ.addDays(S.event_date, -S.pickup_offset),
      ret: SZ.addDays(S.event_date, S.return_offset)
    });

    const body = () => {
      const { pickup, ret } = dates();
      const norm = SZ.norm;
      const cust = S.customer_id ? db.get('customer', S.customer_id) : null;
      const med = cust ? SZ.sortBy(db.where('customer_measurement', m => m.customer_id === cust.id), m => m.measured_at, -1)[0] : null;
      const pref = cust ? db.first('customer_preference', p => p.customer_id === cust.id) : null;
      const pinned = cust ? db.where('customer_interaction', i => i.customer_id === cust.id && i.pinned) : [];

      let cands = db.all('garment').filter(g => g.state !== 'baixado');
      if (S.q) cands = cands.filter(g => norm(`${g.code} ${g.name} ${g.color_primary} ${g.fabric}`).includes(norm(S.q)));
      else if (med && med.usual_size) cands = cands.filter(g => g.size_equiv === med.usual_size || S.garments.includes(g.id));
      const check = {};
      cands.forEach(g => check[g.id] = E.check(g.id, pickup, ret));
      cands = SZ.sortBy(cands, g => (check[g.id].ok ? 0 : 1) + '' + g.code);

      const sel = S.garments.map(id => db.get('garment', id)).filter(Boolean);
      const conflitos = sel.filter(g => !E.check(g.id, pickup, ret).ok);
      const bruto = SZ.sum(sel, g => g.rental_price);
      const total = Math.max(0, bruto - S.discount);

      return `
        <div class="fgrid">
          <div class="field full"><label for="nr-cust">Cliente *</label>
            <select id="nr-cust"><option value="">— selecionar cliente —</option>
              ${SZ.sortBy(db.all('customer'), x => x.full_name).map(x =>
                `<option value="${x.id}" ${S.customer_id === x.id ? 'selected' : ''}>${SZ.esc(x.full_name)} · ${x.code}</option>`).join('')}
            </select></div>
        </div>
        ${cust ? `<div class="note info">${SZ.icon('clientes')}<span>
            <b>${SZ.esc(cust.full_name)}</b> — tamanho ${med && med.usual_size ? med.usual_size : 'não registrado'}${med && med.bust_cm ? ` · ${med.bust_cm}/${med.waist_cm}/${med.hip_cm}` : ''}.
            ${pref && (pref.preferred_colors || []).length ? ` Prefere ${pref.preferred_colors.join(', ').toLowerCase()}.` : ''}
            ${pref && (pref.avoided_colors || []).length ? ` Evita ${pref.avoided_colors.join(', ').toLowerCase()}.` : ''}
            ${pinned.length ? `<br><span style="opacity:.85">${SZ.esc(pinned[0].content)}</span>` : ''}
          </span></div>` : ''}

        <div class="fgrid g3c">
          <div class="field"><label for="nr-ev">Data do evento *</label><input type="date" id="nr-ev" value="${S.event_date}"></div>
          <div class="field"><label for="nr-pk">Retirar quantos dias antes</label>
            <select id="nr-pk">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${S.pickup_offset === n ? 'selected' : ''}>${n === 0 ? 'no dia' : n + ' dia(s)'}</option>`).join('')}</select></div>
          <div class="field"><label for="nr-rt">Devolver quantos dias depois</label>
            <select id="nr-rt">${[1, 2, 3, 4].map(n => `<option value="${n}" ${S.return_offset === n ? 'selected' : ''}>${n} dia(s)</option>`).join('')}</select></div>
          <div class="field"><label for="nr-type">Tipo de evento</label><input id="nr-type" list="evtypes" value="${SZ.esc(S.event_type)}">
            <datalist id="evtypes">${['Casamento', 'Formatura', 'Aniversário', 'Festa corporativa', 'Baile de gala', 'Casamento civil', 'Premiação'].map(x => `<option value="${x}">`).join('')}</datalist></div>
          <div class="field"><label for="nr-disc">Desconto (R$)</label><input type="number" id="nr-disc" min="0" step="0.01" value="${S.discount}"></div>
          <div class="field"><label>Período ocupado</label>
            <div style="padding-top:7px;font-size:12.5px" class="mono">${SZ.fd(pickup)} → ${SZ.fd(ret)}<span class="dim"> + higiene</span></div></div>
        </div>

        ${conflitos.length ? conflitos.map(g => {
          const ck = E.check(g.id, pickup, ret);
          const alts = E.alternatives(g, pickup, ret);
          return `<div class="note red">${SZ.icon('alerta')}<span>
            <b>${SZ.esc(g.name)} (${g.code}) não está disponível.</b>
            ${ck.conflicts.map(cf => `<br>${cf.kind.label} de ${cf.period}${cf.reservation ? ` — reserva ${cf.reservation.code}` : ''}.`).join('')}
            <br>A janela pedida vai de ${SZ.fd(ck.window.occupied_from)} a ${SZ.fd(ck.window.occupied_to)}, já incluindo ${ck.window.buffer.cleaning} dia(s) de higienização.
            ${alts.length ? `<br><br><b>Alternativas semelhantes livres:</b> ${alts.map(a =>
              `<a href="#" data-act="nrSwap" data-out="${g.id}" data-in="${a.g.id}">${SZ.esc(a.g.name)} (${a.g.code})</a>`).join(' · ')}` : '<br><br>Não há peça semelhante livre nesse período.'}
          </span></div>`;
        }).join('') : ''}

        <div>
          <div class="spread" style="margin-bottom:8px">
            <span class="eyebrow">Peças</span>
            <span class="tiny dim">${S.q ? 'busca livre' : med && med.usual_size ? `filtrado pelo tamanho ${med.usual_size} da cliente` : 'todas as peças'}</span>
          </div>
          <div class="field" style="margin-bottom:10px">
            <input id="nr-q" placeholder="Buscar peça por código, nome ou cor… (limpe para voltar ao tamanho da cliente)" value="${SZ.esc(S.q)}">
          </div>
          <div style="max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-md)">
            ${cands.length ? cands.slice(0, 40).map(g => {
              const ck = check[g.id], on = S.garments.includes(g.id);
              return `<div class="ag-item" data-act="nrToggle" data-id="${g.id}" style="grid-template-columns:34px 1fr auto;padding:8px 12px;${on ? 'background:var(--accent-soft)' : ''}">
                <span style="width:34px;height:44px;border-radius:4px;overflow:hidden">${SZ.silhouette(g)}</span>
                <span><span class="ttl">${SZ.esc(g.name)} <span class="mono dim tiny">${g.code}</span></span>
                  <span class="sub2">${SZ.esc(g.color_primary)} · tam. ${g.label_size} · ${SZ.brl0(g.rental_price)}</span></span>
                <span class="row" style="gap:7px">
                  ${ck.ok ? SZ.pill('livre no período', 'green') : SZ.pill(ck.conflicts.length ? ck.conflicts[0].kind.label + ' ' + ck.conflicts[0].period : (ck.reason || 'indisponível'), 'red')}
                  ${on ? SZ.icon('check', 15) : ''}
                </span></div>`;
            }).join('') : `<div class="empty-state" style="padding:26px"><div class="d">Nenhuma peça corresponde à busca.</div></div>`}
          </div>
        </div>

        <div class="field"><label for="nr-notes">Observações da reserva</label>
          <textarea id="nr-notes" placeholder="Combinações, ajustes prometidos, condições especiais">${SZ.esc(S.notes)}</textarea></div>

        <div class="note red" id="nr-erros" hidden>${SZ.icon('alerta')}<span></span></div>

        <hr class="sep">
        <div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px">
          <div class="spread"><span class="muted">${sel.length} peça(s)</span><span class="num">${SZ.brl(bruto)}</span></div>
          ${S.discount ? `<div class="spread"><span class="muted">Desconto</span><span class="num">− ${SZ.brl(S.discount)}</span></div>` : ''}
          <div class="spread" style="font-weight:650;font-size:15px"><span>Total</span><span class="num display" style="font-size:22px">${SZ.brl(total)}</span></div>
          ${sel.length > 1 && S.discount > 0 ? `<div style="margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)">
            <div class="eyebrow" style="margin-bottom:6px">Rateio do desconto entre as peças</div>
            ${E.prorate(sel.map(g => ({ garment_id: g.id, unit_price: g.rental_price })), S.discount).map(x => {
              const g = db.get('garment', x.garment_id);
              return `<div class="spread tiny" style="padding:2px 0"><span><span class="mono">${g.code}</span> ${SZ.esc(g.name)}</span>
                <span class="num">${SZ.brl(x.gross_amount)} − ${SZ.brl(x.allocated_order_discount)} = <b>${SZ.brl(x.net_revenue)}</b></span></div>`;
            }).join('')}
            <div class="tiny dim" style="margin-top:5px">É essa receita líquida que alimenta ROI, payback e margem de cada peça.</div>
          </div>` : ''}
        </div>`;
    };

    const open = () => {
      UI.modal({
        title: 'Nova reserva', wide: true,
        sub: 'A disponibilidade é verificada contra o calendário de cada peça, incluindo o buffer de higienização',
        body: body(),
        footer: `<span class="left tiny dim">A pré-reserva segura a peça por ${E.cfg().hold_hours}h e expira sozinha.</span>
          <button class="btn" data-act="closeModal">Cancelar</button>
          <button class="btn" id="nr-pre">Criar pré-reserva</button>
          <button class="btn primary" id="nr-ok">Confirmar reserva</button>`,
        onMount: bind
      });
    };

    const rebuild = () => {
      const m = UI.el('#scrim .modal-b');
      if (!m) return;
      const scroll = m.scrollTop;
      m.innerHTML = body();
      m.scrollTop = scroll;
      bindInputs();
    };

    function bindInputs() {
      const w = UI.el('#scrim'); if (!w) return;
      const set = (sel, prop, cast) => {
        const n = UI.el(sel, w); if (!n) return;
        n.onchange = () => { S[prop] = cast ? cast(n.value) : n.value; rebuild(); };
      };
      set('#nr-cust', 'customer_id');
      set('#nr-ev', 'event_date');
      set('#nr-pk', 'pickup_offset', Number);
      set('#nr-rt', 'return_offset', Number);
      set('#nr-disc', 'discount', Number);
      const t = UI.el('#nr-type', w); if (t) t.onchange = () => S.event_type = t.value;
      const no = UI.el('#nr-notes', w); if (no) no.oninput = () => S.notes = no.value;
      const q = UI.el('#nr-q', w);
      if (q) {
        q.oninput = () => {
          clearTimeout(S._t);
          const v = q.value;
          S._t = setTimeout(() => { S.q = v; rebuild(); const n = UI.el('#nr-q'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); } }, 280);
        };
      }
    }

    function bind(w) {
      bindInputs();
      UI.el('#nr-pre', w).onclick = () => submit('pre_reserva');
      UI.el('#nr-ok', w).onclick = () => submit('confirmada');
    }

    UI.ACT.nrToggle = (dd) => {
      const i = S.garments.indexOf(dd.id);
      if (i >= 0) S.garments.splice(i, 1); else S.garments.push(dd.id);
      rebuild();
    };
    UI.ACT.nrSwap = (dd) => {
      const i = S.garments.indexOf(dd.out);
      if (i >= 0) S.garments.splice(i, 1, dd.in);
      rebuild();
    };

    const submit = (mode, authorization) => {
      const { pickup, ret } = dates();
      const input = {
        customer_id: S.customer_id, event_date: S.event_date, event_type: S.event_type,
        pickup_date: pickup, return_due_date: ret, discount: S.discount, notes: S.notes,
        items: S.garments.map(id => ({ garment_id: id, unit_price: db.get('garment', id).rental_price, discount: 0 }))
      };

      /* Validação de qualidade de dados antes de qualquer escrita. */
      const erros = E.validateReservation(input);
      if (erros.length) {
        UI.toast('Revise a reserva', erros[0], 'err');
        const box = UI.el('#nr-erros');
        if (box) {
          box.hidden = false;
          box.querySelector('span').innerHTML = '<b>Corrija antes de continuar:</b><br>' +
            erros.map(x => '• ' + SZ.esc(x)).join('<br>');
          box.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
        return;
      }

      /* Desconto acima do limite da casa exige autorização de quem pode. */
      const bruto = SZ.sum(input.items, i => i.unit_price);
      if (S.discount > 0 && E.discountNeedsAuthorization(bruto, S.discount) && !authorization) {
        UI.authorize({
          title: 'Desconto acima do limite',
          detail: `O desconto de ${SZ.brl(S.discount)} representa ${SZ.pct(S.discount / bruto, 1)} do valor das peças, acima do limite de ${db.setting('discount_limit_percent', 15)}% da casa.`,
          amount: S.discount, kind: 'desconto_acima_limite',
          onOk: (auth) => submit(mode, auth)
        });
        return;
      }

      const res = E.createReservation(input, mode === 'pre_reserva' ? 'pre_reserva' : 'confirmada');
      if (!res.ok) {
        const p = res.problems[0];
        UI.toast('Conflito de reserva', `${p.garment.code} já está comprometida nesse período. Nada foi criado.`, 'err');
        rebuild();
        return;
      }
      E.generateContract(res.reservation);
      if (authorization) E.recordAuthorization(res.reservation.id, Object.assign({ kind: 'desconto_acima_limite', amount: S.discount }, authorization));
      if (S.fitting_id) E.linkFittingToReservation(S.fitting_id, res.reservation.id);
      UI.closeModal();
      UI.toast(mode === 'pre_reserva' ? 'Pré-reserva criada' : 'Reserva criada',
        `${res.reservation.code} · ${mode === 'pre_reserva' ? `expira em ${E.cfg().hold_hours}h` : 'aguardando pagamento'}`, 'ok');
      UI.go('#/reservas/' + res.reservation.id);
    };

    open();
  };

  /* ---------------------------------------------------- ações da reserva */
  UI.ACT.confirmRes = (d) => SZ.require('reserva.confirm', () => {
    const r = db.get('reservation', d.id);
    const out = E.confirmReservation(d.id);
    if (!out.ok) {
      const nomes = out.problems.map(p => p.garment ? p.garment.code : '—').join(', ');
      UI.modal({
        title: 'Confirmação recusada', sub: `${r.code} · nada foi alterado`,
        body: `<div class="note red">${SZ.icon('alerta')}<span><b>A pré-reserva continua intacta.</b>
            ${out.problems.length} peça(s) entraram em conflito desde que a pré-reserva foi criada — e o sistema
            não confirma nada pela metade: ou todas as peças passam, ou nenhuma é alterada.</span></div>
          ${out.problems.map(p => `<div class="note amber">${SZ.icon('alerta')}<span>
            <b>${p.garment ? p.garment.code + ' — ' + SZ.esc(p.garment.name) : 'Peça removida'}</b>
            ${p.check.conflicts.map(cf => `<br>${cf.kind.label} de ${cf.period}${cf.reservation ? ` — reserva ${cf.reservation.code}` : ''}.`).join('')}
            ${p.check.reason ? `<br>${SZ.esc(p.check.reason)}` : ''}</span></div>`).join('')}
          <div class="note info">${SZ.icon('escudo')}<span>Remova a peça em conflito, mude as datas ou troque por uma
            alternativa livre — e confirme de novo.</span></div>`,
        footer: `<button class="btn" data-act="closeModal">Entendi</button>`
      });
      UI.toast('Confirmação recusada', `Conflito em ${nomes}. Nenhum bloco foi alterado.`, 'err');
      UI.render();
      return;
    }
    UI.toast('Pré-reserva confirmada', `${r.code} · peças bloqueadas com buffer de higienização.`, 'ok');
    UI.render();
  });

  UI.ACT.cancelRes = (d) => SZ.require('reserva.cancel', () => {
    const r = db.get('reservation', d.id);
    UI.confirm('Cancelar reserva',
      `Cancelar <b>${r.code}</b>? As peças voltam ao acervo e o calendário é liberado imediatamente.
       Pagamentos já recebidos seguem lançados e devem ser estornados separadamente, conforme a política de cancelamento do contrato.`,
      'Cancelar reserva', () => {
        E.cancelReservation(d.id, 'Cancelada pela equipe');
        UI.toast('Reserva cancelada', `${r.code} · peças liberadas.`, 'ok');
        UI.render();
      }, true);
  });

  UI.ACT.addPayment = (d) => SZ.require('financeiro.payment', () => {
    const r = db.get('reservation', d.id);
    const bal = E.balance(r);
    const g0 = E.itemsOf(r.id)[0];
    const caucaoSugerida = g0 ? (g0.g.deposit_suggested || 0) : 0;
    UI.modal({
      title: 'Lançar pagamento', sub: `${r.code} · saldo ${SZ.brl(bal.due)}${bal.caucao ? ` · caução retida ${SZ.brl(bal.caucao)}` : ''}`,
      body: `<div class="fgrid">
          <div class="field"><label for="pg-kind">Tipo</label><select id="pg-kind">
            ${Object.entries(SZ.PAYMENT_KIND).map(([k, v]) =>
              `<option value="${k}" ${k === (bal.pago > 0 ? 'saldo' : 'sinal') ? 'selected' : ''}>${v}</option>`).join('')}</select>
            <span class="hint" id="pg-hint"></span></div>
          <div class="field"><label for="pg-method">Forma</label><select id="pg-method">
            ${Object.entries(SZ.PAYMENT_METHOD).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
          <div class="field"><label for="pg-amount">Valor (R$)</label>
            <input type="number" id="pg-amount" min="0" step="0.01" value="${bal.due.toFixed(2)}"></div>
          <div class="field"><label for="pg-ref">Referência</label><input id="pg-ref" placeholder="E2E do PIX, NSU, link"></div>
          <div class="field full"><label for="pg-note">Observação</label><input id="pg-note" placeholder="Sinal recebido na prova"></div>
        </div>
        ${caucaoSugerida ? `<div class="tiny dim">Caução sugerida para esta peça: ${SZ.brl(caucaoSugerida)} — facultativa.</div>` : ''}
        <div class="note info">${SZ.icon('moeda')}<span>Uma reserva aceita vários lançamentos: sinal, saldo, caução,
          multa e estorno convivem. A caução não abate o valor devido — ela é retida e devolvida no fim.
          <br>→ Gateway de pagamento está previsto na arquitetura (<span class="mono">payment.gateway</span> e
          <span class="mono">gateway_ref</span> já existem no schema); aqui o lançamento é manual.</span></div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="pg-ok">Lançar</button>`,
      onMount: (w) => {
        const kind = UI.el('#pg-kind', w), amount = UI.el('#pg-amount', w), hint = UI.el('#pg-hint', w);
        const dicas = {
          sinal: 'Entrada paga na reserva. Abate o valor devido.',
          saldo: 'Restante do valor da locação.',
          integral: 'Pagamento único do total.',
          caucao: 'Garantia retida. NÃO abate o valor devido e deve ser devolvida na finalização.',
          multa: 'Cobrança por atraso ou dano.',
          estorno: 'Devolução de valor à cliente — inclusive da caução.'
        };
        const sync = () => {
          hint.textContent = dicas[kind.value] || '';
          if (kind.value === 'caucao') amount.value = (caucaoSugerida || bal.devido * 0.1).toFixed(2);
          else if (kind.value === 'estorno') amount.value = (bal.caucao || bal.pago).toFixed(2);
          else amount.value = bal.due.toFixed(2);
        };
        kind.onchange = sync; sync();

        UI.el('#pg-ok', w).onclick = () => {
          const payload = {
            kind: kind.value, method: UI.val('#pg-method'),
            amount: UI.numval('#pg-amount'), reference: UI.val('#pg-ref') || null,
            notes: UI.val('#pg-note') || null
          };
          const erros = E.validatePayment(payload, bal.due);
          if (erros.length) { UI.toast('Revise o lançamento', erros[0], 'err'); return; }
          E.registerPayment(r.id, payload);
          UI.closeModal();
          const nb = E.balance(db.get('reservation', r.id));
          UI.toast('Pagamento lançado',
            payload.kind === 'caucao' ? `Caução de ${SZ.brl(payload.amount)} retida.`
              : payload.kind === 'estorno' ? `Estorno de ${SZ.brl(payload.amount)} registrado.`
              : nb.due > 0 ? `Ainda faltam ${SZ.brl(nb.due)}.` : 'Reserva quitada e confirmada.', 'ok');
          UI.render();
        };
      }
    });
  });

  /* ---------------------------------------------- RETIRADA POR ITEM · v0.2
     Os checkboxes não são enfeite: o que fica desmarcado não sai da loja,
     continua bloqueado no calendário e vira alerta operacional.          */
  UI.ACT.doPickup = (d) => SZ.require('reserva.pickup', () => {
    const r = db.get('reservation', d.id);
    const c = db.get('customer', r.customer_id);
    const bal = E.balance(r);
    const items = E.itemsOf(r.id).filter(x => ['pendente', 'nao_entregue'].includes(x.i.item_state || 'pendente'));
    if (!items.length) { UI.toast('Nada a retirar', 'Todas as peças já saíram da loja.', 'err'); return; }
    const podeAutorizar = SZ.can('reserva.authorize');

    const executar = (authorization) => {
      const decisions = items.map(x => ({
        item_id: x.i.id,
        delivered: UI.el('#pk-' + x.i.id).checked,
        note: UI.val('#pkn-' + x.i.id)
      }));
      if (!decisions.some(x => x.delivered)) { UI.toast('Nenhuma peça marcada', 'Marque o que a cliente está levando.', 'err'); return; }

      const out = E.pickupItems(r.id, decisions, { authorization });
      const ct = db.first('contract', x => x.reservation_id === r.id);
      if (ct && UI.el('#pk-contract') && UI.el('#pk-contract').checked && !ct.signed_at) {
        db.update('contract', ct.id, { signed_at: SZ.nowISO(), signer_name: c.full_name, signature_kind: 'presencial' }, { silent: true });
      }
      const note = UI.val('#pk-note');
      if (note) db.insert('customer_interaction', {
        customer_id: c.id, reservation_id: r.id, kind: 'atendimento', channel: 'presencial',
        content: 'Retirada — ' + note, occurred_at: SZ.nowISO(), author_id: db.session.user_id
      }, { batch: true });
      db.persist();
      UI.closeModal();
      UI.toast(out.completa ? 'Retirada registrada' : 'Retirada parcial registrada',
        out.completa
          ? `${r.code} · ${out.entregues} peça(s) em uso, devolução ${SZ.fd(r.return_due_date)}.`
          : `${out.entregues} entregue(s), ${out.retidos} pendente(s) na loja.`, 'ok');
      UI.render();
    };

    UI.modal({
      title: 'Registrar retirada', sub: `${r.code} · ${c.full_name}`,
      body: `
        ${bal.due > 0
          ? `<div class="note ${podeAutorizar ? 'amber' : 'red'}">${SZ.icon('escudo')}<span>
              <b>Retirada com saldo pendente exige autorização.</b> Falta ${SZ.brl(bal.due)}.
              ${podeAutorizar
                ? ' Você pode autorizar — o motivo e o seu nome ficam registrados na auditoria.'
                : ` ${SZ.esc((SZ.currentUser() || {}).full_name || '').split(' ')[0]} não pode autorizar sozinha: será preciso indicar um gestor ou administrador.`}
            </span></div>`
          : `<div class="note green">${SZ.icon('check')}<span>Reserva quitada. Pode entregar.</span></div>`}

        <div>
          <div class="spread" style="margin-bottom:8px">
            <span class="eyebrow">Conferência de saída</span>
            <span class="tiny dim">desmarque o que não sair da loja</span>
          </div>
          <div style="border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden">
            ${items.map((x, idx) => `<div style="padding:10px 12px;border-bottom:${idx === items.length - 1 ? 'none' : '1px solid var(--line)'};
                display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:start">
              <span style="width:34px;height:44px;border-radius:4px;overflow:hidden">${SZ.silhouette(x.g)}</span>
              <span>
                <label class="row" style="gap:9px;font-size:13px;cursor:pointer;margin-bottom:4px">
                  <input type="checkbox" id="pk-${x.i.id}" class="pk-item" checked style="width:auto">
                  <span style="font-weight:600">${SZ.esc(x.g.name)}</span>
                  <span class="mono tiny dim">${x.g.code}</span>
                  <span class="dim tiny">${SZ.esc(x.g.color_primary)} · tam. ${x.g.label_size}</span>
                </label>
                ${x.i.alteration_notes ? `<div class="tiny" style="color:var(--t-ochre);margin-bottom:4px">${SZ.icon('costura', 11)} ${SZ.esc(x.i.alteration_notes)}</div>` : ''}
                <input id="pkn-${x.i.id}" class="item-note" placeholder="Observação desta peça (ex.: cliente virá buscar amanhã)"
                  aria-label="Observação da peça ${SZ.esc(x.g.code)}">
              </span>
            </div>`).join('')}
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:7px">
          <label class="row" style="gap:9px;font-size:13px;cursor:pointer">
            <input type="checkbox" id="pk-contract" checked style="width:auto"> <span>Contrato assinado pela cliente</span></label>
          <label class="row" style="gap:9px;font-size:13px;cursor:pointer">
            <input type="checkbox" id="pk-brief" checked style="width:auto"> <span>Orientações de uso e devolução explicadas</span></label>
        </div>
        <div class="field"><label for="pk-note">Observação da retirada</label>
          <input id="pk-note" placeholder="Peça entregue com capa protetora e cabide"></div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button>
        ${bal.due > 0 ? `<button class="btn" id="pk-pay">${SZ.icon('moeda', 14)} Receber agora</button>` : ''}
        <button class="btn primary" id="pk-ok">${bal.due > 0 ? 'Autorizar e entregar' : 'Confirmar retirada'}</button>`,
      onMount: (w) => {
        const pay = UI.el('#pk-pay', w);
        if (pay) pay.onclick = () => { UI.closeModal(); UI.ACT.addPayment({ id: r.id }); };
        UI.el('#pk-ok', w).onclick = () => {
          if (bal.due > 0) {
            /* Guarda os checkboxes antes de abrir o modal de autorização. */
            const snapshot = items.map(x => ({
              item_id: x.i.id, delivered: UI.el('#pk-' + x.i.id).checked, note: UI.val('#pkn-' + x.i.id)
            }));
            const contrato = UI.el('#pk-contract').checked;
            const nota = UI.val('#pk-note');
            UI.authorize({
              title: 'Retirada com saldo pendente',
              detail: `${SZ.esc(c.full_name)} está levando a(s) peça(s) com <b>${SZ.brl(bal.due)}</b> em aberto na reserva ${r.code}.`,
              amount: bal.due, kind: 'retirada_com_saldo',
              onOk: (auth) => {
                const out = E.pickupItems(r.id, snapshot, { authorization: auth });
                const ct = db.first('contract', x => x.reservation_id === r.id);
                if (ct && contrato && !ct.signed_at) db.update('contract', ct.id,
                  { signed_at: SZ.nowISO(), signer_name: c.full_name, signature_kind: 'presencial' }, { silent: true });
                if (nota) db.insert('customer_interaction', {
                  customer_id: c.id, reservation_id: r.id, kind: 'atendimento', channel: 'presencial',
                  content: 'Retirada — ' + nota, occurred_at: SZ.nowISO(), author_id: db.session.user_id
                }, { batch: true });
                db.persist();
                const quem = db.get('app_user', auth.user_id);
                UI.toast('Retirada autorizada',
                  `${SZ.brl(bal.due)} em aberto · autorizada por ${quem ? quem.full_name : '—'}.`, 'ok');
                UI.render();
              }
            });
            return;
          }
          executar(null);
        };
      }
    });
  });

  /* ------------------------------------------- DEVOLUÇÃO POR ITEM · v0.2
     A cliente devolve o vestido hoje e a clutch amanhã. O sistema tem de
     saber a diferença.                                                   */
  UI.ACT.doReturn = (d) => SZ.require('reserva.return', () => {
    const r = db.get('reservation', d.id);
    const c = db.get('customer', r.customer_id);
    const atraso = Math.max(0, SZ.diffDays(r.return_due_date, SZ.today()));
    const multa = atraso > 0 ? r.total_net * E.cfg().late_fee_percent / 100 * atraso : 0;
    const items = E.itemsOf(r.id).filter(x => x.i.item_state === 'retirado');
    const jaVoltou = E.itemsOf(r.id).filter(x => ['devolvido', 'inspecionado'].includes(x.i.item_state));
    if (!items.length) { UI.toast('Nada a devolver', 'Todas as peças já voltaram.', 'err'); return; }

    UI.modal({
      title: 'Registrar devolução', sub: `${r.code} · ${c.full_name}`,
      body: `
        ${atraso > 0 ? `<div class="note red">${SZ.icon('alerta')}<span><b>${atraso} dia(s) de atraso.</b>
          Multa contratual de ${E.cfg().late_fee_percent}% ao dia: <b>${SZ.brl(multa)}</b>. Lançada como cobrança pendente.</span></div>`
          : `<div class="note green">${SZ.icon('check')}<span>Devolução dentro do prazo.</span></div>`}
        <div class="note info">${SZ.icon('operacao')}<span>Cada peça marcada entra em <b>inspeção</b> e fica indisponível
          para novas reservas até a Operação liberar. O que ficar desmarcado continua com a cliente e a multa segue correndo.</span></div>
        <div>
          <div class="spread" style="margin-bottom:8px">
            <span class="eyebrow">Peças recebidas agora</span>
            <span class="tiny dim">marque só o que voltou de fato</span>
          </div>
          <div style="border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden">
            ${items.map((x, idx) => `<div style="padding:10px 12px;border-bottom:${idx === items.length - 1 ? 'none' : '1px solid var(--line)'};
                display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:start">
              <span style="width:34px;height:44px;border-radius:4px;overflow:hidden">${SZ.silhouette(x.g)}</span>
              <span>
                <label class="row" style="gap:9px;font-size:13px;cursor:pointer;margin-bottom:4px">
                  <input type="checkbox" id="rt-${x.i.id}" checked style="width:auto">
                  <span style="font-weight:600">${SZ.esc(x.g.name)}</span>
                  <span class="mono tiny dim">${x.g.code}</span>
                  <span class="dim tiny">retirada ${SZ.fdt(x.i.picked_up_at)}</span>
                </label>
                <input id="rtn-${x.i.id}" class="item-note" placeholder="Ocorrência desta peça (ex.: mancha na barra, cliente avisou)"
                  aria-label="Ocorrência da peça ${SZ.esc(x.g.code)}">
              </span>
            </div>`).join('')}
          </div>
        </div>
        ${jaVoltou.length ? `<div class="tiny dim">Já recebidas nesta reserva: ${jaVoltou.map(x => x.g.code).join(', ')}.</div>` : ''}`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn primary" id="rt-ok">Confirmar devolução</button>`,
      onMount: (w) => {
        UI.el('#rt-ok', w).onclick = () => {
          const decisions = items.map(x => ({
            item_id: x.i.id, returned: UI.el('#rt-' + x.i.id).checked, note: UI.val('#rtn-' + x.i.id)
          }));
          if (!decisions.some(x => x.returned)) { UI.toast('Nenhuma peça marcada', 'Marque o que a cliente devolveu.', 'err'); return; }
          const out = E.returnItems(r.id, decisions);
          UI.closeModal();
          UI.toast(out.completa ? 'Devolução registrada' : 'Devolução parcial registrada',
            out.completa
              ? (out.fee > 0 ? `Multa de ${SZ.brl(out.fee)} lançada. ${out.devolvidos} peça(s) em inspeção.` : `${out.devolvidos} peça(s) em inspeção.`)
              : `${out.devolvidos} recebida(s) · ${out.pendentes} ainda com a cliente.`, 'ok');
          if (SZ.can('operacao.view')) UI.go('#/operacao'); else UI.render();
        };
      }
    });
  });

  UI.ACT.goInspect = (d) => { UI.state.opFocus = d.id; UI.go('#/operacao'); };

  UI.ACT.viewContract = (d) => {
    const r = db.get('reservation', d.id);
    const body = E.contractBody(r);
    const ct = db.first('contract', x => x.reservation_id === r.id);
    if (ct && !ct.signed_at) db.update('contract', ct.id, { body_rendered: body }, { silent: true });
    UI.modal({
      title: 'Contrato de locação', sub: (ct ? ct.number : r.code.replace('RS', 'CT')), wide: true,
      body: `<pre class="mono" style="white-space:pre-wrap;font-size:11.5px;line-height:1.6;background:var(--surface-2);
        border:1px solid var(--line);border-radius:var(--r-md);padding:18px;margin:0">${SZ.esc(body)}</pre>`,
      footer: `<button class="btn" data-act="closeModal">Fechar</button>
        <button class="btn primary" data-act="copyContract" data-id="${r.id}">${SZ.icon('copiar', 14)} Copiar texto</button>`
    });
  };

  UI.ACT.copyContract = (d) => {
    const r = db.get('reservation', d.id);
    const txt = E.contractBody(r);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
      () => UI.toast('Contrato copiado', 'Cole no WhatsApp, no e-mail ou no editor.', 'ok'),
      () => UI.toast('Não foi possível copiar', 'Use o botão Visualizar e selecione o texto.', 'err'));
    else UI.toast('Não foi possível copiar', 'Use o botão Visualizar e selecione o texto.', 'err');
  };
})();


/* ═══════════ 09-views-operacao.js ═══════════ */
/* =====================================================================
   SENZIE OS — 09 · Operação: inspeção, higienização, ajuste, manutenção
   ===================================================================== */
(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;

  UI.VIEWS.operacao = function operacao() {
    const garments = db.all('garment');
    const fila = {
      inspecao: garments.filter(g => g.state === 'inspecao'),
      higienizacao: garments.filter(g => g.state === 'higienizacao'),
      ajuste: garments.filter(g => g.state === 'ajuste'),
      manutencao: garments.filter(g => g.state === 'manutencao'),
      bloqueado: garments.filter(g => g.state === 'bloqueado')
    };
    const total = Object.values(fila).reduce((a, x) => a + x.length, 0);
    const abertas = db.where('garment_maintenance', m => ['aberta', 'em_andamento'].includes(m.state));
    const custoMes = SZ.sum(db.all('expense').filter(e => ['higienizacao', 'manutencao', 'ajuste'].includes(e.kind)
      && e.incurred_at >= SZ.addDays(SZ.today(), -30)), e => e.amount);

    const coluna = (key, titulo, descricao, acao) => {
      const list = fila[key];
      const st = SZ.GARMENT_STATE[key];
      return `<section class="card">
        <div class="card-h">
          <h3>${titulo}</h3>${SZ.pill(String(list.length), st.tone)}
          <div class="actions"></div>
        </div>
        <div class="card-b" style="padding:0">
          <div class="tiny dim" style="padding:9px 16px;border-bottom:1px solid var(--line)">${descricao}</div>
          ${list.length ? list.map(g => {
            const m = SZ.sortBy(db.where('garment_maintenance', x => x.garment_id === g.id && ['aberta', 'em_andamento'].includes(x.state)), x => x.opened_at, -1)[0];
            const dias = m ? Math.floor((Date.now() - new Date(m.opened_at)) / 864e5) : null;
            const bloco = E.activeBlocks(g.id).find(b => ['bloqueio_manual', 'editorial'].includes(b.kind));
            const prox = SZ.sortBy(E.activeBlocks(g.id).filter(b => b.kind === 'locacao' && b.start_date > SZ.today()), b => b.start_date)[0];
            return `<div class="ag-item" style="grid-template-columns:38px 1fr auto;padding:10px 14px">
              <span style="width:38px;height:50px;border-radius:4px;overflow:hidden" data-go="#/acervo/${g.id}">${SZ.silhouette(g)}</span>
              <span data-go="#/acervo/${g.id}">
                <span class="ttl">${SZ.esc(g.name)} <span class="mono dim tiny">${g.code}</span></span>
                <span class="sub2">${m ? `${SZ.esc(m.description || m.kind)}` : SZ.esc(bloco ? bloco.note : g.color_primary + ' · tam. ' + g.label_size)}</span>
                <span class="sub2">
                  ${dias != null ? `<span style="${dias >= 7 ? 'color:var(--t-red);font-weight:600' : ''}">há ${dias} dia(s)</span>` : ''}
                  ${prox ? ` · <span style="color:var(--t-amber)">próxima reserva ${SZ.fd(prox.start_date)}</span>` : ''}
                </span>
              </span>
              <span class="row" style="gap:6px">${acao(g, m)}</span>
            </div>`;
          }).join('') : `<div class="empty-state" style="padding:26px"><div class="d">Fila vazia.</div></div>`}
        </div>
      </section>`;
    };

    return UI.header('Operação',
      `${total} peça(s) no ciclo · ${abertas.length} ordem(ns) em aberto${SZ.can('acervo.cost') ? ` · ${SZ.brl0(custoMes)} em custos nos últimos 30 dias` : ''}`, `
      <button class="btn" data-act="opRefresh">${SZ.icon('refresh', 14)} Atualizar</button>`) + `
    <div class="view">
      <div class="tiles">
        ${UI.tile('Aguardando inspeção', fila.inspecao.length, 'peças paradas até a conferência', fila.inspecao.length ? 'alert' : '', 'alerta')}
        ${UI.tile('Em higienização', fila.higienizacao.length, 'na lavanderia', '', 'gota')}
        ${UI.tile('Em ajuste', fila.ajuste.length, 'ateliê', '', 'costura')}
        ${UI.tile('Em manutenção', fila.manutencao.length, 'reparo', '', 'costura')}
        ${UI.tile('Bloqueadas', fila.bloqueado.length, 'editorial, avaliação ou decisão da gestão', '', 'tag')}
      </div>

      <div class="note info">${SZ.icon('alerta')}<span>
        <b>Nenhuma peça nesta tela pode ser reservada.</b> Enquanto está aqui, ela ocupa o próprio calendário —
        é o que garante que o Atendimento nunca prometa uma peça que a Operação ainda tem em mãos.</span></div>

      <div class="grid g2">
        ${coluna('inspecao', 'Aguardando inspeção',
          'Peça devolvida. Conferir item a item antes de decidir para onde ela vai.',
          (g) => SZ.can('operacao.inspect') ? `<button class="btn sm primary" data-act="inspect" data-id="${g.id}">Inspecionar</button>` : '')}
        ${coluna('higienizacao', 'Em higienização',
          'Na lavanderia. Ao concluir, lance o custo — ele entra no resultado da peça.',
          (g, m) => !SZ.can('operacao.maintenance') ? '' : m ? `<button class="btn sm" data-act="closeMaint" data-id="${m.id}">Concluir</button>`
            : `<button class="btn sm" data-act="releaseGarment" data-id="${g.id}">Liberar</button>`)}
        ${coluna('ajuste', 'Em ajuste',
          'Alterações reversíveis feitas para uma cliente específica.',
          (g, m) => !SZ.can('operacao.maintenance') ? '' : m ? `<button class="btn sm" data-act="closeMaint" data-id="${m.id}">Concluir</button>`
            : `<button class="btn sm" data-act="releaseGarment" data-id="${g.id}">Liberar</button>`)}
        ${coluna('manutencao', 'Em manutenção',
          'Reparos. Custo lançado aqui abate o resultado econômico da peça.',
          (g, m) => !SZ.can('operacao.maintenance') ? '' : m ? `<button class="btn sm" data-act="closeMaint" data-id="${m.id}">Concluir</button>`
            : `<button class="btn sm" data-act="releaseGarment" data-id="${g.id}">Liberar</button>`)}
      </div>

      ${fila.bloqueado.length ? `<div class="grid">${coluna('bloqueado', 'Bloqueadas',
        'Fora do acervo por decisão da gestão — ensaio, avaliação, empréstimo institucional.',
        (g) => SZ.can('operacao.release') ? `<button class="btn sm" data-act="releaseGarment" data-id="${g.id}">Devolver ao acervo</button>` : '')}</div>` : ''}

      <section class="card">
        <div class="card-h"><h3>Ordens em aberto</h3><span class="dim tiny">higienização, ajuste e manutenção em curso</span></div>
        <div class="card-b flush">
          ${abertas.length ? `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Peça</th><th>Tipo</th><th>Descrição</th><th>Aberta há</th><th>Prazo</th><th>Fornecedor</th><th></th></tr></thead>
            <tbody>${SZ.sortBy(abertas, m => m.opened_at).map(m => {
              const g = db.get('garment', m.garment_id);
              const dias = Math.floor((Date.now() - new Date(m.opened_at)) / 864e5);
              return `<tr data-go="#/acervo/${m.garment_id}">
                <td><span class="mono tiny">${g ? g.code : ''}</span><br><span class="lead">${SZ.esc(g ? g.name : '')}</span></td>
                <td class="tiny">${SZ.esc(SZ.MAINTENANCE_KIND[m.kind] || m.kind)}</td>
                <td class="tiny">${SZ.esc(m.description || '')}</td>
                <td class="tiny num" style="${dias >= 7 ? 'color:var(--t-red);font-weight:600' : ''}">${dias} dia(s)</td>
                <td class="tiny">${m.due_at ? SZ.fd(m.due_at) : '—'}</td>
                <td class="tiny">${SZ.esc(m.provider || '—')}</td>
                <td class="r">${SZ.can('operacao.maintenance') ? `<button class="btn sm" data-act="closeMaint" data-id="${m.id}">Concluir</button>` : ''}</td>
              </tr>`;
            }).join('')}</tbody></table></div>` : UI.empty('Nenhuma ordem em aberto', 'Todo o acervo está pronto para locação.')}
        </div>
      </section>
    </div>`;
  };

  UI.ACT.opRefresh = () => { E.expireHolds(); E.reconcile(); UI.toast('Atualizado', 'Estados reconciliados com o calendário.', 'ok'); UI.render(); };

  /* ==================================================== INSPEÇÃO · v0.2
     Quatro destinos, fotos e reparo leve explícito. A inspeção é a porta
     por onde a peça volta ao acervo — ou não volta.                     */
  UI.ACT.inspect = (d) => SZ.require('operacao.inspect', () => {
    const g = db.get('garment', d.id);
    const check = db.all('inspection_checklist_item').filter(i => i.is_active);
    const ultimaRes = SZ.sortBy(db.where('reservation_item', i => i.garment_id === g.id)
      .map(i => ({ i, r: db.get('reservation', i.reservation_id) }))
      .filter(x => x.r && ['em_inspecao', 'devolvida', 'aguardando_devolucao'].includes(x.r.state)), x => x.r.returned_at || '', -1)[0];
    const r = ultimaRes ? ultimaRes.r : null;
    const c = r ? db.get('customer', r.customer_id) : null;
    const fotos = [];

    const desenhaFotos = () => {
      const box = UI.el('#ins-fotos'); if (!box) return;
      box.innerHTML = fotos.length ? fotos.map((p, i) => `
        <span style="position:relative;width:64px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--line-2);
          background:var(--surface-2);display:grid;place-items:center;">
          <span style="opacity:.55;transform:scale(.8)">${SZ.silhouette(g)}</span>
          <span class="tiny" style="position:absolute;bottom:0;left:0;right:0;background:var(--surface);
            border-top:1px solid var(--line);text-align:center;font-size:9px;padding:1px 0">${SZ.esc(SZ.PHOTO_KIND[p.kind] || p.kind)}</span>
          <button class="icon-btn" data-rm="${i}" title="Remover" aria-label="Remover foto"
            style="position:absolute;top:2px;right:2px;background:var(--surface);border-radius:50%;padding:2px">${SZ.icon('x', 11)}</button>
        </span>`).join('') : '<span class="tiny dim">Nenhuma foto anexada.</span>';
      UI.els('[data-rm]', box).forEach(b => b.onclick = (e) => {
        e.preventDefault(); fotos.splice(Number(b.dataset.rm), 1); desenhaFotos();
      });
    };

    UI.modal({
      title: 'Inspeção de devolução', sub: `${g.code} · ${g.name}${c ? ' · devolvida por ' + c.full_name : ''}`, wide: true,
      body: `
        <div class="note info">${SZ.icon('operacao')}<span>Marque apenas o que estiver <b>com problema</b>.
          A severidade decide o destino da peça: leve segue para higienização, grave abre manutenção bloqueante,
          e dano com risco de perda vai para avaliação da gestão.</span></div>

        <div style="border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden">
          ${check.map((it, idx) => `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;align-items:center;
              padding:8px 12px;border-bottom:${idx === check.length - 1 ? 'none' : '1px solid var(--line)'}">
            <label class="row" style="gap:9px;font-size:13px;cursor:pointer">
              <input type="checkbox" class="ins-bad" data-label="${SZ.esc(it.label)}" id="ins-${idx}" style="width:auto">
              <span>${SZ.esc(it.label)}</span></label>
            <select class="ins-sev" id="sev-${idx}" disabled aria-label="Severidade de ${SZ.esc(it.label)}">
              <option value="leve">leve</option><option value="media">média</option><option value="grave">grave</option></select>
            <input class="ins-note" id="nt-${idx}" placeholder="descrição" disabled aria-label="Descrição de ${SZ.esc(it.label)}">
          </div>`).join('')}
        </div>

        <div>
          <div class="spread" style="margin-bottom:7px">
            <span class="eyebrow">Registro fotográfico</span>
            <span class="row" style="gap:5px">
              ${['devolucao', 'dano', 'detalhe'].map(k => `<button class="btn sm" data-addfoto="${k}">${SZ.icon('camera', 12)} ${SZ.PHOTO_KIND[k]}</button>`).join('')}
            </span>
          </div>
          <div id="ins-fotos" class="row" style="gap:8px;min-height:24px"></div>
          <div class="tiny dim" style="margin-top:6px">Protótipo: a foto é simulada.
            Em produção, o arquivo vai para o Supabase Storage e fica anexado à inspeção.</div>
        </div>

        <div class="fgrid">
          <div class="field"><label for="ins-kind">Tipo de serviço, se houver reparo</label><select id="ins-kind">
            ${Object.entries(SZ.MAINTENANCE_KIND).map(([k, v]) => `<option value="${k}" ${k === 'costura' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div class="field"><label for="ins-prov">Fornecedor</label>
            <input id="ins-prov" list="provs" placeholder="Lavanderia Branca Neve">
            <datalist id="provs">${['Lavanderia Branca Neve', 'Ateliê Dona Neuza', 'Ateliê próprio', 'Tinturaria Aurora'].map(x => `<option value="${x}">`).join('')}</datalist></div>
          <label class="field full row" style="flex-direction:row;gap:8px;align-items:center">
            <input type="checkbox" id="ins-repair" style="width:auto">
            <span>Abrir ordem de reparo leve além da higienização</span></label>
        </div>

        <div class="field"><label for="ins-notes">Observação geral</label>
          <textarea id="ins-notes" placeholder="Peça devolvida em boas condições."></textarea></div>
        <div class="note amber" id="ins-warn" hidden>${SZ.icon('alerta')}<span></span></div>
        <label class="row" style="gap:9px;font-size:13px;cursor:pointer" id="ins-perda-wrap" hidden>
          <input type="checkbox" id="ins-perda" style="width:auto">
          <span><b>Possível perda da peça</b> — bloquear para avaliação gerencial em vez de mandar para o ateliê</span></label>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn primary" id="ins-ok">Registrar inspeção</button>`,
      onMount: (w) => {
        desenhaFotos();
        UI.els('[data-addfoto]', w).forEach(b => b.onclick = (e) => {
          e.preventDefault();
          fotos.push({ kind: b.dataset.addfoto, label: null });
          desenhaFotos();
        });

        const sync = () => {
          let grave = false, qtd = 0;
          UI.els('.ins-bad', w).forEach((cb, i) => {
            const sev = UI.el('#sev-' + i, w), nt = UI.el('#nt-' + i, w);
            sev.disabled = !cb.checked; nt.disabled = !cb.checked;
            if (cb.checked) { qtd++; if (sev.value === 'grave') grave = true; }
          });
          const warn = UI.el('#ins-warn', w);
          const perda = UI.el('#ins-perda-wrap', w);
          const repair = UI.el('#ins-repair', w);
          warn.hidden = qtd === 0;
          perda.hidden = !grave;
          if (repair) repair.parentElement.hidden = grave || qtd === 0;
          if (qtd) warn.querySelector('span').innerHTML = grave
            ? `<b>Dano grave marcado.</b> A peça vai para <b>manutenção</b> e fica bloqueada até o reparo ser concluído.
               Se houver risco de perda, marque a opção abaixo para enviar à avaliação gerencial.`
            : `<b>${qtd} ressalva(s).</b> A peça segue para higienização. Marque “abrir ordem de reparo leve”
               se o ateliê precisar intervir antes de ela voltar à arara.`;
        };
        UI.els('.ins-bad', w).forEach(cb => cb.onchange = sync);
        UI.els('.ins-sev', w).forEach(x => x.onchange = sync);
        sync();

        UI.el('#ins-ok', w).onclick = () => {
          const findings = [];
          UI.els('.ins-bad', w).forEach((cb, i) => {
            if (cb.checked) findings.push({
              label: cb.dataset.label, ok: false,
              severity: UI.el('#sev-' + i, w).value, note: UI.el('#nt-' + i, w).value || null
            });
          });
          const grave = findings.some(f => f.severity === 'grave');
          const perda = grave && UI.el('#ins-perda') && UI.el('#ins-perda').checked;
          const result = perda ? 'perda' : (!findings.length ? 'aprovada' : grave ? 'reprovada' : 'ressalva');
          E.registerInspection(g.id, {
            reservation_id: r ? r.id : null, result, findings, photos: fotos,
            notes: UI.val('#ins-notes') || (findings.length ? 'Ressalvas registradas na inspeção.' : 'Peça devolvida em boas condições.'),
            maintenance_kind: UI.val('#ins-kind'),
            provider: UI.val('#ins-prov') || null,
            open_repair: UI.el('#ins-repair') ? UI.el('#ins-repair').checked : false
          });
          UI.closeModal();
          UI.toast('Inspeção registrada',
            perda ? `${g.code} bloqueada para avaliação gerencial.`
              : grave ? `${g.code} enviada para manutenção.`
              : `${g.code} enviada para higienização.`, 'ok');
          UI.render();
        };
      }
    });
  });
})();


/* ═══════════ 10-views-fin-int.js ═══════════ */
/* =====================================================================
   SENZIE OS — 10 · Financeiro, Inteligência e Configurações
   ===================================================================== */
(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;

  /* =============================================== FINANCEIRO */
  UI.state.fin = { range: '90' };
  UI.ACT.finRange = (d) => { UI.state.fin.range = d.v; UI.render(); };

  UI.VIEWS.financeiro = function financeiro() {
    const hoje = SZ.today();
    const dias = Number(UI.state.fin.range);
    const from = SZ.addDays(hoje, -dias + 1);
    const pagos = db.all('payment').filter(p => p.state === 'pago' && p.paid_at &&
      p.paid_at.slice(0, 10) >= from && p.paid_at.slice(0, 10) <= hoje);
    const receita = SZ.sum(pagos.filter(p => !['caucao', 'estorno'].includes(p.kind)), p => p.amount);
    const desp = db.all('expense').filter(e => e.incurred_at >= from && e.incurred_at <= hoje);
    const oper = SZ.sum(desp.filter(e => e.kind !== 'aquisicao'), e => e.amount);
    const aquis = SZ.sum(desp.filter(e => e.kind === 'aquisicao'), e => e.amount);

    const ativas = db.all('reservation').filter(r => SZ.ACTIVE_RESERVATION_STATES.includes(r.state));
    const aReceber = ativas.map(r => ({ r, b: E.balance(r) })).filter(x => x.b.due > 0);
    const totalAReceber = SZ.sum(aReceber, x => x.b.due);
    const pendentes = db.all('payment').filter(p => p.state === 'pendente');

    const porMetodo = SZ.groupBy(pagos.filter(p => !['caucao', 'estorno'].includes(p.kind)), p => p.method);
    const metodoRows = SZ.sortBy(Object.entries(porMetodo).map(([k, v]) => ({
      k: SZ.PAYMENT_METHOD[k] || k, v: SZ.sum(v, p => p.amount), n: v.length
    })), x => x.v, -1);

    const serie = [];
    const d0 = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1);
      const ini = SZ.ISO(d), fim = SZ.ISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      serie.push({ k: SZ.MES[d.getMonth()], v: SZ.metrics.revenueBetween(ini, fim > hoje ? hoje : fim) });
    }

    const lancamentos = SZ.sortBy(pagos, p => p.paid_at, -1).slice(0, 30);

    return UI.header('Financeiro', `${SZ.brl0(receita)} recebidos nos últimos ${dias} dias · ${SZ.brl0(totalAReceber)} a receber`, `
      <div class="seg">${[['30', '30 dias'], ['90', '90 dias'], ['365', '12 meses']].map(([k, l]) =>
        `<button class="${UI.state.fin.range === k ? 'on' : ''}" data-act="finRange" data-v="${k}">${l}</button>`).join('')}</div>`) + `
    <div class="view">
      <div class="tiles">
        ${UI.tile('Recebido', SZ.brl0(receita), `${pagos.length} lançamento(s)`)}
        ${UI.tile('A receber', SZ.brl0(totalAReceber), `${aReceber.length} reserva(s) em aberto`, totalAReceber > 0 ? 'alert' : '')}
        ${UI.tile('Custo operacional', SZ.brl0(oper), 'higienização, ajustes e reparos')}
        ${UI.tile('Margem operacional', receita > 0 ? SZ.pct(1 - oper / receita) : '—', 'antes de custo fixo e aquisição')}
        ${UI.tile('Investido em acervo', SZ.brl0(aquis), 'no período')}
      </div>

      <section class="card">
        <div class="card-h"><h3>Faturamento recebido por mês</h3><span class="dim tiny">últimos 12 meses · regime de caixa</span></div>
        <div class="card-b">${UI.lineChart({ points: serie, height: 200, aria: 'Faturamento recebido por mês, últimos 12 meses' })}</div>
      </section>

      <div class="grid g2">
        <section class="card">
          <div class="card-h"><h3>A receber</h3>${aReceber.length ? SZ.pill(SZ.brl0(totalAReceber), 'amber') : SZ.pill('nada em aberto', 'green')}</div>
          <div class="card-b flush">
            ${aReceber.length ? `<div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Reserva</th><th>Cliente</th><th>Retirada</th><th class="r">Total</th><th class="r">Falta</th></tr></thead>
              <tbody>${SZ.sortBy(aReceber, x => x.r.pickup_date).map(x => {
                const c = db.get('customer', x.r.customer_id);
                const urgente = SZ.diffDays(hoje, x.r.pickup_date) <= 2;
                return `<tr data-go="#/reservas/${x.r.id}">
                  <td class="mono tiny">${x.r.code}</td>
                  <td class="lead">${SZ.esc(c ? c.full_name : '')}</td>
                  <td class="tiny mono" style="${urgente ? 'color:var(--t-red);font-weight:600' : ''}">${SZ.fd(x.r.pickup_date)}</td>
                  <td class="r num">${SZ.brl0(x.b.devido)}</td>
                  <td class="r num" style="font-weight:600">${SZ.brl0(x.b.due)}</td></tr>`;
              }).join('')}</tbody></table></div>` : UI.empty('Nada a receber', 'Todas as reservas ativas estão quitadas.')}
            ${pendentes.length ? `<div style="padding:14px 16px;border-top:1px solid var(--line)">
              <div class="eyebrow" style="margin-bottom:7px">Cobranças lançadas e pendentes</div>
              ${pendentes.map(p => {
                const r = db.get('reservation', p.reservation_id);
                const c = r ? db.get('customer', r.customer_id) : null;
                return `<div class="spread tiny" style="padding:3px 0"><span>${SZ.PAYMENT_KIND[p.kind]} · ${SZ.esc(c ? c.full_name : '')}
                  <span class="dim">${SZ.esc(p.notes || '')}</span></span><span class="num" style="font-weight:600">${SZ.brl(p.amount)}</span></div>`;
              }).join('')}</div>` : ''}
          </div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Formas de pagamento</h3><span class="dim tiny">últimos ${dias} dias</span></div>
          <div class="card-b">
            ${metodoRows.length ? UI.hbars(metodoRows.map((m, i) => ({
              k: m.k, v: m.v, note: `${m.n}×`, color: `var(--cat-${(i % 6) + 1})`
            })), { fmt: SZ.brl0 }) : UI.empty('Sem recebimentos no período', '')}
          </div>
        </section>
      </div>

      <section class="card">
        <div class="card-h"><h3>Últimos lançamentos</h3><span class="dim tiny">${lancamentos.length} de ${pagos.length}</span></div>
        <div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Data</th><th>Reserva</th><th>Cliente</th><th>Tipo</th><th>Forma</th><th class="r">Valor</th></tr></thead>
          <tbody>${lancamentos.map(p => {
            const r = db.get('reservation', p.reservation_id);
            const c = r ? db.get('customer', r.customer_id) : null;
            return `<tr ${r ? `data-go="#/reservas/${r.id}"` : ''}>
              <td class="mono tiny">${SZ.fdy(p.paid_at.slice(0, 10))}</td>
              <td class="mono tiny">${r ? r.code : '—'}</td>
              <td class="lead">${SZ.esc(c ? c.full_name : '')}</td>
              <td class="tiny">${SZ.PAYMENT_KIND[p.kind] || p.kind}</td>
              <td class="tiny">${SZ.PAYMENT_METHOD[p.method] || p.method}</td>
              <td class="r num">${SZ.brl(p.amount)}</td></tr>`;
          }).join('')}</tbody></table></div></div>
      </section>
    </div>`;
  };

  /* ============================================== INTELIGÊNCIA */
  UI.state.intel = { range: '180' };
  UI.ACT.intelRange = (d) => { UI.state.intel.range = d.v; UI.render(); };

  UI.VIEWS.inteligencia = function inteligencia() {
    const hoje = SZ.today();
    const dias = Number(UI.state.intel.range);
    const from = SZ.addDays(hoje, -dias + 1);
    const garments = db.all('garment').filter(g => g.state !== 'baixado');
    const itens = db.all('reservation_item').map(i => ({ i, r: db.get('reservation', i.reservation_id), g: db.get('garment', i.garment_id) }))
      .filter(x => x.r && x.g && SZ.REALIZED_RESERVATION_STATES.includes(x.r.state));
    const noPeriodo = itens.filter(x => x.r.pickup_date >= from && x.r.pickup_date <= hoje);
    const receita = SZ.sum(noPeriodo, x => x.i.line_total);
    const ticket = noPeriodo.length ? receita / noPeriodo.length : 0;

    const clientes = db.all('customer');
    const stats = clientes.map(c => ({ c, s: E.customerStats(c) }));
    const comLocacao = stats.filter(x => x.s.rentals > 0);
    const recorrentes = stats.filter(x => x.s.rentals >= 2);
    const taxaRec = comLocacao.length ? recorrentes.length / comLocacao.length : 0;

    /* agregações */
    const porTamanho = {}, porCor = {}, porCategoria = {}, porPeca = {};
    noPeriodo.forEach(x => {
      porTamanho[x.g.size_equiv] = (porTamanho[x.g.size_equiv] || 0) + 1;
      porCor[x.g.color_primary] = porCor[x.g.color_primary] || { n: 0, hex: x.g.color_hex, receita: 0 };
      porCor[x.g.color_primary].n++; porCor[x.g.color_primary].receita += x.i.line_total;
      const cat = db.get('garment_category', x.g.category_id);
      const nome = cat ? cat.name : '—';
      porCategoria[nome] = porCategoria[nome] || { n: 0, receita: 0 };
      porCategoria[nome].n++; porCategoria[nome].receita += x.i.line_total;
      porPeca[x.g.id] = porPeca[x.g.id] || { g: x.g, n: 0, receita: 0 };
      porPeca[x.g.id].n++; porPeca[x.g.id].receita += x.i.line_total;
    });

    /* ocupação real por categoria: dias ocupados ÷ dias disponíveis */
    const ocupacao = {};
    db.all('garment_category').forEach(cat => {
      const gs = garments.filter(g => g.category_id === cat.id);
      if (!gs.length) return;
      let ocupados = 0;
      gs.forEach(g => {
        db.where('garment_calendar_block', b => b.garment_id === g.id && b.kind === 'locacao').forEach(b => {
          const ini = b.start_date > from ? b.start_date : from;
          const fim = b.end_date < hoje ? b.end_date : hoje;
          if (fim >= ini) ocupados += SZ.diffDays(ini, fim) + 1;
        });
      });
      ocupacao[cat.name] = { taxa: ocupados / (gs.length * dias), pecas: gs.length, dias: ocupados };
    });

    const semLocacao = garments.filter(g => {
      const ec = E.economics(g);
      return ec.rentals === 0 || (ec.idle_days != null && ec.idle_days > 90);
    }).map(g => ({ g, ec: E.economics(g) }));

    const topPecas = SZ.sortBy(Object.values(porPeca), x => x.receita, -1).slice(0, 8);

    /* v0.2 · conversão de prova por peça */
    const conv = garments.map(g => Object.assign({ g }, E.fittingStats(g.id))).filter(x => x.fittings > 0);
    const muitoProvadaPoucoAlugada = conv.filter(x => x.fittings >= 4 && (x.rate == null || x.rate < 0.35))
      .sort((a, b) => b.fittings - a.fittings);
    const melhorConversao = conv.filter(x => x.fittings >= 3).sort((a, b) => (b.rate || 0) - (a.rate || 0)).slice(0, 6);
    const poucoProvadas = garments.map(g => ({ g, fs: E.fittingStats(g.id), ec: E.economics(g) }))
      .filter(x => x.fs.fittings <= 1 && x.ec.rentals <= 1);
    const fittingsPeriodo = db.all('fitting_session').filter(x => {
      const d2 = String(x.scheduled_at).slice(0, 10);
      return d2 >= from && d2 <= hoje;
    });
    const fechadasPeriodo = fittingsPeriodo.filter(x => ['convertida', 'perdida', 'no_show'].includes(x.state));
    const taxaProva = fechadasPeriodo.length
      ? fittingsPeriodo.filter(x => x.state === 'convertida').length / fechadasPeriodo.length : null;
    const pressaoTam = E.pressure('size', dias);
    const pressaoCat = E.pressure('category', dias);
    const topClientes = SZ.sortBy(stats.filter(x => x.s.rentals > 0), x => x.s.spent, -1).slice(0, 8);
    const pagas = garments.map(g => ({ g, ec: E.economics(g) })).filter(x => x.ec.paid_back);

    /* ------------------- Inteligência de Acervo: frases acionáveis ----- */
    const insights = [];
    const tamTop = SZ.sortBy(Object.entries(porTamanho), x => x[1], -1)[0];
    if (tamTop && noPeriodo.length) insights.push({
      icon: 'subir', tone: 'green',
      txt: `Tamanho <b>${tamTop[0]}</b> concentra <b>${SZ.pct(tamTop[1] / noPeriodo.length)}</b> das locações do período (${tamTop[1]} de ${noPeriodo.length}).`,
      why: `O acervo tem ${garments.filter(g => g.size_equiv === tamTop[0]).length} peças nesse tamanho, de ${garments.length}. Próximas compras deveriam respeitar essa proporção.`
    });

    const corRows = SZ.sortBy(Object.entries(porCor).map(([k, v]) => ({ k, ...v })), x => x.n, -1);
    corRows.slice(0, 2).forEach(c => {
      const estoque = garments.filter(g => g.color_primary === c.k).length;
      const demandaPorPeca = c.n / estoque;
      if (demandaPorPeca >= 2.5) insights.push({
        icon: 'raio', tone: 'amber',
        txt: `<b>${c.k}</b> gira ${SZ.num(demandaPorPeca, 1)}× por peça — alta procura com estoque baixo.`,
        why: `${c.n} locações distribuídas em apenas ${estoque} peça(s). Cada nova peça nessa cor tende a alugar sozinha.`
      });
    });

    SZ.sortBy(Object.entries(ocupacao), x => x[1].taxa, -1).slice(0, 2).forEach(([nome, o]) => {
      if (o.taxa > 0.14) insights.push({
        icon: 'inteligencia', tone: 'green',
        txt: `Categoria <b>${nome}</b> está com <b>${SZ.pct(o.taxa)}</b> de ocupação nos últimos ${dias} dias.`,
        why: `${o.dias} dias de peça alugados sobre ${o.pecas * dias} dias disponíveis (${o.pecas} peças). Acima de 25% é sinal de que falta acervo.`
      });
    });

    if (semLocacao.length) insights.push({
      icon: 'descer', tone: 'red',
      txt: `<b>${semLocacao.length} peça(s)</b> sem locação nos últimos 90 dias.`,
      why: `${semLocacao.slice(0, 4).map(x => x.g.code).join(', ')}${semLocacao.length > 4 ? '…' : ''} — ${SZ.brl0(SZ.sum(semLocacao, x => x.ec.acquisition))} de capital parado. Avaliar redução de preço, reposicionamento na vitrine ou baixa.`
    });

    pagas.slice(0, 2).forEach(x => insights.push({
      icon: 'moeda', tone: 'green',
      txt: `<b>${x.g.code} — ${x.g.name}</b> recuperou o investimento após ${Math.ceil(x.ec.acquisition / (x.ec.avg || x.g.rental_price))} locações.`,
      why: `${SZ.brl0(x.ec.revenue)} de receita sobre ${SZ.brl0(x.ec.acquisition)} de custo. A partir daqui, cada locação é margem quase integral.`
    }));

    if (recorrentes.length) insights.push({
      icon: 'clientes', tone: 'green',
      txt: `<b>${SZ.pct(taxaRec)}</b> das clientes que já alugaram voltaram pelo menos uma segunda vez.`,
      why: `${recorrentes.length} de ${comLocacao.length}. Clientes recorrentes respondem por ${SZ.brl0(SZ.sum(recorrentes, x => x.s.spent))} — ${SZ.pct(SZ.sum(recorrentes, x => x.s.spent) / Math.max(1, SZ.sum(stats, x => x.s.spent)))} da receita acumulada.`
    });

    muitoProvadaPoucoAlugada.slice(0, 2).forEach(x => insights.push({
      icon: 'descer', tone: 'amber',
      txt: `<b>${x.g.code} — ${x.g.name}</b>: ${x.fittings} provas e ${x.converted === 0 ? '<b>nenhuma</b> virou locação' : `apenas ${x.converted} virou locação`} — ${SZ.pct(x.rate || 0)} de conversão.`,
      why: `Alta experimentação e baixa conversão. ${x.alterations ? `${x.alterations} clientes precisaram de ajuste. ` : ''}` +
           `${x.reasons.length ? `A equipe registrou: “${SZ.esc(x.reasons[x.reasons.length - 1].note)}”. ` : ''}` +
           `Revisar caimento, preço, conservação ou posicionamento na arara.`
    }));

    const pressaoAlta = pressaoTam.filter(p => p.pecas >= 2)[0];
    if (pressaoAlta && pressaoAlta.pressao > 0) insights.push({
      icon: 'raio', tone: 'amber',
      txt: `Tamanho <b>${pressaoAlta.key}</b> tem a maior pressão do acervo: ${SZ.num(pressaoAlta.pressao, 1)} procuras por peça.`,
      why: `${pressaoAlta.locacoes} locações e ${pressaoAlta.provas} provas distribuídas em ${pressaoAlta.pecas} peças, ` +
           `com ${SZ.pct(pressaoAlta.ocupacao, 1)} de ocupação. Pressão mede procura por peça — não volume absoluto, ` +
           `que só reflete quantas peças existem naquele tamanho.`
    });

    if (poucoProvadas.length >= 2) insights.push({
      icon: 'olhoOff', tone: 'stone',
      txt: `<b>${poucoProvadas.length} peça(s)</b> quase nunca são sequer provadas.`,
      why: `${poucoProvadas.slice(0, 4).map(x => x.g.code).join(', ')}${poucoProvadas.length > 4 ? '…' : ''} — ` +
           `pouca prova costuma indicar exposição ruim, foto fraca ou posição desfavorável na loja, não falta de demanda. ` +
           `Antes de baixar do acervo, vale testar reposicionamento.`
    });

    if (taxaProva != null) insights.push({
      icon: 'prova', tone: taxaProva >= 0.5 ? 'green' : 'amber',
      txt: `<b>${SZ.pct(taxaProva)}</b> das provas encerradas no período viraram reserva.`,
      why: `${fittingsPeriodo.filter(x => x.state === 'convertida').length} conversões em ${fechadasPeriodo.length} provas encerradas. ` +
           `Cada ponto dessa taxa vale mais que um ponto de tráfego: a cliente já está na loja e já vestiu a peça.`
    });

    const catTicket = SZ.sortBy(Object.entries(porCategoria).map(([k, v]) => ({ k, t: v.receita / v.n, n: v.n })), x => x.t, -1)[0];
    if (catTicket) insights.push({
      icon: 'tag', tone: 'stone',
      txt: `Maior valor médio por locação: <b>${catTicket.k}</b>, a ${SZ.brl0(catTicket.t)}.`,
      why: `${catTicket.n} locações no período. Comparar com o ticket médio geral de ${SZ.brl0(ticket)} ao decidir a próxima compra.`
    });

    return UI.header('Inteligência', `${noPeriodo.length} locações · ${SZ.brl0(receita)} · ticket ${SZ.brl0(ticket)} nos últimos ${dias} dias`, `
      <div class="seg">${[['90', '90 dias'], ['180', '6 meses'], ['365', '12 meses']].map(([k, l]) =>
        `<button class="${UI.state.intel.range === k ? 'on' : ''}" data-act="intelRange" data-v="${k}">${l}</button>`).join('')}</div>`) + `
    <div class="view">
      <div class="tiles">
        ${UI.tile('Locações', noPeriodo.length, `no período`)}
        ${UI.tile('Faturamento', SZ.brl0(receita), 'valor das locações')}
        ${UI.tile('Ticket médio', SZ.brl0(ticket), 'por locação')}
        ${UI.tile('Clientes ativas', comLocacao.length, `de ${clientes.length} cadastradas`)}
        ${UI.tile('Taxa de recorrência', SZ.pct(taxaRec), `${recorrentes.length} clientes voltaram`)}
        ${UI.tile('Peças paradas', semLocacao.length, 'sem locação há 90+ dias', semLocacao.length ? 'alert' : '')}
        ${UI.tile('Conversão de prova', taxaProva == null ? '—' : SZ.pct(taxaProva), `${fechadasPeriodo.length} provas encerradas`)}
      </div>

      <section class="card">
        <div class="card-h"><h3>Inteligência de acervo</h3>
          <span class="dim tiny">o que os dados operacionais dizem sobre a próxima compra</span></div>
        <div class="card-b flush">
          ${insights.map(i => `<div class="insight">
            <span class="ic" style="background:var(--t-${i.tone}-bg);color:var(--t-${i.tone})">${SZ.icon(i.icon, 14)}</span>
            <span class="tx">${i.txt}<span class="why">${i.why}</span></span></div>`).join('')}
        </div>
      </section>

      <div class="grid g2">
        <section class="card">
          <div class="card-h"><h3>Receita por peça</h3><span class="dim tiny">top 8 no período</span></div>
          <div class="card-b">${topPecas.length ? UI.hbars(topPecas.map(x => ({
            k: x.g.name, v: x.receita, note: `${x.n}×`, href: '#/acervo/' + x.g.id, color: x.g.color_hex
          })), { fmt: SZ.brl0 }) : UI.empty('Sem locações no período', '')}
          <div class="tiny dim" style="margin-top:12px">A barra usa a cor real da peça.</div></div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Cores mais procuradas</h3><span class="dim tiny">locações por cor</span></div>
          <div class="card-b">${corRows.length ? UI.hbars(corRows.slice(0, 8).map(c => ({
            k: c.k, v: c.n, note: `${garments.filter(g => g.color_primary === c.k).length} no acervo`, color: c.hex
          })), { fmt: v => v + '×' }) : UI.empty('Sem dados no período', '')}</div>
        </section>
      </div>

      <div class="grid g2">
        <section class="card">
          <div class="card-h"><h3>Tamanhos mais procurados</h3><span class="dim tiny">locações no período</span></div>
          <div class="card-b">${Object.keys(porTamanho).length
            ? UI.stackBars(SZ.sortBy(Object.entries(porTamanho).map(([k, v]) => ({ k: 'Tam. ' + k, v })), x => x.v, -1)
              .map((r, i) => Object.assign(r, { color: `var(--cat-${(i % 6) + 1})` })), { fmt: v => v + '×' })
            : UI.empty('Sem dados', '')}</div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Ocupação por categoria</h3><span class="dim tiny">dias alugados ÷ dias disponíveis</span></div>
          <div class="card-b">${UI.hbars(SZ.sortBy(Object.entries(ocupacao).map(([k, v]) => ({
            k, v: v.taxa, note: `${v.pecas} peça(s)`
          })), x => x.v, -1), { fmt: v => SZ.pct(v, 1) })}</div>
        </section>
      </div>

      <div class="grid g2">
        <section class="card">
          <div class="card-h"><h3>Conversão de prova por peça</h3>
            <span class="dim tiny">quem encanta e fecha</span></div>
          <div class="card-b">
            ${melhorConversao.length ? UI.hbars(melhorConversao.map(x => ({
              k: x.g.name, v: x.rate, note: `${x.converted}/${x.fittings}`, href: '#/acervo/' + x.g.id, color: x.g.color_hex
            })), { fmt: v => SZ.pct(v) }) : UI.empty('Ainda sem provas suficientes', 'Registre o resultado das provas para alimentar este indicador.')}
          </div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Encanta e não fecha</h3>
            <span class="dim tiny">muita prova, pouca locação</span></div>
          <div class="card-b flush">
            ${muitoProvadaPoucoAlugada.length ? `<div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Peça</th><th class="r">Provas</th><th class="r">Locações</th><th class="r">Conversão</th><th>Sinal</th></tr></thead>
              <tbody>${muitoProvadaPoucoAlugada.slice(0, 8).map(x => `<tr data-go="#/acervo/${x.g.id}">
                <td><span class="mono tiny">${x.g.code}</span><br><span class="lead">${SZ.esc(x.g.name)}</span></td>
                <td class="r num">${x.fittings}</td>
                <td class="r num">${x.converted}</td>
                <td class="r num" style="color:var(--t-red);font-weight:600">${x.rate == null ? '0%' : SZ.pct(x.rate)}</td>
                <td class="tiny">${x.alterations ? `${x.alterations} pediram ajuste` : x.discards ? `${x.discards} descarte(s)` : 'sem sinal claro'}</td>
              </tr>`).join('')}</tbody></table></div>`
              : UI.empty('Nenhuma peça nesse padrão', 'Quem prova, leva.')}
          </div>
        </section>
      </div>

      <div class="grid g2">
        <section class="card">
