          <div class="card-h"><h3>Pressão do acervo por tamanho</h3>
            <span class="dim tiny">procuras por peça — não volume absoluto</span></div>
          <div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Tamanho</th><th class="r">Peças</th><th class="r">Locações</th><th class="r">Provas</th>
              <th class="r">Ocupação</th><th class="r">Pressão</th></tr></thead>
            <tbody>${pressaoTam.map(p => `<tr style="cursor:default">
              <td class="lead">${SZ.esc(p.key)}</td>
              <td class="r num">${p.pecas}</td><td class="r num">${p.locacoes}</td><td class="r num">${p.provas}</td>
              <td class="r num">${SZ.pct(p.ocupacao, 1)}</td>
              <td class="r num" style="font-weight:600">${SZ.num(p.pressao, 1)}×</td></tr>`).join('')}</tbody>
          </table></div>
          <div class="tiny dim" style="padding:11px 16px">Pressão = (locações + metade das provas) ÷ peças do segmento.
            Um tamanho com muitas locações pode simplesmente ter muitas peças; a pressão corrige isso.</div>
          </div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Pressão por categoria</h3>
            <span class="dim tiny">onde falta acervo</span></div>
          <div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Categoria</th><th class="r">Peças</th><th class="r">Ocupação</th><th class="r">Pressão</th></tr></thead>
            <tbody>${pressaoCat.map(p => `<tr style="cursor:default">
              <td class="lead">${SZ.esc(p.key)}</td>
              <td class="r num">${p.pecas}</td>
              <td class="r num">${SZ.pct(p.ocupacao, 1)}</td>
              <td class="r num" style="font-weight:600">${SZ.num(p.pressao, 1)}×</td></tr>`).join('')}</tbody>
          </table></div></div>
        </section>
      </div>

      <div class="grid g2">
        <section class="card">
          <div class="card-h"><h3>Clientes que mais alugam</h3></div>
          <div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Cliente</th><th class="r">Locações</th><th class="r">Total</th><th class="r">Ticket</th></tr></thead>
            <tbody>${topClientes.map(x => `<tr data-go="#/clientes/${x.c.id}">
              <td class="lead">${SZ.esc(x.c.full_name)}<br><span class="dim tiny">${SZ.esc(x.c.city || '')}</span></td>
              <td class="r num">${x.s.rentals}</td>
              <td class="r num">${SZ.brl0(x.s.spent)}</td>
              <td class="r num">${SZ.brl0(x.s.ticket)}</td></tr>`).join('')}</tbody>
          </table></div></div>
        </section>

        <section class="card">
          <div class="card-h"><h3>Capital parado</h3><span class="dim tiny">peças sem locação recente</span></div>
          <div class="card-b flush">
            ${semLocacao.length ? `<div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Peça</th><th>Estado</th><th class="r">Custo</th><th class="r">Receita</th><th class="r">Parada há</th></tr></thead>
              <tbody>${SZ.sortBy(semLocacao, x => x.ec.acquisition, -1).map(x => `<tr data-go="#/acervo/${x.g.id}">
                <td><span class="mono tiny">${x.g.code}</span><br><span class="lead">${SZ.esc(x.g.name)}</span></td>
                <td>${SZ.statePill(x.g.state)}</td>
                <td class="r num">${SZ.brl0(x.ec.acquisition)}</td>
                <td class="r num">${SZ.brl0(x.ec.revenue)}</td>
                <td class="r tiny">${x.ec.idle_days != null ? x.ec.idle_days + ' dias' : 'nunca alugada'}</td></tr>`).join('')}</tbody>
            </table></div>` : UI.empty('Acervo inteiro girando', 'Nenhuma peça parada há mais de 90 dias.')}
          </div>
        </section>
      </div>
    </div>`;
  };

  /* Configurações agora vivem em 13-views-config.js (v0.2). */
})();


/* ═══════════ 12-views-provas.js ═══════════ */
/* =====================================================================
   SENZIE OS — 12 · Provas (sessão de prova) · v0.2

   A prova é onde a cliente decide. Registrar apenas "compareceu" joga fora
   o dado mais valioso da locadora: o que ela vestiu e por que não levou.
   Provas não ganham item de menu — elas aparecem na Agenda, na ficha da
   cliente e na ficha da peça, que é onde a equipe realmente está.
   ===================================================================== */
(function () {
  const db = SZ.db, E = SZ.E, UI = SZ.UI;

  UI.state.provas = { filtro: 'abertas' };
  UI.ACT.pvFilter = (d) => { UI.state.provas.filtro = d.v; UI.render(); };

  /* ------------------------------------------------------------ LISTA */
  UI.VIEWS.provas = function provas(id) {
    if (id) return fittingDetail(id);
    const f = UI.state.provas.filtro;
    let list = db.all('fitting_session');
    if (f === 'abertas') list = list.filter(x => ['agendada', 'em_curso'].includes(x.state));
    if (f === 'convertidas') list = list.filter(x => x.state === 'convertida');
    if (f === 'perdidas') list = list.filter(x => ['perdida', 'no_show'].includes(x.state));
    list = SZ.sortBy(list, x => x.scheduled_at, -1);

    const todas = db.all('fitting_session');
    const fechadas = todas.filter(x => ['convertida', 'perdida', 'no_show'].includes(x.state));
    const conv = todas.filter(x => x.state === 'convertida').length;
    const taxa = fechadas.length ? conv / fechadas.length : 0;

    return UI.header('Provas', `${todas.length} sessões · ${SZ.pct(taxa)} de conversão`, `
      ${SZ.can('prova.manage') ? `<button class="btn primary" data-act="newFitting">${SZ.icon('plus', 14)} Agendar prova</button>` : ''}`) + `
    <div class="view">
      <div class="tiles">
        ${UI.tile('Em aberto', todas.filter(x => ['agendada', 'em_curso'].includes(x.state)).length, 'agendadas ou em curso')}
        ${UI.tile('Convertidas', conv, 'viraram reserva')}
        ${UI.tile('Sem conversão', todas.filter(x => x.state === 'perdida').length, 'cliente não fechou')}
        ${UI.tile('Taxa de conversão', SZ.pct(taxa), `sobre ${fechadas.length} provas encerradas`)}
      </div>

      <section class="card"><div class="card-b"><div class="chips">
        ${[['abertas', 'Em aberto'], ['convertidas', 'Convertidas'], ['perdidas', 'Sem conversão'], ['todas', 'Todas']]
          .map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="pvFilter" data-v="${k}">${l}</button>`).join('')}
      </div></div></section>

      <section class="card"><div class="card-b flush">
        ${list.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Prova</th><th>Cliente</th><th>Quando</th><th>Peças</th><th>Resultado</th><th>Situação</th></tr></thead>
          <tbody>${list.map(x => {
            const c = db.get('customer', x.customer_id);
            const items = db.where('fitting_item', i => i.fitting_session_id === x.id);
            const pos = items.filter(i => (SZ.FIT_OUTCOME[i.outcome] || {}).positive === true).length;
            const st = SZ.FITTING_STATE[x.state] || { label: x.state, tone: 'stone' };
            return `<tr data-go="#/provas/${x.id}">
              <td class="mono tiny">${x.code}</td>
              <td class="lead">${SZ.esc(c ? c.full_name : '—')}<br><span class="dim tiny">${SZ.esc(x.event_type || '')}</span></td>
              <td class="tiny mono">${SZ.fd(String(x.scheduled_at).slice(0, 10))} ${SZ.ftime(x.scheduled_at)}</td>
              <td class="r num">${items.length}</td>
              <td class="tiny">${items.length ? `${pos} aprovada(s) · ${items.filter(i => (SZ.FIT_OUTCOME[i.outcome] || {}).positive === false).length} descartada(s)` : '<span class="dim">sem registro</span>'}</td>
              <td>${SZ.pill(st.label, st.tone)}</td>
            </tr>`;
          }).join('')}</tbody></table></div>` : UI.empty('Nenhuma prova neste filtro', 'Agende uma prova a partir da ficha da cliente ou da agenda.')}
      </div></section>
    </div>`;
  };

  /* ------------------------------------------------------------ FICHA */
  function fittingDetail(id) {
    const f = db.get('fitting_session', id);
    if (!f) return UI.header('Prova não encontrada', '') + `<div class="view"><section class="card">${UI.empty('Prova não encontrada', '')}</section></div>`;
    const c = db.get('customer', f.customer_id);
    const st = SZ.FITTING_STATE[f.state] || { label: f.state, tone: 'stone' };
    const att = f.attendant_id ? db.get('app_user', f.attendant_id) : null;
    const items = SZ.sortBy(db.where('fitting_item', i => i.fitting_session_id === f.id), i => i.position)
      .map(i => ({ i, g: db.get('garment', i.garment_id) })).filter(x => x.g);
    const med = SZ.sortBy(db.where('customer_measurement', m => m.customer_id === f.customer_id), m => m.measured_at, -1)[0] || {};
    const pref = db.first('customer_preference', p => p.customer_id === f.customer_id) || {};
    const pinned = db.where('customer_interaction', i => i.customer_id === f.customer_id && i.pinned);
    const aberta = ['agendada', 'em_curso'].includes(f.state);
    const pode = SZ.can('prova.manage');
    const aprovadas = items.filter(x => (SZ.FIT_OUTCOME[x.i.outcome] || {}).positive === true);
    const resv = f.reservation_id ? db.get('reservation', f.reservation_id) : null;

    const acoes = [];
    if (aberta && pode && aprovadas.length && SZ.can('reserva.create'))
      acoes.push(`<button class="btn primary" data-act="fittingToReservation" data-id="${f.id}">${SZ.icon('plus', 14)} Gerar reserva</button>`);
    if (aberta && pode)
      acoes.push(`<button class="btn" data-act="addFittingGarment" data-id="${f.id}">${SZ.icon('acervo', 14)} Separar peça</button>`);
    if (aberta && pode)
      acoes.push(`<button class="btn" data-act="closeFitting" data-id="${f.id}">${SZ.icon('check', 14)} Encerrar prova</button>`);
    if (resv)
      acoes.push(`<a class="btn" href="#/reservas/${resv.id}">${SZ.icon('reservas', 14)} ${resv.code}</a>`);

    return UI.header(`Prova ${f.code}`,
      `${SZ.esc(c ? c.full_name : '')} · ${SZ.fdweek(String(f.scheduled_at).slice(0, 10))} às ${SZ.ftime(f.scheduled_at)}`,
      acoes.join('')) + `
    <div class="view">
      ${f.state === 'convertida' && resv ? `<div class="note green">${SZ.icon('check')}<span>
        <b>Prova convertida em reserva.</b> <a href="#/reservas/${resv.id}">${resv.code}</a> —
        ${SZ.esc((db.get('customer', resv.customer_id) || {}).full_name || '')}, evento em ${SZ.fdy(resv.event_date)}.</span></div>` : ''}
      ${f.state === 'perdida' ? `<div class="note info">${SZ.icon('x')}<span><b>Prova encerrada sem conversão.</b>
        ${SZ.esc(f.outcome_notes || 'Sem motivo registrado.')}</span></div>` : ''}
      ${f.state === 'no_show' ? `<div class="note red">${SZ.icon('alerta')}<span><b>Cliente não compareceu.</b>
        ${SZ.esc(f.outcome_notes || '')}</span></div>` : ''}

      <div class="profile">
        <aside class="side">
          <section class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:13px">
            <div class="spread"><span class="eyebrow">Situação</span>${SZ.pill(st.label, st.tone)}</div>
            <div class="row" style="gap:11px">
              <div class="avatar-lg" style="width:44px;height:44px;font-size:17px">${SZ.initials(c ? c.full_name : '?')}</div>
              <div style="min-width:0">
                <a href="#/clientes/${f.customer_id}" style="font-weight:650;font-size:14px">${SZ.esc(c ? c.full_name : '')}</a>
                <div class="tiny dim">${SZ.esc(c ? (c.city || '') : '')} · tamanho ${SZ.esc(med.usual_size || '—')}</div>
              </div>
            </div>
            <dl class="kv">
              <dt>Atendente</dt><dd>${SZ.esc(att ? att.full_name : '—')}</dd>
              <dt>Evento</dt><dd>${SZ.esc(f.event_type || '—')}</dd>
              <dt>Data do evento</dt><dd>${f.event_date ? SZ.fdy(f.event_date) : '—'}</dd>
              <dt>Orçamento</dt><dd>${f.budget ? 'até ' + SZ.brl0(f.budget) : 'não informado'}</dd>
              <dt>Medidas</dt><dd>${med.bust_cm ? `${med.bust_cm} / ${med.waist_cm} / ${med.hip_cm}` : '—'}</dd>
            </dl>
            ${pref.preferred_colors && pref.preferred_colors.length ? `<div class="note info">${SZ.icon('coracao')}<span>
              Prefere ${pref.preferred_colors.join(', ').toLowerCase()}${pref.avoided_colors && pref.avoided_colors.length ? `; evita ${pref.avoided_colors.join(', ').toLowerCase()}` : ''}.
              ${pref.fit_preference ? ` Modelagem ${pref.fit_preference}.` : ''}</span></div>` : ''}
            ${pinned.length ? pinned.slice(0, 2).map(p => `<div style="font-size:12.5px;line-height:1.45;padding-left:9px;border-left:2px solid var(--accent-line)">
              ${SZ.esc(p.content)}</div>`).join('') : ''}
            ${f.notes ? `<div class="note info">${SZ.icon('editar')}<span>${SZ.esc(f.notes)}</span></div>` : ''}
          </div></section>
        </aside>

        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <section class="card">
            <div class="card-h">
              <h3>Peças separadas</h3>
              <span class="dim tiny">${items.length} peça(s) · ${aprovadas.length} aprovada(s)</span>
              ${aberta && pode ? `<div class="actions"><button class="btn sm" data-act="addFittingGarment" data-id="${f.id}">${SZ.icon('plus', 13)} Separar</button></div>` : ''}
            </div>
            <div class="card-b flush">
              ${items.length ? items.map(x => fittingRow(f, x.i, x.g, aberta && pode)).join('')
                : UI.empty('Nenhuma peça separada', 'Separe as peças que a cliente vai experimentar.')}
            </div>
          </section>

          ${items.some(x => x.i.note) ? `<section class="card">
            <div class="card-h"><h3>O que a cliente disse</h3><span class="dim tiny">alimenta a inteligência de compra</span></div>
            <div class="card-b"><div class="tline">
              ${items.filter(x => x.i.note).map(x => {
                const o = SZ.FIT_OUTCOME[x.i.outcome] || { label: x.i.outcome, tone: 'stone' };
                return `<div class="ev">
                  <span class="dt mono">${x.g.code}</span>
                  <span class="ln"><i style="background:var(--t-${o.tone})"></i></span>
                  <span class="bd"><span class="t2">${SZ.esc(x.i.note)}</span>
                    <span class="n2">${SZ.esc(x.g.name)} · ${o.label}${x.i.needs_alteration ? ' · precisa ajuste' : ''}</span></span>
                </div>`;
              }).join('')}
            </div></div>
          </section>` : ''}
        </div>
      </div>
    </div>`;
  }

  function fittingRow(f, it, g, editable) {
    const o = SZ.FIT_OUTCOME[it.outcome] || SZ.FIT_OUTCOME.nao_provou;
    const fav = E.isFavorite(f.customer_id, g.id);
    return `<div class="ag-item" style="grid-template-columns:46px 1fr auto;padding:11px 14px;align-items:flex-start">
      <span style="width:46px;height:60px;border-radius:5px;overflow:hidden;cursor:pointer" data-go="#/acervo/${g.id}">${SZ.silhouette(g)}</span>
      <span style="min-width:0">
        <span class="ttl">${SZ.esc(g.name)} <span class="mono dim tiny">${g.code}</span>
          ${fav ? `<span style="color:var(--accent-text)" title="Favorita">${SZ.icon('coracao', 13)}</span>` : ''}</span>
        <span class="sub2">${SZ.esc(g.color_primary)} · tam. ${g.label_size} · ${SZ.brl0(g.rental_price)}
          ${g.fit_runs ? ` · ${SZ.esc(SZ.FIT_RUNS[g.fit_runs] || '')}` : ''}</span>
        ${it.note ? `<span class="sub2" style="color:var(--ink-2)">“${SZ.esc(it.note)}”</span>` : ''}
        ${editable ? `<span class="chips" style="margin-top:7px">
          ${['favorita', 'serviu', 'gostou', 'precisa_ajuste', 'apertada', 'larga', 'nao_gostou', 'descartada'].map(k => {
            const oc = SZ.FIT_OUTCOME[k];
            return `<button class="chip ${it.outcome === k ? 'on' : ''}" data-act="setOutcome"
              data-f="${f.id}" data-g="${g.id}" data-o="${k}">${oc.label}</button>`;
          }).join('')}
        </span>` : ''}
      </span>
      <span class="row" style="gap:6px;align-items:center">
        ${SZ.pill(o.label, o.tone)}
        ${editable ? `<button class="icon-btn" data-act="fittingNote" data-f="${f.id}" data-g="${g.id}"
            title="Observação da atendente" aria-label="Observação">${SZ.icon('editar', 15)}</button>` : ''}
        ${SZ.can('cliente.edit') ? `<button class="icon-btn" data-act="toggleFav" data-c="${f.customer_id}" data-g="${g.id}"
            title="${fav ? 'Remover dos favoritos' : 'Marcar como favorita'}" aria-label="Favorita"
            style="${fav ? 'color:var(--accent-text)' : ''}">${SZ.icon('coracao', 15)}</button>` : ''}
        ${editable ? `<button class="icon-btn" data-act="removeFittingGarment" data-f="${f.id}" data-g="${g.id}"
            title="Retirar da prova" aria-label="Retirar">${SZ.icon('x', 15)}</button>` : ''}
      </span>
    </div>`;
  }

  /* ------------------------------------------------------------ ações */
  UI.ACT.setOutcome = (d) => SZ.require('prova.manage', () => {
    E.setFittingOutcome(d.f, d.g, { outcome: d.o, needs_alteration: d.o === 'precisa_ajuste' });
    UI.render();
  });

  UI.ACT.toggleFav = (d) => SZ.require('cliente.edit', () => {
    const on = !E.isFavorite(d.c, d.g);
    E.setFavorite(d.c, d.g, on, d.src || 'manual');
    const g = db.get('garment', d.g);
    UI.toast(on ? 'Marcada como favorita' : 'Removida dos favoritos', g ? `${g.code} · ${g.name}` : '', 'ok');
    UI.render();
  });

  UI.ACT.removeFittingGarment = (d) => SZ.require('prova.manage', () => {
    E.removeFittingGarment(d.f, d.g);
    UI.render();
  });

  UI.ACT.fittingNote = (d) => SZ.require('prova.manage', () => {
    const it = db.first('fitting_item', i => i.fitting_session_id === d.f && i.garment_id === d.g);
    const g = db.get('garment', d.g);
    UI.modal({
      title: 'Observação da prova', sub: `${g.code} · ${g.name}`,
      body: `<div class="field"><label for="fn-txt">O que a cliente disse ou a atendente observou</label>
          <textarea id="fn-txt" style="min-height:88px" placeholder="Marcando muito a cintura. Gostou do comprimento, mas quer sem manga.">${SZ.esc(it ? it.note || '' : '')}</textarea></div>
        <label class="row" style="gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="fn-adj" ${it && it.needs_alteration ? 'checked' : ''} style="width:auto">
          <span>Precisa de ajuste para servir</span></label>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="fn-ok">Salvar</button>`,
      onMount: (w) => {
        UI.el('#fn-ok', w).onclick = () => {
          E.setFittingOutcome(d.f, d.g, {
            outcome: it ? it.outcome : 'gostou',
            needs_alteration: UI.el('#fn-adj').checked,
            note: UI.val('#fn-txt')
          });
          UI.closeModal(); UI.toast('Observação registrada', 'Ela aparece na ficha da peça e da cliente.', 'ok'); UI.render();
        };
      }
    });
  });

  UI.ACT.addFittingGarment = (d) => SZ.require('prova.manage', () => {
    const f = db.get('fitting_session', d.id);
    const med = SZ.sortBy(db.where('customer_measurement', m => m.customer_id === f.customer_id), m => m.measured_at, -1)[0];
    const S = { q: '' };
    const lista = () => {
      let cands = db.all('garment').filter(g => g.state !== 'baixado');
      if (S.q) cands = cands.filter(g => SZ.norm(`${g.code} ${g.name} ${g.color_primary} ${g.fabric}`).includes(SZ.norm(S.q)));
      else if (med && med.usual_size) cands = cands.filter(g => g.size_equiv === med.usual_size);
      const ja = db.where('fitting_item', i => i.fitting_session_id === f.id).map(i => i.garment_id);
      return SZ.sortBy(cands.filter(g => ja.indexOf(g.id) < 0), g => g.code).slice(0, 40);
    };
    const body = () => `
      <div class="field"><input id="af-q" placeholder="Buscar por código, nome ou cor…" value="${SZ.esc(S.q)}"></div>
      <div class="tiny dim">${S.q ? 'busca livre' : med && med.usual_size ? `filtrado pelo tamanho ${med.usual_size} da cliente` : 'todo o acervo'}</div>
      <div style="max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-md)">
        ${lista().map(g => `<div class="ag-item" data-act="pickFitGarment" data-f="${f.id}" data-g="${g.id}"
            style="grid-template-columns:34px 1fr auto;padding:8px 12px">
          <span style="width:34px;height:44px;border-radius:4px;overflow:hidden">${SZ.silhouette(g)}</span>
          <span><span class="ttl">${SZ.esc(g.name)} <span class="mono dim tiny">${g.code}</span></span>
            <span class="sub2">${SZ.esc(g.color_primary)} · tam. ${g.label_size} · ${SZ.brl0(g.rental_price)}</span></span>
          <span>${SZ.statePill(g.state)}</span>
        </div>`).join('') || '<div class="empty-state" style="padding:24px"><div class="d">Nada encontrado.</div></div>'}
      </div>`;
    UI.modal({
      title: 'Separar peça para a prova', sub: `${f.code} · a peça não fica bloqueada — prova não ocupa calendário`,
      wide: true, body: body(),
      footer: `<button class="btn" data-act="closeModal">Concluir</button>`,
      onMount: (w) => {
        const bind = () => {
          const q = UI.el('#af-q', w); if (!q) return;
          q.oninput = () => {
            clearTimeout(S._t); const v = q.value;
            S._t = setTimeout(() => {
              S.q = v; UI.el('.modal-b', w).innerHTML = body(); bind();
              const n = UI.el('#af-q'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
            }, 260);
          };
        };
        bind();
        UI.el('.modal-b', w).addEventListener('click', () => setTimeout(bind, 10));
      }
    });
  });

  UI.ACT.pickFitGarment = (d) => {
    E.addFittingGarment(d.f, d.g);
    const g = db.get('garment', d.g);
    UI.toast('Peça separada', `${g.code} · ${g.name}`, 'ok');
    const w = UI.el('#scrim');
    if (w) { UI.closeModal(); UI.ACT.addFittingGarment({ id: d.f }); }
    UI.render();
  };

  UI.ACT.newFitting = (d) => SZ.require('prova.manage', () => {
    const preset = d && d.customer ? d.customer : '';
    UI.modal({
      title: 'Agendar prova', sub: 'A prova não bloqueia o calendário das peças — ela registra o que a cliente experimentou',
      body: `<div class="fgrid">
          <div class="field full"><label for="nf-cust">Cliente *</label>
            <select id="nf-cust"><option value="">— selecionar —</option>
              ${SZ.sortBy(db.all('customer'), x => x.full_name).map(x =>
                `<option value="${x.id}" ${preset === x.id ? 'selected' : ''}>${SZ.esc(x.full_name)} · ${x.code}</option>`).join('')}
            </select></div>
          <div class="field"><label for="nf-date">Data *</label><input type="date" id="nf-date" value="${SZ.addDays(SZ.today(), 1)}"></div>
          <div class="field"><label for="nf-time">Horário</label><input type="time" id="nf-time" value="15:00"></div>
          <div class="field"><label for="nf-att">Atendente</label><select id="nf-att">
            ${db.all('app_user').filter(u => u.is_active !== false).map(u =>
              `<option value="${u.id}" ${u.id === db.session.user_id ? 'selected' : ''}>${SZ.esc(u.full_name)}</option>`).join('')}</select></div>
          <div class="field"><label for="nf-ev">Evento pretendido</label><input id="nf-ev" list="evtypes2" placeholder="Casamento">
            <datalist id="evtypes2">${['Casamento', 'Formatura', 'Aniversário', 'Festa corporativa', 'Baile de gala', 'Casamento civil', 'Premiação'].map(x => `<option value="${x}">`).join('')}</datalist></div>
          <div class="field"><label for="nf-evdate">Data do evento</label><input type="date" id="nf-evdate"></div>
          <div class="field"><label for="nf-budget">Orçamento até (R$)</label><input type="number" id="nf-budget" min="0" step="10" placeholder="900"></div>
          <div class="field full"><label for="nf-notes">Observações</label>
            <textarea id="nf-notes" placeholder="Quer ver longos em tons neutros. Só consegue vir depois das 19h."></textarea></div>
        </div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="nf-ok">Agendar prova</button>`,
      onMount: (w) => {
        UI.el('#nf-ok', w).onclick = () => {
          const cust = UI.val('#nf-cust'), date = UI.val('#nf-date');
          if (!cust) { UI.toast('Selecione a cliente', '', 'err'); return; }
          if (!date) { UI.toast('Informe a data', '', 'err'); return; }
          const evd = UI.val('#nf-evdate');
          if (evd && evd < date) { UI.toast('Datas incoerentes', 'O evento não pode ser antes da prova.', 'err'); return; }
          const f = E.createFitting({
            customer_id: cust,
            scheduled_at: date + 'T' + (UI.val('#nf-time') || '15:00') + ':00',
            attendant_id: UI.val('#nf-att') || db.session.user_id,
            event_type: UI.val('#nf-ev') || null, event_date: evd || null,
            budget: UI.numval('#nf-budget') || null, notes: UI.val('#nf-notes') || null
          });
          UI.closeModal();
          UI.toast('Prova agendada', `${f.code} · ${SZ.fd(date)}`, 'ok');
          UI.go('#/provas/' + f.id);
        };
      }
    });
  });

  UI.ACT.closeFitting = (d) => SZ.require('prova.manage', () => {
    const f = db.get('fitting_session', d.id);
    const items = db.where('fitting_item', i => i.fitting_session_id === f.id);
    const semResultado = items.filter(i => i.outcome === 'nao_provou').length;
    UI.modal({
      title: 'Encerrar prova', sub: f.code,
      body: `${semResultado ? `<div class="note amber">${SZ.icon('alerta')}<span><b>${semResultado} peça(s) sem resultado registrado.</b>
          Sem isso a Inteligência não consegue dizer o que encanta e não converte.</span></div>` : ''}
        <div class="field"><label for="cf-state">Como terminou</label><select id="cf-state">
          <option value="perdida">Sem conversão — cliente não fechou</option>
          <option value="concluida">Concluída — decisão pendente</option>
          <option value="no_show">No-show — cliente não compareceu</option>
        </select></div>
        <div class="field"><label for="cf-note">Motivo / observação</label>
          <textarea id="cf-note" placeholder="Achou o preço acima do orçamento. Vai pensar até sexta."></textarea></div>`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="cf-ok">Encerrar</button>`,
      onMount: (w) => {
        UI.el('#cf-ok', w).onclick = () => {
          E.closeFitting(f.id, UI.val('#cf-state'), UI.val('#cf-note'));
          UI.closeModal(); UI.toast('Prova encerrada', f.code, 'ok'); UI.render();
        };
      }
    });
  });

  /* Conversão: leva as peças aprovadas direto para o fluxo de reserva. */
  UI.ACT.fittingToReservation = (d) => SZ.require('reserva.create', () => {
    const f = db.get('fitting_session', d.id);
    const aprovadas = db.where('fitting_item', i => i.fitting_session_id === f.id)
      .filter(i => (SZ.FIT_OUTCOME[i.outcome] || {}).positive === true)
      .map(i => i.garment_id);
    UI.ACT.newReservation({
      customer: f.customer_id,
      garments: aprovadas.join(','),
      fitting: f.id,
      eventType: f.event_type || '',
      eventDate: f.event_date || ''
    });
  });
})();

  function agruparPermissoes() {
    const nomes = {
      dashboard: 'Painel e agenda', agenda: 'Painel e agenda', cliente: 'Clientes',
      acervo: 'Acervo', prova: 'Provas', reserva: 'Reservas', operacao: 'Operação',
      financeiro: 'Financeiro', inteligencia: 'Inteligência', config: 'Configurações'
    };
    const out = {};
    Object.keys(SZ.PERMISSIONS).forEach(p => {
      const g = nomes[p.split('.')[0]] || 'Outros';
      (out[g] = out[g] || []).push(p);
    });
    return out;
  }

  /* -------------------------------------------------------- AUDITORIA */
  function paneAuditoria() {
    const f = UI.state.audit;
    let rows = db.all('audit_log');
    if (f.entity !== 'todas') rows = rows.filter(a => a.entity === f.entity);
    if (f.action !== 'todas') rows = rows.filter(a => a.action === f.action);
    if (f.user !== 'todos') rows = rows.filter(a => a.user_id === f.user);
    if (f.q) rows = rows.filter(a => SZ.norm(JSON.stringify(a.diff || '') + ' ' + (a.note || '') + ' ' + a.entity).includes(SZ.norm(f.q)));
    rows = SZ.sortBy(rows, a => a.occurred_at, -1);

    const entidades = Array.from(new Set(db.all('audit_log').map(a => a.entity))).sort();
    const acoes = { create: 'criação', update: 'edição', delete: 'exclusão', transition: 'mudança de estado', denied: 'acesso negado' };
    const usuarios = db.all('app_user');

    return `<section class="card">
      <div class="card-h"><h3>Histórico de auditoria</h3>
        <span class="dim tiny">${rows.length} de ${db.all('audit_log').length} registros</span></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:11px">
        <div class="row">
          <div class="field" style="flex:1;min-width:200px">
            <input id="aud-q" placeholder="Buscar por campo, valor ou justificativa…" value="${SZ.esc(f.q)}" aria-label="Buscar na auditoria"></div>
          <div class="field" style="min-width:150px"><select id="aud-ent" aria-label="Entidade">
            <option value="todas">Todas as entidades</option>
            ${entidades.map(e => `<option value="${e}" ${f.entity === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
          <div class="field" style="min-width:150px"><select id="aud-act" aria-label="Ação">
            <option value="todas">Todas as ações</option>
            ${Object.entries(acoes).map(([k, v]) => `<option value="${k}" ${f.action === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div class="field" style="min-width:170px"><select id="aud-user" aria-label="Usuário">
            <option value="todos">Todos os usuários</option>
            ${usuarios.map(u => `<option value="${u.id}" ${f.user === u.id ? 'selected' : ''}>${SZ.esc(u.full_name)}</option>`).join('')}</select></div>
        </div>
      </div>
      <div class="card-b flush">
        ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Quando</th><th>Quem</th><th>Entidade</th><th>Ação</th><th>Alteração / justificativa</th></tr></thead>
          <tbody>${rows.slice(0, 200).map(a => {
            const u = a.user_id ? db.get('app_user', a.user_id) : null;
            const diff = a.diff ? Object.entries(a.diff).slice(0, 4).map(([k, v]) =>
              `<span class="mono">${SZ.esc(k)}</span>: ${SZ.esc(String(v[0] ?? '—')).slice(0, 26)} → <b>${SZ.esc(String(v[1] ?? '—')).slice(0, 26)}</b>`).join('<br>') : '';
            const tone = a.action === 'create' ? 'green' : a.action === 'delete' ? 'red'
              : a.action === 'transition' ? 'indigo' : a.action === 'denied' ? 'amber' : 'stone';
            return `<tr style="cursor:default">
              <td class="mono tiny">${SZ.fdt(a.occurred_at)}</td>
              <td class="tiny">${SZ.esc(u ? u.full_name : 'sistema')}</td>
              <td class="tiny mono">${SZ.esc(a.entity)}</td>
              <td>${SZ.pill(acoes[a.action] || a.action, tone)}</td>
              <td class="tiny">${diff}${diff && a.note ? '<br>' : ''}${a.note ? `<span class="dim">${SZ.esc(a.note)}</span>` : ''}</td>
            </tr>`;
          }).join('')}</tbody></table></div>
          ${rows.length > 200 ? `<div class="tiny dim" style="padding:11px 16px">Mostrando os 200 registros mais recentes. Refine os filtros para ver o resto.</div>` : ''}`
          : UI.empty('Nenhum registro com esses filtros', 'Limpe os filtros para ver o histórico completo.')}
      </div>
    </section>`;
  }

      <div class="field"><label for="us-job">Cargo</label><input id="us-job" value="${SZ.esc(u ? u.job_title || '' : '')}" placeholder="Consultora de atendimento"></div>
      <div class="field"><label for="us-role">Perfil de acesso *</label><select id="us-role">
        ${db.all('role').map(r => `<option value="${r.id}" ${u && u.role_id === r.id ? 'selected' : ''}>${SZ.esc(r.name)}</option>`).join('')}
      </select><span class="hint" id="us-role-hint"></span></div>
      <label class="field row" style="flex-direction:row;gap:8px;align-items:center;padding-top:20px">
        <input type="checkbox" id="us-active" ${!u || u.is_active !== false ? 'checked' : ''} style="width:auto">
        <span>Acesso ativo</span></label>
    </div>
    <div class="note info">${SZ.icon('escudo')}<span>Neste protótipo não há senha: a sessão é escolhida no seletor
      <b>Entrar como</b>. Em produção, o acesso passa a ser Supabase Auth por e-mail, e este mesmo perfil vira
      a política de Row Level Security no banco.</span></div>`;

  const roleHint = (w) => {
    const sel = UI.el('#us-role', w); if (!sel) return;
    const upd = () => {
      const role = db.get('role', sel.value);
      const hint = UI.el('#us-role-hint', w);
      if (hint && role) hint.textContent = SZ.ROLE_SUMMARY[role.key] || '';
    };
    sel.onchange = upd; upd();
  };

  UI.ACT.newUser = () => SZ.require('config.users', () => {
    UI.modal({
      title: 'Novo usuário', sub: 'Defina o perfil — as permissões vêm dele e podem ser ajustadas depois',
      wide: true, body: userForm(null),
      footer: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="us-ok">Cadastrar</button>`,
      onMount: (w) => {
        roleHint(w);
        UI.el('#us-ok', w).onclick = () => {
          const name = UI.val('#us-name'), email = UI.val('#us-email');
          if (!name || name.length < 3) { UI.toast('Informe o nome', '', 'err'); return; }
          if (!email || !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { UI.toast('E-mail inválido', 'O acesso futuro será por e-mail.', 'err'); return; }
          if (db.all('app_user').some(x => (x.email || '').toLowerCase() === email.toLowerCase())) {
            UI.toast('E-mail já cadastrado', 'Cada pessoa tem um acesso.', 'err'); return;
          }
          const u = db.insert('app_user', {
            full_name: name, email, phone: UI.val('#us-phone') || null,
            job_title: UI.val('#us-job') || null, role_id: UI.val('#us-role'),
            is_active: UI.el('#us-active').checked, last_seen_at: null,
            permission_overrides: { granted: [], revoked: [] }
          });
          UI.closeModal();
          UI.toast('Usuário cadastrado', `${u.full_name} · ${(db.get('role', u.role_id) || {}).name}`, 'ok');
          UI.render();
        };
      }
    });
  });

  UI.ACT.editUser = (d) => SZ.require('config.users', () => {
    const u = db.get('app_user', d.id);
    UI.modal({
      title: 'Editar usuário', sub: u.full_name, wide: true, body: userForm(u),
      footer: `<button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn ghost" id="us-reset">${SZ.icon('refresh', 13)} Resetar acesso</button>
        <button class="btn primary" id="us-ok">Salvar</button>`,
      onMount: (w) => {
        roleHint(w);
        UI.el('#us-reset', w).onclick = () => {
          db.update('app_user', u.id, { last_seen_at: null, permission_overrides: { granted: [], revoked: [] } },
            { note: 'Acesso resetado: permissões voltam ao padrão do perfil' });
          UI.closeModal(); UI.toast('Acesso resetado', 'Permissões voltaram ao padrão do perfil.', 'ok'); UI.render();
        };
        UI.el('#us-ok', w).onclick = () => {
          const email = UI.val('#us-email');
          if (email && db.all('app_user').some(x => x.id !== u.id && (x.email || '').toLowerCase() === email.toLowerCase())) {
            UI.toast('E-mail já cadastrado', '', 'err'); return;
          }
          const ativo = UI.el('#us-active').checked;
          if (!ativo && u.id === db.session.user_id) { UI.toast('Não dá para desativar a própria sessão', 'Troque de usuário antes.', 'err'); return; }
          db.update('app_user', u.id, {
            full_name: UI.val('#us-name'), email, phone: UI.val('#us-phone') || null,
            job_title: UI.val('#us-job') || null, role_id: UI.val('#us-role'), is_active: ativo
          }, { note: 'Edição de usuário' });
          UI.closeModal(); UI.toast('Usuário atualizado', UI.val('#us-name'), 'ok'); UI.render();
        };
      }
    });
  });

  UI.ACT.toggleUser = (d) => SZ.require('config.users', () => {
    const u = db.get('app_user', d.id);
    if (u.id === db.session.user_id) { UI.toast('Não dá para desativar a própria sessão', 'Troque de usuário antes.', 'err'); return; }
    const novo = u.is_active === false;
    UI.confirm(novo ? 'Reativar acesso' : 'Desativar acesso',
      novo ? `Reativar o acesso de <b>${SZ.esc(u.full_name)}</b>?`
        : `Desativar o acesso de <b>${SZ.esc(u.full_name)}</b>? O histórico de tudo o que ela fez permanece intacto na auditoria.`,
      novo ? 'Reativar' : 'Desativar', () => {
        db.update('app_user', u.id, { is_active: novo }, { note: novo ? 'Acesso reativado' : 'Acesso desativado' });
        UI.toast(novo ? 'Acesso reativado' : 'Acesso desativado', u.full_name, 'ok');
        UI.render();
      }, !novo);
  });

  /* Permissões individuais — concede ou revoga sobre o padrão do perfil. */
  UI.ACT.permUser = (d) => SZ.require('config.users', () => {
    const u = db.get('app_user', d.id);
    const role = db.get('role', u.role_id);
    const base = (role && SZ.ROLE_PERMISSIONS[role.key]) || [];
    const ov = u.permission_overrides || { granted: [], revoked: [] };
    const grupos = agruparPermissoes();

    UI.modal({
      title: 'Permissões', sub: `${u.full_name} · perfil ${role ? role.name : '—'}`, wide: true,
      body: `
        <div class="note info">${SZ.icon('chave')}<span>O perfil <b>${SZ.esc(role ? role.name : '')}</b> define o padrão.
          Aqui você abre ou fecha exceções para esta pessoa — e a diferença fica marcada na lista da equipe.</span></div>
        ${Object.entries(grupos).map(([grupo, perms]) => `
          <div>
            <div class="eyebrow" style="margin-bottom:7px">${SZ.esc(grupo)}</div>
            <div style="display:flex;flex-direction:column;gap:5px">
              ${perms.map(p => {
                const noPerfil = base.indexOf(p) >= 0;
                const efetiva = SZ.effectivePermissions(u).indexOf(p) >= 0;
                return `<label class="row" style="gap:9px;font-size:12.5px;cursor:pointer;padding:3px 0">
                  <input type="checkbox" class="pm-chk" data-p="${p}" ${efetiva ? 'checked' : ''} style="width:auto">
                  <span>${SZ.esc(SZ.PERMISSIONS[p])}</span>
                  <span class="tiny dim mono" style="margin-left:auto">${p}</span>
                  ${noPerfil ? '<span class="pill plain" style="font-size:9.5px;padding:1px 6px">padrão do perfil</span>' : ''}
                </label>`;
              }).join('')}
            </div>
          </div>`).join('')}`,
      footer: `<button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn ghost" id="pm-reset">Voltar ao padrão do perfil</button>
        <button class="btn primary" id="pm-ok">Salvar permissões</button>`,
      onMount: (w) => {
        UI.el('#pm-reset', w).onclick = () => {
          db.update('app_user', u.id, { permission_overrides: { granted: [], revoked: [] } },
            { note: 'Permissões voltaram ao padrão do perfil' });
          UI.closeModal(); UI.toast('Permissões redefinidas', `${u.full_name} voltou ao padrão de ${role ? role.name : ''}.`, 'ok'); UI.render();
        };
        UI.el('#pm-ok', w).onclick = () => {
          const granted = [], revoked = [];
          UI.els('.pm-chk', w).forEach(cb => {
            const p = cb.dataset.p, noPerfil = base.indexOf(p) >= 0;
            if (cb.checked && !noPerfil) granted.push(p);
            if (!cb.checked && noPerfil) revoked.push(p);
          });
          db.update('app_user', u.id, { permission_overrides: { granted, revoked } },
            { note: `Permissões ajustadas: +${granted.length} / −${revoked.length}` });
          UI.closeModal();
          UI.toast('Permissões salvas',
            granted.length || revoked.length ? `${granted.length} extra(s), ${revoked.length} revogada(s).` : 'Padrão do perfil mantido.', 'ok');
          UI.render();
        };
      }
    });
  });

  UI.ACT.resetDemo = () => SZ.require('config.data', () => {
    UI.confirm('Regenerar dados de demonstração',
      'Toda a base atual será apagada e recriada do zero, incluindo reservas, clientes, provas e peças criados nesta sessão. Não há como desfazer.',
      'Regenerar', () => {
        db.reset(); SZ.seed(); SZ.E.reconcile();
        UI.toast('Base recriada', 'O sistema voltou ao estado inicial de demonstração.', 'ok');
        UI.go('#/'); UI.render();
      }, true);
  });

  UI.ACT.exportData = () => SZ.require('config.data', () => {
    const txt = JSON.stringify(db.data, null, 2);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
      () => UI.toast('Base copiada', `${(txt.length / 1024).toFixed(0)} KB no seu clipboard, em JSON.`, 'ok'),
      () => UI.toast('Não foi possível copiar', 'A base é grande demais para o clipboard deste navegador.', 'err'));
  });

  /* filtros da auditoria */
  document.addEventListener('change', (e) => {
    if (e.target.id === 'aud-ent') { UI.state.audit.entity = e.target.value; UI.render(); }
    if (e.target.id === 'aud-act') { UI.state.audit.action = e.target.value; UI.render(); }
    if (e.target.id === 'aud-user') { UI.state.audit.user = e.target.value; UI.render(); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'aud-q') return;
    clearTimeout(UI.state._audT);
    const v = e.target.value;
    UI.state._audT = setTimeout(() => {
      UI.state.audit.q = v; UI.render();
      const n = UI.el('#aud-q'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
    }, 280);
  });
})();


/* ═══════════ 11-boot.js ═══════════ */
/* =====================================================================
   SENZIE OS — 11 · Inicialização
   ===================================================================== */
(function boot() {
  try {
    const t = localStorage.getItem('senzie_theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) { /* storage indisponível — segue no tema do sistema */ }

  const precisaSemear = SZ.db.load();
  if (precisaSemear) {
    SZ.seed();
  }

  if (!SZ.db.session.user_id) {
    const admin = SZ.db.all('app_user').find(u => {
      const r = SZ.db.get('role', u.role_id);
      return r && r.key === 'admin';
    }) || SZ.db.all('app_user')[0];
    if (admin) SZ.db.session.user_id = admin.id;
  }

  // Pré-reservas vencidas caem sozinhas; estados derivados são reconciliados
  // com o calendário — o sistema nunca depende de um cron para estar correto.
  SZ.E.expireHolds();
  SZ.E.reconcile();

  if (!location.hash) location.hash = '#/';
  SZ.UI.render();
})();

</script>
</body>
</html>
