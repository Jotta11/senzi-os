<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Senzie OS v0.2 — sistema operacional e CRM da Senzie Club. Protótipo funcional, arquivo único.">
<meta name="color-scheme" content="light dark">
<title>Senzie OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html { color-scheme: light dark; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* =====================================================================
   SENZIE OS — Design System provisório v0.2
   Princípio: a interface é quase monocromática. A única cor forte da tela
   vem das PEÇAS. O acervo é o que colore o sistema.
   Substituível: todo o sistema vive nos tokens abaixo. Trocar a marca =
   trocar este bloco :root.
   ===================================================================== */

:root {
  /* — neutros frios (viés lilás, deliberado: não é cinza de ERP) — */
  --ground:      #F1F0F3;
  --surface:     #FFFFFF;
  --surface-2:   #F7F6F9;
  --surface-3:   #ECEAF0;
  --ink:         #1A181D;
  --ink-2:       #56525F;
  --ink-3:       #8B8794;
  --line:        #E4E2E8;
  --line-2:      #D4D1DA;

  /* — acento Senzie (vinho) — usado com parcimônia — */
  --accent:      #7A2E43;
  --accent-hover:#632337;
  --accent-text: #7A2E43;
  --on-accent:   #FFFFFF;
  --accent-soft: #F7EAEE;
  --accent-line: #E4C9D2;

  /* — tons de estado operacional — */
  --t-green:  #2E6B45;  --t-green-bg:  #E6F0E9;  --t-green-line:  #C3DCCC;
  --t-wine:   #8A2F49;  --t-wine-bg:   #F7E9ED;  --t-wine-line:   #E6C8D1;
  --t-amber:  #8A5A0B;  --t-amber-bg:  #FAF0DC;  --t-amber-line:  #E9D3A6;
  --t-indigo: #3A4C97;  --t-indigo-bg: #E9ECF8;  --t-indigo-line: #C9D0EC;
  --t-teal:   #14656F;  --t-teal-bg:   #E1F0F1;  --t-teal-line:   #BCDCDF;
  --t-ochre:  #7A5320;  --t-ochre-bg:  #F5EDDF;  --t-ochre-line:  #E0CFAE;
  --t-stone:  #5E5A67;  --t-stone-bg:  #EDECF0;  --t-stone-line:  #D8D5DE;
  --t-red:    #A32A24;  --t-red-bg:    #FBE9E7;  --t-red-line:    #EFC9C5;

  /* — série categórica validada (light, ΔE CVD ok) — */
  --cat-1: #A63352; --cat-2: #0079A8; --cat-3: #C0821F;
  --cat-4: #4A5BD1; --cat-5: #3D8E58; --cat-6: #9148B8;
  --chart-grid: #E9E7ED;
  --chart-fill: rgba(122,46,67,.10);

  --shadow-1: 0 1px 2px rgba(26,24,29,.05), 0 1px 1px rgba(26,24,29,.03);
  --shadow-2: 0 4px 16px rgba(26,24,29,.08), 0 1px 2px rgba(26,24,29,.05);
  --shadow-3: 0 24px 64px rgba(26,24,29,.18), 0 2px 8px rgba(26,24,29,.10);

  --r-sm: 4px; --r-md: 7px; --r-lg: 12px; --r-xl: 18px;
  --rail: 236px;

  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-ui: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:    #121116;
    --surface:   #1B1A20;
    --surface-2: #232128;
    --surface-3: #2B2933;
    --ink:       #F2F0F5;
    --ink-2:     #A8A3B2;
    --ink-3:     #7B7686;
    --line:      #2E2C36;
    --line-2:    #3C3945;

    --accent:      #B8455F;
    --accent-hover:#CB5470;
    --accent-text: #E793A7;
    --on-accent:   #FFFFFF;
    --accent-soft: #2B1B22;
    --accent-line: #4A2C38;

    --t-green:  #7FC095;  --t-green-bg:  #17291E;  --t-green-line:  #27452F;
    --t-wine:   #E091A6;  --t-wine-bg:   #2B1A20;  --t-wine-line:   #472B34;
    --t-amber:  #DDAE5C;  --t-amber-bg:  #2A2113;  --t-amber-line:  #443620;
    --t-indigo: #97A4E8;  --t-indigo-bg: #1A1D30;  --t-indigo-line: #2E3454;
    --t-teal:   #6FC2CC;  --t-teal-bg:   #142729;  --t-teal-line:   #234145;
    --t-ochre:  #D0AE72;  --t-ochre-bg:  #262015;  --t-ochre-line:  #413623;
    --t-stone:  #A5A0AE;  --t-stone-bg:  #232128;  --t-stone-line:  #37343F;
    --t-red:    #E8877F;  --t-red-bg:    #2C1917;  --t-red-line:    #4A2A27;

    --cat-1: #C4506C; --cat-2: #2790C2; --cat-3: #BC8126;
    --cat-4: #6B79E0; --cat-5: #4D9E66; --cat-6: #A55FC9;
    --chart-grid: #2A2833;
    --chart-fill: rgba(184,69,95,.16);

    --shadow-1: 0 1px 2px rgba(0,0,0,.35);
    --shadow-2: 0 4px 16px rgba(0,0,0,.40);
    --shadow-3: 0 24px 64px rgba(0,0,0,.60);
  }
}

:root[data-theme="dark"] {
  --ground:    #121116;
  --surface:   #1B1A20;
  --surface-2: #232128;
  --surface-3: #2B2933;
  --ink:       #F2F0F5;
  --ink-2:     #A8A3B2;
  --ink-3:     #7B7686;
  --line:      #2E2C36;
  --line-2:    #3C3945;

  --accent:      #B8455F;
  --accent-hover:#CB5470;
  --accent-text: #E793A7;
  --on-accent:   #FFFFFF;
  --accent-soft: #2B1B22;
  --accent-line: #4A2C38;

  --t-green:  #7FC095;  --t-green-bg:  #17291E;  --t-green-line:  #27452F;
  --t-wine:   #E091A6;  --t-wine-bg:   #2B1A20;  --t-wine-line:   #472B34;
  --t-amber:  #DDAE5C;  --t-amber-bg:  #2A2113;  --t-amber-line:  #443620;
  --t-indigo: #97A4E8;  --t-indigo-bg: #1A1D30;  --t-indigo-line: #2E3454;
  --t-teal:   #6FC2CC;  --t-teal-bg:   #142729;  --t-teal-line:   #234145;
  --t-ochre:  #D0AE72;  --t-ochre-bg:  #262015;  --t-ochre-line:  #413623;
  --t-stone:  #A5A0AE;  --t-stone-bg:  #232128;  --t-stone-line:  #37343F;
  --t-red:    #E8877F;  --t-red-bg:    #2C1917;  --t-red-line:    #4A2A27;

  --cat-1: #C4506C; --cat-2: #2790C2; --cat-3: #BC8126;
  --cat-4: #6B79E0; --cat-5: #4D9E66; --cat-6: #A55FC9;
  --chart-grid: #2A2833;
  --chart-fill: rgba(184,69,95,.16);

  --shadow-1: 0 1px 2px rgba(0,0,0,.35);
  --shadow-2: 0 4px 16px rgba(0,0,0,.40);
  --shadow-3: 0 24px 64px rgba(0,0,0,.60);
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -.012em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
[hidden] { display: none !important; }
img { max-width: 100%; }
::selection { background: var(--accent-soft); color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ------------------------------------------------------------ tipografia */
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}
.muted { color: var(--ink-2); }
.dim   { color: var(--ink-3); }
.tiny  { font-size: 12px; }

/* ---------------------------------------------------------------- shell */
.app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { padding: 22px 20px 16px; display: flex; align-items: baseline; gap: 8px; }
.brand .mark {
  font-family: var(--f-display); font-size: 25px; line-height: 1;
  letter-spacing: .02em; color: var(--ink);
}
.brand .os {
  font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
  color: var(--on-accent); background: var(--accent);
  padding: 3px 5px; border-radius: 3px;
}
.rail-search {
  margin: 0 14px 14px; display: flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 7px 9px; cursor: pointer;
  color: var(--ink-3); font-size: 13px; text-align: left; width: calc(100% - 28px);
  transition: border-color .12s, background .12s;
}
.rail-search:hover { border-color: var(--line-2); background: var(--surface); }
.rail-search kbd {
  margin-left: auto; font-family: var(--f-mono); font-size: 10px;
  border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px; color: var(--ink-3);
}
.nav { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-md);
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  transition: background .12s, color .12s;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav a.on svg { color: var(--accent-text); }
.nav svg { width: 16px; height: 16px; flex: none; color: var(--ink-3); }
.nav .count {
  margin-left: auto; font-size: 11px; font-weight: 600;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.nav a.on .count { color: var(--accent-text); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 12px; }
.rail-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--line); }
.whoami { display: flex; align-items: center; gap: 9px; }
.whoami .av {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--accent-soft); color: var(--accent-text);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  border: 1px solid var(--accent-line);
}
.whoami .who { min-width: 0; }
.whoami .who b { display: block; font-size: 12.5px; font-weight: 600; }
.whoami .who span { display: block; font-size: 11px; color: var(--ink-3); }
.icon-btn {
  background: none; border: 1px solid transparent; cursor: pointer;
  color: var(--ink-3); border-radius: var(--r-sm); padding: 5px;
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 32px 0;
}
.topbar h1 { font-size: 21px; }
.topbar .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.topbar .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) { .topbar .actions { margin-left: 0; width: 100%; } }
.view { padding: 18px 32px 56px; display: flex; flex-direction: column; gap: 18px; }

/* --------------------------------------------------------------- botões */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 7px 13px; border-radius: var(--r-md); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 550;
  cursor: pointer; transition: background .12s, border-color .12s, transform .06s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(.5px); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--t-red); border-color: var(--t-red-line); background: var(--t-red-bg); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------------------------------------------------------------- cards */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.card-h {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.card-h h3 { font-size: 14px; }
.card-h .actions { margin-left: auto; display: flex; gap: 6px; }
.card-b { padding: 16px; }
.card-b.flush { padding: 0; }

.grid { display: grid; gap: 14px; align-items: start; }
/* sem isto, uma tabela larga estica a própria coluna do grid em vez de rolar */
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-wide { grid-template-columns: 1.35fr 1fr; }
.g-days { grid-template-columns: repeat(auto-fit, minmax(146px, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; }

/* ----------------------------------------------------- tiles de métrica */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; box-shadow: var(--shadow-1); }
.tile { padding: 14px 16px; border-right: 1px solid var(--line); }
.tile:last-child { border-right: none; }
.tile .k { font-size: 11px; color: var(--ink-3); font-weight: 500; display:flex; gap:5px; align-items:center; }
.tile .v { font-family: var(--f-display); font-size: 30px; line-height: 1.1; margin-top: 4px;
  font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--ink-3); }
.tile .d { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.tile.alert .v { color: var(--t-red); }
.tile.alert .k { color: var(--t-red); }

/* ----------------------------------------------------------- pills/tons */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2.5px 8px 2.5px 6px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; line-height: 1.35; white-space: nowrap;
  border: 1px solid transparent;
}
.pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.pill.green  { color: var(--t-green);  background: var(--t-green-bg);  border-color: var(--t-green-line); }
.pill.wine   { color: var(--t-wine);   background: var(--t-wine-bg);   border-color: var(--t-wine-line); }
.pill.amber  { color: var(--t-amber);  background: var(--t-amber-bg);  border-color: var(--t-amber-line); }
.pill.indigo { color: var(--t-indigo); background: var(--t-indigo-bg); border-color: var(--t-indigo-line); }
.pill.teal   { color: var(--t-teal);   background: var(--t-teal-bg);   border-color: var(--t-teal-line); }
.pill.ochre  { color: var(--t-ochre);  background: var(--t-ochre-bg);  border-color: var(--t-ochre-line); }
.pill.stone  { color: var(--t-stone);  background: var(--t-stone-bg);  border-color: var(--t-stone-line); }
.pill.red    { color: var(--t-red);    background: var(--t-red-bg);    border-color: var(--t-red-line); }
.pill.plain  { color: var(--ink-2); background: var(--surface-2); border-color: var(--line); font-weight: 500; }

/* --------------------------------------------------------------- tabela */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); padding: 9px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
  position: sticky; top: 0; z-index: 1; white-space: nowrap;
}
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; transition: background .1s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
.tbl .lead { font-weight: 600; }

/* ------------------------------------------------------------ silhuetas */
.silo { display: block; width: 100%; height: auto; border-radius: var(--r-md); }
.silo-wrap { position: relative; background: var(--surface-2); border-radius: var(--r-md); overflow: hidden; }

.gcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow-1);
  transition: box-shadow .14s, transform .14s, border-color .14s;
  display: flex; flex-direction: column;
}
.gcard:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); border-color: var(--line-2); }
.gcard .ph { aspect-ratio: 3/4; position: relative; overflow: hidden; }
.gcard .ph svg { width: 100%; height: 100%; display: block; }
.gcard .ph .badge { position: absolute; left: 8px; top: 8px; }
.gcard .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.gcard .meta .code { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; }
.gcard .meta .nm { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.gcard .meta .ln { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.gcard .meta .pr { font-size: 13px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px,1fr)); gap: 14px; }

/* ------------------------------------------------------------ calendário */
.cal { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal .dow { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); text-align: center; padding-bottom: 4px; }
.cal .d {
  aspect-ratio: 1/.82; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--surface); padding: 4px 5px; font-size: 11px;
  display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden;
}
.cal .d.pad { background: transparent; border-color: transparent; }
.cal .d .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); font-size: 11px; }
.cal .d.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal .d.today .n { color: var(--accent-text); }
.cal .d .tag { font-size: 9px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  border-radius: 2px; padding: 1px 3px; line-height: 1.35; }
.cal .d[data-tone="green"]  { background: var(--t-green-bg);  border-color: var(--t-green-line); }
.cal .d[data-tone="wine"]   { background: var(--t-wine-bg);   border-color: var(--t-wine-line); }
.cal .d[data-tone="amber"]  { background: var(--t-amber-bg);  border-color: var(--t-amber-line); }
.cal .d[data-tone="indigo"] { background: var(--t-indigo-bg); border-color: var(--t-indigo-line); }
.cal .d[data-tone="teal"]   { background: var(--t-teal-bg);   border-color: var(--t-teal-line); }
.cal .d[data-tone="ochre"]  { background: var(--t-ochre-bg);  border-color: var(--t-ochre-line); }
.cal .d[data-tone="stone"]  { background: var(--t-stone-bg);  border-color: var(--t-stone-line); }
.cal .d[data-tone="red"]    { background: var(--t-red-bg);    border-color: var(--t-red-line); }
.cal .d[data-tone="green"]  .tag { color: var(--t-green); }
.cal .d[data-tone="wine"]   .tag { color: var(--t-wine); }
.cal .d[data-tone="amber"]  .tag { color: var(--t-amber); }
.cal .d[data-tone="indigo"] .tag { color: var(--t-indigo); }
.cal .d[data-tone="teal"]   .tag { color: var(--t-teal); }
.cal .d[data-tone="ochre"]  .tag { color: var(--t-ochre); }
.cal .d[data-tone="stone"]  .tag { color: var(--t-stone); }
.cal .d[data-tone="red"]    .tag { color: var(--t-red); }

/* faixa temporal horizontal (linha do tempo da peça) */
.strip { display: flex; gap: 2px; align-items: stretch; }
.strip .s { flex: 1; height: 30px; border-radius: 2px; background: var(--surface-3);
  position: relative; min-width: 5px; }
.strip .s[data-tone="green"]  { background: var(--t-green-line); }
.strip .s[data-tone="wine"]   { background: var(--t-wine-line); }
.strip .s[data-tone="amber"]  { background: var(--t-amber-line); }
.strip .s[data-tone="indigo"] { background: var(--t-indigo-line); }
.strip .s[data-tone="teal"]   { background: var(--t-teal-line); }
.strip .s[data-tone="ochre"]  { background: var(--t-ochre-line); }
.strip .s[data-tone="stone"]  { background: var(--t-stone-line); }
.strip .s[data-tone="red"]    { background: var(--t-red-line); }

/* -------------------------------------------------------------- agenda */
.agenda { display: flex; flex-direction: column; }
.ag-item {
  display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: center;
  padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.ag-item:last-child { border-bottom: none; }
.ag-item:hover { background: var(--surface-2); }
.ag-item .hh { font-family: var(--f-mono); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.ag-item .ttl { font-size: 13.5px; font-weight: 550; display: block; }
.ag-item .sub2 { font-size: 11.5px; color: var(--ink-3); display: block; }
/* inputs soltos dentro de linhas de conferência (retirada, devolução) */
.item-note { width: 100%; background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); padding: 5px 8px; font-size: 12px; }
.item-note:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ag-item.done .ttl, .ag-item.done .hh { color: var(--ink-3); text-decoration: line-through; }

/* ------------------------------------------------------------- timeline */
.tline { display: flex; flex-direction: column; }
.tline .ev { display: grid; grid-template-columns: 86px 16px 1fr; gap: 10px; align-items: start; }
.tline .ev .dt { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); padding-top: 9px; }
.tline .ev .ln { position: relative; display: flex; justify-content: center; }
.tline .ev .ln::before { content: ""; position: absolute; top: 0; bottom: -0px; width: 1px; background: var(--line); }
.tline .ev:first-child .ln::before { top: 12px; }
.tline .ev:last-child .ln::before { bottom: auto; height: 12px; }
.tline .ev .ln i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2);
  margin-top: 11px; z-index: 1; border: 2px solid var(--surface); box-sizing: content-box; }
.tline .ev .bd { padding: 7px 0 9px; font-size: 13px; }
.tline .ev .bd .t2 { font-weight: 550; }
.tline .ev .bd .n2 { font-size: 12px; color: var(--ink-3); }

/* ----------------------------------------------------------------- abas */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  background: none; border: none; cursor: pointer; padding: 9px 12px;
  font-size: 13px; font-weight: 550; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

/* ------------------------------------------------------------ formulário */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md);
  padding: 7px 9px; font-size: 13px; width: 100%; transition: border-color .12s, box-shadow .12s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { resize: vertical; min-height: 62px; line-height: 1.45; }
.field .hint { font-size: 11px; color: var(--ink-3); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.fgrid.g3c { grid-template-columns: repeat(3, minmax(0,1fr)); }
.fgrid .full { grid-column: 1 / -1; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 3.5px 10px; font-size: 12px; cursor: pointer;
  transition: all .12s;
}
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); font-weight: 600; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 2px; gap: 2px; }
.seg button { background: none; border: none; cursor: pointer; padding: 4px 11px;
  font-size: 12.5px; font-weight: 550; color: var(--ink-3); border-radius: 5px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------------------------------------------------------------- modal */
.scrim {
  position: fixed; inset: 0; background: rgba(20,18,24,.42);
  backdrop-filter: blur(3px); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
  animation: fade .14s ease-out;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
  box-shadow: var(--shadow-3); width: 100%; max-width: 620px;
  animation: rise .18s cubic-bezier(.2,.8,.3,1);
}
.modal.wide { max-width: 880px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99) } to { opacity: 1; transform: none } }
.modal-h { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.modal-h h2 { font-size: 17px; }
.modal-h .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.modal-b { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 68vh; overflow-y: auto; }
.modal-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end;
  background: var(--surface-2); border-radius: 0 0 var(--r-xl) var(--r-xl); flex-wrap: wrap; }
.modal-f .left { margin-right: auto; }

/* --------------------------------------------------------------- alerta */
.note {
  border-radius: var(--r-md); padding: 10px 12px; font-size: 12.5px;
  display: flex; gap: 9px; align-items: flex-start; line-height: 1.45;
  border: 1px solid;
}
.note svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.note.red   { color: var(--t-red);   background: var(--t-red-bg);   border-color: var(--t-red-line); }
.note.amber { color: var(--t-amber); background: var(--t-amber-bg); border-color: var(--t-amber-line); }
.note.green { color: var(--t-green); background: var(--t-green-bg); border-color: var(--t-green-line); }
.note.info  { color: var(--ink-2);   background: var(--surface-2);  border-color: var(--line); }
.note b { font-weight: 650; }

/* ---------------------------------------------------------------- busca */
.pal { max-width: 600px; margin-top: 6vh; }
.pal input {
  width: 100%; border: none; background: none; padding: 17px 20px;
  font-size: 16px; outline: none;
}
.pal .results { max-height: 56vh; overflow-y: auto; border-top: 1px solid var(--line); }
.pal .res {
  display: flex; align-items: center; gap: 11px; padding: 9px 18px; cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.pal .res:last-child { border-bottom: none; }
.pal .res.sel, .pal .res:hover { background: var(--accent-soft); }
.pal .res .tp { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); width: 62px; flex: none; }
.pal .res .t1 { font-size: 13.5px; font-weight: 550; }
.pal .res .t2 { font-size: 11.5px; color: var(--ink-3); }
.pal .empty { padding: 26px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* --------------------------------------------------------------- toasts */
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 10px 14px;
  font-size: 13px; max-width: 380px; animation: rise .18s cubic-bezier(.2,.8,.3,1);
}
.toast.ok  { border-left-color: var(--t-green); }
.toast.err { border-left-color: var(--t-red); }
.toast b { display: block; font-weight: 600; }
.toast span { color: var(--ink-2); font-size: 12px; }

/* --------------------------------------------------------------- perfil */
.profile { display: grid; grid-template-columns: 296px 1fr; gap: 18px; align-items: start; }
.side { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 5px 10px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; }
.avatar-lg {
  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-size: 22px; background: var(--accent-soft);
  color: var(--accent-text); border: 1px solid var(--accent-line); flex: none;
}

/* -------------------------------------------------------------- gráficos */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--f-ui); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-2); }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
.bar-row { display: grid; grid-template-columns: 1fr 52px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .track { height: 100%; }
.bar-line { display: flex; flex-direction: column; gap: 3px; }
.bar-line .lb { display: flex; justify-content: space-between; gap: 8px; }
.bar-line .tr { height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar-line .fl { height: 100%; border-radius: 999px; background: var(--accent); }

.empty-state { padding: 44px 20px; text-align: center; color: var(--ink-3); }
.empty-state .t { font-family: var(--f-display); font-size: 19px; color: var(--ink-2); }
.empty-state .d { font-size: 13px; margin-top: 4px; }

.insight {
  display: flex; gap: 11px; padding: 13px 15px; border-bottom: 1px solid var(--line); align-items: flex-start;
}
.insight:last-child { border-bottom: none; }
.insight .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.insight .ic svg { width: 14px; height: 14px; }
.insight .tx { font-size: 13px; line-height: 1.45; }
.insight .tx b { font-weight: 650; }
.insight .tx .why { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

hr.sep { border: none; border-top: 1px solid var(--line); margin: 0; }

/* --------------------------------------------------------- responsivo */
@media (max-width: 1080px) {
  .profile { grid-template-columns: 1fr; }
  .side { position: static; }
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: sticky; top: 0; height: auto; z-index: 50;
    border-right: none; border-bottom: 1px solid var(--line);
    flex-direction: row; align-items: center; gap: 10px; padding: 8px 16px; overflow: visible;
  }
  .brand { padding: 0; }
  .rail-search { margin: 0; width: auto; flex: 1; }
  .rail-search kbd { display: none; }
  .nav { flex-direction: row; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--surface); border-top: 1px solid var(--line); padding: 5px 4px;
    overflow-x: auto; gap: 2px; }
  .nav a { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 9px; flex: none; }
  .nav a .count, .nav-sep { display: none; }
  .rail-foot { margin: 0; padding: 0; border: none; }
  .whoami .who { display: none; }
  .topbar, .view { padding-left: 16px; padding-right: 16px; }
  .view { padding-bottom: 76px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .grid.g-wide { grid-template-columns: 1fr; }
  .fgrid, .fgrid.g3c { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2,1fr); }
  .tile { border-bottom: 1px solid var(--line); }
  .modal-b { max-height: none; }
  .scrim { padding: 12px; align-items: flex-start; }
}
@media (max-width: 460px) {
  .gallery { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .topbar h1 { font-size: 18px; }
  .tile .v { font-size: 25px; }
}

</style>

<body>

<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main" id="main"></div>
</div>

<noscript>
  <div style="padding:40px;font-family:system-ui;max-width:600px;margin:0 auto">
    <h1>Senzie OS</h1>
    <p>Este sistema precisa de JavaScript habilitado para funcionar.</p>
  </div>
</noscript>

<script>
/* ═══════════ 01-core.js ═══════════ */
/* =====================================================================
   SENZIE OS — 01 · Núcleo
   Utilitários, camada de dados e geração de mídia da peça.

   CAMADA DE DADOS
   ---------------
   As "tabelas" abaixo espelham 1:1 os nomes de tabela e de coluna do
   schema.sql (PostgreSQL/Supabase). Nada aqui usa nome diferente do banco
   futuro. A troca de `Store.persist()` por chamadas ao Supabase é uma
   substituição de adaptador, não uma reescrita.
   ===================================================================== */

const SZ = {};
window.SZ = SZ;

/* ------------------------------------------------------------ básicos */
SZ.uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

SZ.esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

SZ.brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
SZ.brl0 = (n) => 'R$ ' + Math.round(Number(n) || 0).toLocaleString('pt-BR');
SZ.num = (n, d = 0) => (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
SZ.pct = (n, d = 0) => SZ.num(n * 100, d) + '%';

/* --------------------------------------------------------------- datas
   Datas de negócio são strings 'YYYY-MM-DD' e SEMPRE inclusivas nas duas
   pontas. (No Postgres o mesmo intervalo é um daterange '[]'.) Nenhum
   cálculo usa objeto Date com fuso — evita o clássico bug de "um dia a
   menos" em UTC-3.                                                      */
SZ.ISO = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), a = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${a}`;
};
SZ.today = () => SZ.ISO(new Date());
SZ.nowISO = () => new Date().toISOString();
SZ.parse = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
SZ.addDays = (s, n) => { const d = SZ.parse(s); d.setDate(d.getDate() + n); return SZ.ISO(d); };
SZ.diffDays = (a, b) => Math.round((SZ.parse(b) - SZ.parse(a)) / 86400000);
SZ.overlaps = (a1, a2, b1, b2) => a1 <= b2 && b1 <= a2;      // inclusivo
SZ.dow = (s) => SZ.parse(s).getDay();

const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
SZ.MES = MES; SZ.MESL = MESL; SZ.DIAS = DIAS;

SZ.fd = (s) => { if (!s) return '—'; const d = SZ.parse(s); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
SZ.fdy = (s) => { if (!s) return '—'; const d = SZ.parse(s); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
SZ.fdlong = (s) => { if (!s) return '—'; const d = SZ.parse(s); return `${d.getDate()} de ${MESL[d.getMonth()]}`; };
SZ.fdweek = (s) => { if (!s) return '—'; const d = SZ.parse(s); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESL[d.getMonth()]}`; };
SZ.ftime = (iso) => { if (!iso) return ''; const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
SZ.fdt = (iso) => { if (!iso) return '—'; const d = new Date(iso); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${SZ.ftime(iso)}`; };
SZ.rel = (s) => {
  const n = SZ.diffDays(SZ.today(), s);
  if (n === 0) return 'hoje'; if (n === 1) return 'amanhã'; if (n === -1) return 'ontem';
  return n > 0 ? `em ${n} dias` : `há ${-n} dias`;
};
/* Normaliza para busca: minúsculas sem acento. O intervalo de combining
   marks é construído em runtime para manter o arquivo-fonte em ASCII. */
const _DIACRITICS = new RegExp('[' + String.fromCharCode(768) + '-' + String.fromCharCode(879) + ']', 'g');
SZ.norm = (s) => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(_DIACRITICS, '');

SZ.initials = (name) => String(name || '?').trim().split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁ-Ú]/.test(w))
  .slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

/* ------------------------------------------------------------- domínio */
SZ.GARMENT_STATE = {
  disponivel:           { label: 'Disponível',            tone: 'green',  short: 'Livre' },
  pre_reservado:        { label: 'Pré-reservado',         tone: 'amber',  short: 'Pré' },
  reservado:            { label: 'Reservado',             tone: 'wine',   short: 'Reserv.' },
  retirado:             { label: 'Retirado',              tone: 'indigo', short: 'Retir.' },
  em_uso:               { label: 'Em uso',                tone: 'indigo', short: 'Em uso' },
  aguardando_devolucao: { label: 'Aguardando devolução',  tone: 'amber',  short: 'Aguard.' },
  higienizacao:         { label: 'Higienização',          tone: 'teal',   short: 'Higien.' },
  inspecao:             { label: 'Inspeção',              tone: 'teal',   short: 'Inspeç.' },
  ajuste:               { label: 'Ajuste',                tone: 'ochre',  short: 'Ajuste' },
  manutencao:           { label: 'Manutenção',            tone: 'ochre',  short: 'Manut.' },
  bloqueado:            { label: 'Bloqueado',             tone: 'stone',  short: 'Bloq.' },
  baixado:              { label: 'Baixado do acervo',     tone: 'stone',  short: 'Baixa' }
};

SZ.RESERVATION_STATE = {
  atendimento:          { label: 'Atendimento',           tone: 'stone' },
  prova_agendada:       { label: 'Prova agendada',        tone: 'indigo' },
  pre_reserva:          { label: 'Pré-reserva',           tone: 'amber' },
  aguardando_pagamento: { label: 'Aguardando pagamento',  tone: 'amber' },
  confirmada:           { label: 'Confirmada',            tone: 'wine' },
  pronta_retirada:      { label: 'Pronta para retirada',  tone: 'wine' },
  retirada:             { label: 'Retirada',              tone: 'indigo' },
  em_uso:               { label: 'Em uso',                tone: 'indigo' },
  aguardando_devolucao: { label: 'Aguardando devolução',  tone: 'amber' },
  devolvida:            { label: 'Devolvida',             tone: 'teal' },
  em_inspecao:          { label: 'Em inspeção',           tone: 'teal' },
  finalizada:           { label: 'Finalizada',            tone: 'green' },
  cancelada:            { label: 'Cancelada',             tone: 'stone' },
  no_show:              { label: 'No-show',               tone: 'red' }
};

SZ.BLOCK_KIND = {
  pre_reserva:     { label: 'Pré-reserva',   tone: 'amber',  tag: 'PRÉ' },
  locacao:         { label: 'Locação',       tone: 'wine',   tag: 'LOC' },
  higienizacao:    { label: 'Higienização',  tone: 'teal',   tag: 'HIG' },
  inspecao:        { label: 'Inspeção',      tone: 'teal',   tag: 'INSP' },
  ajuste:          { label: 'Ajuste',        tone: 'ochre',  tag: 'AJU' },
  manutencao:      { label: 'Manutenção',    tone: 'ochre',  tag: 'MAN' },
  bloqueio_manual: { label: 'Bloqueio',      tone: 'stone',  tag: 'BLQ' },
  editorial:       { label: 'Editorial',     tone: 'indigo', tag: 'EDIT' }
};

/* ======================================================================
   STORE — persistência
   Único ponto de gravação do sistema. Toda escrita passa por aqui e toda
   escrita gera audit_log. Trocar por Supabase = reescrever só este objeto.
   ====================================================================== */
const KEY = 'senzie_os_db_v2';
/* v0.2 · a versão do schema muda quando entram tabelas ou colunas novas.
   Base antiga é descartada e re-semeada em vez de carregar meio-quebrada. */
const SCHEMA_VERSION = 2;

SZ.TABLES = [
  'role', 'app_user', 'customer', 'customer_measurement', 'customer_preference',
  'customer_interaction', 'garment_category', 'brand', 'supplier', 'garment',
  'garment_measurement', 'garment_photo', 'reservation', 'reservation_item',
  'garment_calendar_block', 'contract_template', 'contract', 'payment', 'expense',
  'inspection_checklist_item', 'garment_inspection', 'garment_maintenance',
  'garment_state_history', 'reservation_state_history', 'appointment',
  'notification', 'setting', 'audit_log',
  // v0.2
  'fitting_session', 'fitting_item', 'customer_favorite', 'exception_authorization'
];

const Store = {
  data: null,
  session: { user_id: null },

  blank() {
    const d = { _v: SCHEMA_VERSION, _seeded_at: SZ.today() };
    SZ.TABLES.forEach(t => d[t] = []);
    return d;
  },

  load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* storage bloqueado */ }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed._v === SCHEMA_VERSION) { this.data = parsed; return false; }
      } catch (e) { /* corrompido → re-semeia */ }
    }
    this.data = this.blank();
    return true;   // precisa semear
  },

  persist() {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); }
    catch (e) { /* modo privado / cota — o sistema segue em memória */ }
  },

  reset() { try { localStorage.removeItem(KEY); } catch (e) {} this.data = this.blank(); },

  all(t) { return this.data[t] || []; },
  get(t, id) { return (this.data[t] || []).find(r => r.id === id) || null; },
  where(t, fn) { return (this.data[t] || []).filter(fn); },
  first(t, fn) { return (this.data[t] || []).find(fn) || null; },

  insert(t, row, opts = {}) {
    const r = Object.assign({ id: SZ.uid(t.slice(0, 3)), created_at: SZ.nowISO() }, row);
    (this.data[t] = this.data[t] || []).push(r);
    if (!opts.silent) this.audit(t, r.id, 'create', null, r);
    if (!opts.batch) this.persist();
    return r;
  },

  update(t, id, patch, opts = {}) {
    const r = this.get(t, id); if (!r) return null;
    const before = Object.assign({}, r);
    Object.assign(r, patch, { updated_at: SZ.nowISO() });
    if (!opts.silent) this.audit(t, id, 'update', before, r, opts.note);
    if (!opts.batch) this.persist();
    return r;
  },

  remove(t, id, opts = {}) {
    const i = (this.data[t] || []).findIndex(r => r.id === id);
    if (i < 0) return false;
    const before = this.data[t][i];
    this.data[t].splice(i, 1);
    if (!opts.silent) this.audit(t, id, 'delete', before, null);
    if (!opts.batch) this.persist();
    return true;
  },

  audit(entity, entity_id, action, before, after, note) {
    const diff = {};
    if (before && after) {
      Object.keys(after).forEach(k => {
        if (k === 'updated_at') return;
        if (JSON.stringify(before[k]) !== JSON.stringify(after[k])) diff[k] = [before[k], after[k]];
      });
      if (!Object.keys(diff).length) return;   // não audita no-op
    }
    (this.data.audit_log = this.data.audit_log || []).push({
      id: SZ.uid('aud'), occurred_at: SZ.nowISO(), user_id: this.session.user_id,
      entity, entity_id, action, diff: Object.keys(diff).length ? diff : null, note: note || null
    });
    if (this.data.audit_log.length > 4000) this.data.audit_log.splice(0, 1000);
  },

  setting(key, fallback) {
    const s = this.first('setting', r => r.key === key);
    return s ? s.value : fallback;
  },
  setSetting(key, value) {
    const s = this.first('setting', r => r.key === key);
    if (s) this.update('setting', s.id, { value }); else this.insert('setting', { key, value });
  }
};
SZ.db = Store;

SZ.shapeFor = (g) => {
  const c = (g.category_slug || '').toLowerCase();
  if (c.includes('macacao')) return 'macacao';
  if (c.includes('saia')) return 'saia';
  if (c.includes('blazer') || c.includes('conjunto')) return 'blazer';
  if (c.includes('bolsa') || c.includes('acessorio')) return 'bolsa';
  if (c.includes('xale') || c.includes('capa')) return 'xale';
  if ((g.style || '').toLowerCase().includes('sereia')) return 'sereia';
  if (g.length === 'curto') return 'curto';
  if (g.length === 'midi') return 'midi';
  return 'longo';
};
SZ.silhouette = (g, opts = {}) => {
  const shape = SZ.shapeFor(g);
  const col = g.color_hex || '#8C8C8C';
  const id = 'gr' + (g.id || '').replace(/[^a-z0-9]/gi, '');
  const sec = g.color_hex_secondary || null;
  return `<svg viewBox="0 0 120 160" role="img" aria-label="${SZ.esc(g.name || 'Peça')} — ${SZ.esc(g.color_primary || '')}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--surface-2)"/><stop offset="1" stop-color="var(--surface-3)"/>
      </linearGradient>
      <linearGradient id="${id}f" x1="0.15" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity="1"/>
        <stop offset="1" stop-color="${sec || col}" stop-opacity="${sec ? 1 : .82}"/>
      </linearGradient>
    </defs>
    <rect width="120" height="160" fill="url(#${id}b)"/>
    <ellipse cx="60" cy="150" rx="34" ry="4.5" fill="rgba(0,0,0,.07)"/>

SZ.sum = (arr, fn) => arr.reduce((a, r) => a + (Number(fn(r)) || 0), 0);
SZ.groupBy = (arr, fn) => arr.reduce((m, r) => { const k = fn(r); (m[k] = m[k] || []).push(r); return m; }, {});
SZ.sortBy = (arr, fn, dir = 1) => arr.slice().sort((a, b) => {
  const x = fn(a), y = fn(b); return x < y ? -dir : x > y ? dir : 0;
});
