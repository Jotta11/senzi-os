  'financeiro.consolidated': 'Ver resultado consolidado, margem e investimento',

  'inteligencia.view':     'Ver a inteligência de acervo',

  'config.view':           'Abrir configurações',
  'config.params':         'Alterar parâmetros de operação',
  'config.users':          'Gerenciar usuários e permissões',
  'config.audit':          'Ver o histórico de auditoria',
  'config.data':           'Exportar e regenerar dados'
};

const ALL_PERMS = Object.keys(SZ.PERMISSIONS);

SZ.ROLE_PERMISSIONS = {
  admin: ALL_PERMS.slice(),

  gestor: ALL_PERMS.filter(p => p !== 'config.users'),

  atendimento: [
    'dashboard.view', 'agenda.view',
    'cliente.view', 'cliente.create', 'cliente.edit', 'cliente.note',
    'acervo.view', 'acervo.edit',
    'prova.view', 'prova.manage',
    'reserva.view', 'reserva.create', 'reserva.confirm', 'reserva.cancel',
    'reserva.pickup', 'reserva.return', 'reserva.discount',
    'operacao.view',
    'financeiro.view', 'financeiro.payment'
  ],

  operacao: [
    'dashboard.view', 'agenda.view',
    'cliente.view',
    'acervo.view', 'acervo.edit', 'acervo.block',
    'reserva.view', 'reserva.pickup', 'reserva.return',
    'operacao.view', 'operacao.inspect', 'operacao.maintenance', 'operacao.release'
  ]
};

/* Descrição curta de cada perfil — usada na tela de usuários e no seletor. */
SZ.ROLE_SUMMARY = {
  admin: 'Acesso total, incluindo usuários, permissões e auditoria.',
  gestor: 'Operação, financeiro consolidado, inteligência e parâmetros. Não gerencia usuários.',
  atendimento: 'Clientes, provas, reservas, acervo e cobrança da reserva. Sem resultado consolidado.',
  operacao: 'Acervo, inspeção, higienização, manutenção, retiradas e devoluções. Sem financeiro.'
};

/* Permissões efetivas: perfil + concedidas ao usuário − revogadas dele. */
SZ.effectivePermissions = (user) => {
  if (!user) return [];
  const role = Store.get('role', user.role_id);
  const base = (role && SZ.ROLE_PERMISSIONS[role.key]) || [];
  const ov = user.permission_overrides || { granted: [], revoked: [] };
  const set = new Set(base);
  (ov.granted || []).forEach(p => set.add(p));
  (ov.revoked || []).forEach(p => set.delete(p));
  return ALL_PERMS.filter(p => set.has(p));
};

SZ.currentUser = () => Store.get('app_user', Store.session.user_id);

SZ.canUser = (user, perm) => {
  if (!user || user.is_active === false) return false;
  return SZ.effectivePermissions(user).indexOf(perm) >= 0;
};

/** A função que toda a interface consulta. */
SZ.can = (perm) => SZ.canUser(SZ.currentUser(), perm);

/** Guarda para ações: executa apenas se permitido; caso contrário avisa. */
SZ.require = (perm, onOk) => {
  if (SZ.can(perm)) return onOk();
  const u = SZ.currentUser();
  if (SZ.UI && SZ.UI.toast) {
    SZ.UI.toast('Ação não permitida',
      `${u ? u.full_name.split(' ')[0] : 'Este perfil'} não pode ${(SZ.PERMISSIONS[perm] || perm).toLowerCase()}.`, 'err');
  }
  Store.audit('access', null, 'denied', null, null, `Tentativa sem permissão: ${perm}`);
  return null;
};


/* ═══════════ 02-engine.js ═══════════ */
/* =====================================================================
   SENZIE OS — 02 · Motor de regras
   Disponibilidade, máquinas de estado, financeiro derivado, alertas.

   REGRA ZERO
   ----------
   Nenhuma tela decide se uma peça está livre. Só `E.check()` decide, e ele
   consulta uma única tabela: garment_calendar_block. Toda promessa feita a
   uma cliente passa por aqui.
   ===================================================================== */
const E = {};
SZ.E = E;
const db = SZ.db;

/* ---------------------------------------------------------- parâmetros */
E.cfg = () => ({
  hold_hours:        db.setting('hold_duration_hours', 24),
  cleaning_days:     db.setting('default_cleaning_days', 2),
  prep_days:         db.setting('default_prep_days', 0),
  late_fee_percent:  db.setting('late_fee_daily_percent', 20),
  deposit_percent:   db.setting('deposit_percent', 0),
  idle_alert_days:   db.setting('idle_alert_days', 90)
});

/* Buffer efetivo: peça > categoria > sistema. */
E.buffer = (g) => {
  const cfg = E.cfg();
  const cat = g.category_id ? db.get('garment_category', g.category_id) : null;
  const cleaning = g.cleaning_days != null ? g.cleaning_days
    : (cat && cat.default_cleaning_days != null ? cat.default_cleaning_days : cfg.cleaning_days);
  const prep = g.prep_days != null ? g.prep_days
    : (cat && cat.default_prep_days != null ? cat.default_prep_days : cfg.prep_days);
  return { cleaning: Number(cleaning) || 0, prep: Number(prep) || 0 };
};

/* ------------------------------------------------------- disponibilidade */
const CLOSED = ['finalizada', 'cancelada', 'no_show'];
/* Um bloco vira história quando a reserva que o gerou encerrou — MAS só o
   bloco de uso. A higienização aberta por aquela devolução continua valendo:
   ela é um compromisso da Operação, não da reserva. */
E.isHistoric = (b) => b.reservation_id && ['locacao', 'pre_reserva'].includes(b.kind)
  && (() => { const r = db.get('reservation', b.reservation_id); return !r || CLOSED.includes(r.state); })();

E.activeBlocks = (garment_id) => {
  const now = SZ.nowISO();
  return db.where('garment_calendar_block', b =>
    b.garment_id === garment_id && !b.released_at && (!b.expires_at || b.expires_at > now));
};

/* Janela operacional completa de uma locação: preparação + uso + higiene. */
E.window = (g, pickup, return_due) => {
  const b = E.buffer(g);
  return {
    prep_start: SZ.addDays(pickup, -b.prep),
    start: pickup,
    end: return_due,
    clean_start: b.cleaning ? SZ.addDays(return_due, 1) : null,
    clean_end: b.cleaning ? SZ.addDays(return_due, b.cleaning) : null,
    occupied_from: SZ.addDays(pickup, -b.prep),
    occupied_to: SZ.addDays(return_due, b.cleaning),
    buffer: b
  };
};

/**
 * A trava de conflito. Retorna { ok, window, conflicts[] }.
 * `ignore` permite reeditar a própria reserva sem colidir consigo mesma.
 */
E.check = (garment_id, pickup, return_due, ignore) => {
  const g = db.get('garment', garment_id);
  if (!g) return { ok: false, conflicts: [], reason: 'Peça inexistente.' };
  if (g.state === 'baixado') return { ok: false, conflicts: [], reason: 'Peça baixada do acervo.' };
  const w = E.window(g, pickup, return_due);
  const conflicts = E.activeBlocks(garment_id)
    .filter(b => (!ignore || b.reservation_id !== ignore))
    // bloco de reserva já encerrada é registro histórico, não compromisso
    .filter(b => !E.isHistoric(b))
    .filter(b => SZ.overlaps(w.occupied_from, w.occupied_to, b.start_date, b.end_date))
    .map(b => ({
      block: b,
      kind: SZ.BLOCK_KIND[b.kind],
      reservation: b.reservation_id ? db.get('reservation', b.reservation_id) : null,
      period: `${SZ.fd(b.start_date)} – ${SZ.fd(b.end_date)}`
    }));
  return { ok: conflicts.length === 0, window: w, conflicts };
};

/* Peças alternativas para oferecer quando dá conflito. */
E.alternatives = (g, pickup, return_due, limit = 4) => {
  return db.where('garment', x => x.id !== g.id && x.state !== 'baixado'
      && x.category_id === g.category_id)
    .map(x => {
      let score = 0;
      if (x.label_size === g.label_size) score += 4;
      if (x.size_equiv === g.size_equiv) score += 3;
      if (x.length === g.length) score += 2;
      if (x.color_primary === g.color_primary) score += 2;
      if (Math.abs((x.rental_price || 0) - (g.rental_price || 0)) < 150) score += 1;
      return { g: x, score, avail: E.check(x.id, pickup, return_due).ok };
    })
    .filter(r => r.avail)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
};

/* Calendário individual da peça: um registro por dia. */
E.calendar = (garment_id, from, to) => {
  const blocks = E.activeBlocks(garment_id);
  const days = [];
  const n = SZ.diffDays(from, to);
  for (let i = 0; i <= n; i++) {
    const d = SZ.addDays(from, i);
    const hit = blocks.find(b => d >= b.start_date && d <= b.end_date);
    if (hit) {
      const k = SZ.BLOCK_KIND[hit.kind];
      days.push({ date: d, kind: hit.kind, tone: k.tone, tag: k.tag, label: k.label, block: hit });
    } else {
      days.push({ date: d, kind: null, tone: 'green', tag: '', label: 'Disponível' });
    }
  }
  return days;
};

/* ---------------------------------------------------- estados da peça */
E.setGarmentState = (garment_id, to_state, reason, ref) => {
  const g = db.get('garment', garment_id); if (!g) return;
  if (g.state === to_state) return g;
  const from = g.state;
  db.update('garment', garment_id, { state: to_state }, { silent: true });
  db.insert('garment_state_history', {
    garment_id, from_state: from, to_state, reason: reason || null,
    ref_type: ref && ref.type || null, ref_id: ref && ref.id || null,
    occurred_at: SZ.nowISO(), user_id: db.session.user_id
  }, { silent: true });
  db.audit('garment', garment_id, 'transition', { state: from }, { state: to_state }, reason);
  db.persist();
  return g;
};

/* Deriva o estado correto da peça a partir dos blocos + reservas.
   Usado no boot para corrigir deriva temporal sem poluir a timeline. */
E.deriveState = (g) => {
  if (['baixado', 'bloqueado', 'higienizacao', 'inspecao', 'ajuste', 'manutencao'].includes(g.state)) {
    // esses estados só saem por ação explícita da Operação
    return g.state;
  }
  const hoje = SZ.today();
  // O FATO vence o PLANO: se existe reserva com a peça fora da loja, ela está
  // fora da loja — mesmo que o bloco de higienização planejado já tenha começado
  // porque a cliente atrasou a devolução.
  const naRua = db.where('reservation_item', i => i.garment_id === g.id)
    .map(i => db.get('reservation', i.reservation_id))
    .find(r => r && ['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state));
  if (naRua) return naRua.state === 'aguardando_devolucao' ? 'aguardando_devolucao' : 'em_uso';

  // blocos de reservas encerradas são história: não determinam o estado de hoje
  const blocks = E.activeBlocks(g.id).filter(b => !E.isHistoric(b));
  const live = blocks.find(b => b.kind === 'locacao' && hoje >= b.start_date && hoje <= b.end_date);
  if (live) {
    const r = live.reservation_id ? db.get('reservation', live.reservation_id) : null;
    if (r && ['retirada', 'em_uso'].includes(r.state)) return 'em_uso';
    if (r && r.state === 'aguardando_devolucao') return 'aguardando_devolucao';
    return 'reservado';
  }
  if (blocks.some(b => b.kind === 'higienizacao' && hoje >= b.start_date && hoje <= b.end_date)) return 'higienizacao';
  if (blocks.some(b => b.kind === 'locacao' && b.start_date > hoje)) return 'reservado';
  if (blocks.some(b => b.kind === 'pre_reserva')) return 'pre_reservado';
  return 'disponivel';
};

E.reconcile = () => {
  let n = 0;
  db.all('garment').forEach(g => {
    const s = E.deriveState(g);
    if (s !== g.state) { db.update('garment', g.id, { state: s }, { silent: true }); n++; }
  });
  if (n) db.persist();
  return n;
};

/* --------------------------------------------------- estados da reserva */
E.transition = (reservation_id, to_state, reason) => {
  const r = db.get('reservation', reservation_id); if (!r) return null;
  const from = r.state;
  if (from === to_state) return r;
  db.update('reservation', reservation_id, { state: to_state }, { silent: true });
  db.insert('reservation_state_history', {
    reservation_id, from_state: from, to_state, reason: reason || null,
    occurred_at: SZ.nowISO(), user_id: db.session.user_id
  }, { silent: true });
  db.audit('reservation', reservation_id, 'transition', { state: from }, { state: to_state }, reason);
  db.persist();
  return r;
};

/* ---------------------------------------------------------- blocos */
E.makeBlocks = (reservation, garment, kind) => {
  const w = E.window(garment, reservation.pickup_date, reservation.return_due_date);
  const out = [];
  const base = { garment_id: garment.id, reservation_id: reservation.id, created_by: db.session.user_id };

  if (kind === 'pre_reserva') {
    out.push(db.insert('garment_calendar_block', Object.assign({}, base, {
      kind: 'pre_reserva', start_date: w.occupied_from, end_date: w.occupied_to,
      expires_at: reservation.hold_expires_at, note: 'Pré-reserva'
    }), { batch: true }));
  } else {
    if (w.buffer.prep > 0) out.push(db.insert('garment_calendar_block', Object.assign({}, base, {
      kind: 'inspecao', start_date: w.prep_start, end_date: SZ.addDays(w.start, -1), note: 'Preparação'
    }), { batch: true }));
    out.push(db.insert('garment_calendar_block', Object.assign({}, base, {
      kind: 'locacao', start_date: w.start, end_date: w.end, note: 'Locação'
    }), { batch: true }));
    if (w.clean_start) out.push(db.insert('garment_calendar_block', Object.assign({}, base, {
      kind: 'higienizacao', start_date: w.clean_start, end_date: w.clean_end, note: 'Higienização pós-uso'
    }), { batch: true }));
  }
  db.persist();
  return out;
};

E.releaseBlocks = (filterFn) => {
  const now = SZ.nowISO();
  let n = 0;
  db.all('garment_calendar_block').forEach(b => {
    if (!b.released_at && filterFn(b)) { b.released_at = now; n++; }
  });
  if (n) db.persist();
  return n;
};

E.expireHolds = () => {
  const now = SZ.nowISO();
  const expired = db.where('garment_calendar_block',
    b => b.kind === 'pre_reserva' && !b.released_at && b.expires_at && b.expires_at <= now);
  if (!expired.length) return 0;
  const resIds = new Set();
  expired.forEach(b => { b.released_at = now; if (b.reservation_id) resIds.add(b.reservation_id); });
  resIds.forEach(id => {
    const r = db.get('reservation', id);
    if (r && ['pre_reserva', 'aguardando_pagamento'].includes(r.state)) {
      E.transition(id, 'cancelada', 'Pré-reserva expirada automaticamente');
      db.update('reservation', id, { cancel_reason: 'Prazo de pré-reserva expirado' }, { silent: true });
    }
  });
  db.persist();
  E.reconcile();
  return expired.length;
};

/* ====================================================================
   FLUXOS DE NEGÓCIO
   ==================================================================== */

E.nextCode = (prefix, table, field) => {
  const nums = db.all(table).map(r => parseInt(String(r[field] || '').replace(/\D/g, ''), 10) || 0);
  const max = nums.length ? Math.max.apply(null, nums) : 0;
  return prefix + String(max + 1).padStart(4, '0');
};
E.nextResCode = () => {
  const y = new Date().getFullYear();
  const n = db.all('reservation').filter(r => String(r.code).includes(String(y))).length + 1;
  return `RS-${y}-${String(n).padStart(4, '0')}`;
};

/**
 * Cria reserva. mode = 'pre_reserva' | 'confirmada'
 * Valida TODAS as peças antes de gravar qualquer coisa.
 */
E.createReservation = (input, mode) => {
  const cfg = E.cfg();
  const problems = [];
  input.items.forEach(it => {
    const g = db.get('garment', it.garment_id);
    const c = E.check(it.garment_id, input.pickup_date, input.return_due_date);
    if (!c.ok) problems.push({ garment: g, check: c });
  });
  if (problems.length) return { ok: false, problems };

  const hold_expires_at = mode === 'pre_reserva'
    ? new Date(Date.now() + cfg.hold_hours * 3600e3).toISOString() : null;

  const gross = SZ.sum(input.items, i => i.unit_price);
  const disc = SZ.sum(input.items, i => i.discount || 0) + (input.discount || 0);

  const r = db.insert('reservation', {
    code: E.nextResCode(),
    customer_id: input.customer_id,
    state: mode === 'pre_reserva' ? 'pre_reserva' : 'aguardando_pagamento',
    event_date: input.event_date, event_type: input.event_type || null,
    event_venue: input.event_venue || null,
    pickup_date: input.pickup_date, return_due_date: input.return_due_date,
    hold_expires_at, channel: input.channel || 'loja',
    total_gross: gross, discount: disc, total_net: gross - disc,
    deposit_amount: input.deposit_amount || 0,
    late_fee: 0, notes: input.notes || null,
    created_by: db.session.user_id
  });

  const rateado = E.prorate(input.items, input.discount || 0);
  rateado.forEach(it => {
    db.insert('reservation_item', {
      reservation_id: r.id, garment_id: it.garment_id,
      unit_price: it.unit_price,
      gross_amount: it.gross_amount,
      item_discount: it.item_discount,
      allocated_order_discount: it.allocated_order_discount,
      net_revenue: it.net_revenue,
      discount: it.item_discount + it.allocated_order_discount,  // compat v0.1
      line_total: it.net_revenue,                                // compat v0.1
      item_state: 'pendente',
      picked_up_at: null, returned_at: null,
      pickup_note: null, return_note: null,
      alteration_notes: it.alteration_notes || null
    }, { batch: true });
    const g = db.get('garment', it.garment_id);
    E.makeBlocks(r, g, mode === 'pre_reserva' ? 'pre_reserva' : 'locacao');
    E.setGarmentState(g.id, mode === 'pre_reserva' ? 'pre_reservado' : 'reservado',
      `Reserva ${r.code}`, { type: 'reservation', id: r.id });
  });

  db.insert('reservation_state_history', {
    reservation_id: r.id, from_state: null, to_state: r.state,
    reason: 'Reserva criada', occurred_at: SZ.nowISO(), user_id: db.session.user_id
  }, { silent: true, batch: true });

  if (input.event_date) {
    db.insert('appointment', {
      kind: 'evento', customer_id: input.customer_id, reservation_id: r.id,
      starts_at: input.event_date + 'T19:00:00', title: input.event_type || 'Evento',
      state: 'agendado'
    }, { batch: true });
  }
  db.insert('appointment', {
    kind: 'retirada', customer_id: input.customer_id, reservation_id: r.id,
    starts_at: input.pickup_date + 'T10:00:00', title: 'Retirada', state: 'agendado'
  }, { batch: true });
  db.insert('appointment', {
    kind: 'devolucao', customer_id: input.customer_id, reservation_id: r.id,
    starts_at: input.return_due_date + 'T11:00:00', title: 'Devolução', state: 'agendado'
  }, { batch: true });

  db.persist();
  return { ok: true, reservation: r };
};

/**
 * Pré-reserva → reserva firme.
 *
 * v0.2 · ATOMICIDADE. A versão anterior liberava os blocos de pré-reserva
 * ANTES de validar cada peça — se a terceira peça desse conflito, a reserva
 * ficava num estado impossível: duas peças confirmadas, uma solta, e a
 * pré-reserva já destruída. Agora a ordem é outra:
 *
 *   1. valida TODAS as peças contra o calendário
 *   2. só se todas passarem, libera os blocos antigos
 *   3. cria os novos blocos e atualiza todos os estados
 *   4. se qualquer uma falhar, NADA é alterado e a pré-reserva fica intacta
 *
 * → EM PRODUÇÃO: isto vira uma transaction do PostgreSQL (BEGIN … COMMIT),
 *   com a constraint EXCLUDE garantindo a integridade mesmo sob concorrência.
 *   A simulação aqui reproduz o comportamento, não a garantia.
 */
E.confirmReservation = (reservation_id) => {
  const r = db.get('reservation', reservation_id);
  if (!r) return { ok: false, problems: [], reason: 'Reserva inexistente.' };
  const items = db.where('reservation_item', i => i.reservation_id === reservation_id
    && i.item_state !== 'cancelado');
  if (!items.length) return { ok: false, problems: [], reason: 'Reserva sem peças.' };

  // ---- FASE 1 · validação completa, sem escrever nada -------------------
  const problems = [];
  items.forEach(it => {
    const g = db.get('garment', it.garment_id);
    if (!g) { problems.push({ garment: null, check: { conflicts: [], reason: 'Peça removida do acervo.' } }); return; }
    // ignora os próprios blocos desta reserva — ela não conflita consigo mesma
    const c = E.check(g.id, r.pickup_date, r.return_due_date, reservation_id);
    if (!c.ok) problems.push({ garment: g, check: c });
  });
  if (problems.length) {
    db.audit('reservation', reservation_id, 'update', null, null,
      `Confirmação recusada: ${problems.length} peça(s) em conflito. Nenhum bloco foi alterado.`);
    return { ok: false, problems, reason: 'Conflito de calendário.' };
  }

  // ---- FASE 2 · commit: agora sim, tudo de uma vez ----------------------
  E.releaseBlocks(b => b.reservation_id === reservation_id && b.kind === 'pre_reserva');
  items.forEach(it => {
    const g = db.get('garment', it.garment_id);
    E.makeBlocks(r, g, 'locacao');
    E.setGarmentState(g.id, 'reservado', `Reserva ${r.code} confirmada`, { type: 'reservation', id: r.id });
  });
  db.update('reservation', reservation_id, { hold_expires_at: null }, { silent: true });
  const bal = E.balance(db.get('reservation', reservation_id));
  E.transition(reservation_id, bal.due > 0 ? 'aguardando_pagamento' : 'confirmada', 'Confirmação da reserva');
  return { ok: true, problems: [] };
};

/**
 * Rateio do desconto global entre os itens, proporcional ao valor bruto.
 * O resto dos centavos vai para o item de maior valor (método do maior
 * resto), para que a soma dos net_revenue bata exatamente com o total da
 * reserva. Sem isso, a Inteligência atribui a uma peça receita que a
 * empresa nunca recebeu.
 */
E.prorate = (items, orderDiscount) => {
  const rows = items.map(it => {
    const gross = Number(it.unit_price) || 0;
    const own = Number(it.discount || it.item_discount || 0);
    return {
      garment_id: it.garment_id, unit_price: gross,
      gross_amount: gross, item_discount: own,
      base: Math.max(0, gross - own),
      allocated_order_discount: 0, net_revenue: 0,
      alteration_notes: it.alteration_notes || null
    };
  });
  const base = rows.reduce((a, x) => a + x.base, 0);
  const desc = Math.min(Math.max(0, Number(orderDiscount) || 0), base);
  if (base <= 0 || desc <= 0) {
    rows.forEach(x => { x.net_revenue = Math.round(x.base * 100) / 100; });
    return rows;
  }
  let distribuido = 0;
  rows.forEach(x => {
    const q = Math.floor(desc * (x.base / base) * 100) / 100;
    x.allocated_order_discount = q; distribuido += q;
  });
  const resto = Math.round((desc - distribuido) * 100) / 100;
  if (resto > 0) {
    const maior = rows.slice().sort((a, b) => b.base - a.base)[0];
    maior.allocated_order_discount = Math.round((maior.allocated_order_discount + resto) * 100) / 100;
  }
  rows.forEach(x => { x.net_revenue = Math.round((x.base - x.allocated_order_discount) * 100) / 100; });
  return rows;
};

/** Receita líquida de um item, com compatibilidade com dados da v0.1. */
E.itemRevenue = (it) => {
  if (it.net_revenue != null) return Number(it.net_revenue) || 0;
  if (it.line_total != null) return Number(it.line_total) || 0;
  return (Number(it.unit_price) || 0) - (Number(it.discount) || 0);
};

E.cancelReservation = (reservation_id, reason) => {
  const r = db.get('reservation', reservation_id); if (!r) return;
  E.releaseBlocks(b => b.reservation_id === reservation_id);
  db.where('reservation_item', i => i.reservation_id === reservation_id).forEach(it => {
    E.setGarmentState(it.garment_id, E.deriveState(db.get('garment', it.garment_id)),
      `Reserva ${r.code} cancelada`, { type: 'reservation', id: r.id });
  });
  db.where('appointment', a => a.reservation_id === reservation_id && a.state === 'agendado')
    .forEach(a => db.update('appointment', a.id, { state: 'cancelado' }, { silent: true, batch: true }));
  db.update('reservation', reservation_id, { cancel_reason: reason || null }, { silent: true });
  E.transition(reservation_id, 'cancelada', reason || 'Cancelamento');
  E.reconcile();
};

/**
 * RETIRADA POR ITEM · v0.2
 * decisions = [{ item_id, delivered: bool, note }]
 * A reserva só vai a "em uso" quando todos os itens aplicáveis saíram.
 * Se parte ficou, ela vai a "retirada" (parcial) e o que ficou continua
 * bloqueado no calendário — a peça não foi entregue, mas segue comprometida.
 */
E.pickupItems = (reservation_id, decisions, opts = {}) => {
  const r = db.get('reservation', reservation_id); if (!r) return { ok: false };
  const items = db.where('reservation_item', i => i.reservation_id === reservation_id && i.item_state !== 'cancelado');
  const now = SZ.nowISO();
  let entregues = 0, retidos = 0;

  decisions.forEach(d => {
    const it = db.get('reservation_item', d.item_id); if (!it) return;
    if (d.delivered) {
      db.update('reservation_item', it.id, {
        item_state: 'retirado', picked_up_at: now, pickup_note: d.note || null
      }, { silent: true, batch: true });
      E.setGarmentState(it.garment_id, 'em_uso', `Retirada — ${r.code}`, { type: 'reservation', id: r.id });
      entregues++;
    } else {
      db.update('reservation_item', it.id, {
        item_state: 'nao_entregue', pickup_note: d.note || 'Não entregue na retirada'
      }, { silent: true, batch: true });
      retidos++;
    }
  });

  if (!r.picked_up_at && entregues) db.update('reservation', reservation_id, { picked_up_at: now }, { silent: true, batch: true });

  const todos = items.every(i => ['retirado', 'devolvido', 'inspecionado'].includes(
    db.get('reservation_item', i.id).item_state));
  const novoEstado = todos ? 'em_uso' : (entregues ? 'retirada' : r.state);

  db.where('appointment', a => a.reservation_id === reservation_id && a.kind === 'retirada' && a.state === 'agendado')
    .forEach(a => db.update('appointment', a.id, { state: todos ? 'concluido' : 'agendado' }, { silent: true, batch: true }));

  if (opts.authorization) E.recordAuthorization(reservation_id, opts.authorization);

  db.persist();
  if (novoEstado !== r.state) {
    E.transition(reservation_id, novoEstado,
      todos ? 'Todas as peças retiradas pela cliente' : `Retirada parcial — ${entregues} de ${items.length} peça(s)`);
  }
  return { ok: true, entregues, retidos, completa: todos };
};

/* Compatibilidade: retirada integral em uma chamada. */
E.pickup = (reservation_id) => {
  const items = db.where('reservation_item', i => i.reservation_id === reservation_id && i.item_state !== 'cancelado');
  return E.pickupItems(reservation_id, items.map(i => ({ item_id: i.id, delivered: true })));
};

/** Registra formalmente uma exceção autorizada (quem, quando, por quê). */
E.recordAuthorization = (reservation_id, auth) => {
  const u = db.get('app_user', auth.user_id || db.session.user_id);
  const role = u ? db.get('role', u.role_id) : null;
  const row = db.insert('exception_authorization', {
    reservation_id, kind: auth.kind || 'retirada_com_saldo',
    amount: auth.amount || 0, reason: auth.reason || null,
    authorized_by: u ? u.id : null,
    authorized_by_name: u ? u.full_name : '—',
    authorized_by_role: role ? role.name : '—',
    authorized_at: SZ.nowISO()
  });
  db.audit('reservation', reservation_id, 'update', null, null,
    `Exceção autorizada (${row.kind}) de ${SZ.brl(row.amount)} por ${row.authorized_by_name} — ${row.authorized_by_role}. Motivo: ${row.reason || 'não informado'}`);
  db.insert('reservation_state_history', {
    reservation_id, from_state: null, to_state: db.get('reservation', reservation_id).state,
    reason: `Exceção autorizada: ${row.reason || row.kind} (${row.authorized_by_name})`,
    occurred_at: SZ.nowISO(), user_id: row.authorized_by
  }, { silent: true, batch: true });
  db.persist();
  return row;
};

/**
 * Realinha o calendário da peça na data REAL da devolução.
 * Devolveu antes: a locação encolhe e a peça volta ao mercado mais cedo.
 * Devolveu depois: a higienização desloca — e, se isso invadir o próximo
 * compromisso, o buffer é comprimido até o limite do que ainda cabe.
 * Sem isso, o calendário guardaria a promessa e não o fato.
 */
E.realignOnReturn = (garment_id, reservation_id, returned_on) => {
  const g = db.get('garment', garment_id); if (!g) return;
  const buf = E.buffer(g);
  const meus = db.where('garment_calendar_block',
    b => b.garment_id === garment_id && b.reservation_id === reservation_id && !b.released_at);
  const loc = meus.find(b => b.kind === 'locacao');
  if (loc) db.update('garment_calendar_block', loc.id,
    { end_date: returned_on < loc.start_date ? loc.start_date : returned_on }, { silent: true, batch: true });

  const limpeza = meus.find(b => b.kind === 'higienizacao');
  if (!buf.cleaning) { if (limpeza) E.releaseBlocks(b => b.id === limpeza.id); return; }

  const ini = SZ.addDays(returned_on, 1);
  let fim = SZ.addDays(returned_on, buf.cleaning);
  // não invadir o próximo compromisso já assumido
  const proximo = SZ.sortBy(db.where('garment_calendar_block', b =>
    b.garment_id === garment_id && !b.released_at && b.reservation_id !== reservation_id
    && b.start_date >= ini), b => b.start_date)[0];
  if (proximo && proximo.start_date <= fim) fim = SZ.addDays(proximo.start_date, -1);

  if (fim < ini) {
    if (limpeza) E.releaseBlocks(b => b.id === limpeza.id);
  } else if (limpeza) {
    db.update('garment_calendar_block', limpeza.id, { start_date: ini, end_date: fim }, { silent: true, batch: true });
  } else {
    db.insert('garment_calendar_block', {
      garment_id, reservation_id, kind: 'higienizacao', start_date: ini, end_date: fim,
      note: 'Higienização pós-uso', created_by: db.session.user_id
    }, { silent: true, batch: true });
  }
  db.persist();
};

/**
 * DEVOLUÇÃO POR ITEM · v0.2
 * decisions = [{ item_id, returned: bool, note }]
 * A cliente pode devolver o vestido hoje e a clutch amanhã. Cada peça
 * devolvida sai da rua, realinha o próprio calendário e entra em inspeção.
 * A reserva só vai a "em inspeção" quando a última peça voltar.
 */
E.returnItems = (reservation_id, decisions, opts = {}) => {
  const r = db.get('reservation', reservation_id); if (!r) return { ok: false };
  const hoje = SZ.today(), now = SZ.nowISO();
  let devolvidos = 0;

  decisions.forEach(d => {
    if (!d.returned) return;
    const it = db.get('reservation_item', d.item_id); if (!it) return;
    if (['devolvido', 'inspecionado', 'cancelado'].includes(it.item_state)) return;
    db.update('reservation_item', it.id, {
      item_state: 'devolvido', returned_at: now, return_note: d.note || null
    }, { silent: true, batch: true });
    E.realignOnReturn(it.garment_id, reservation_id, hoje);
    E.setGarmentState(it.garment_id, 'inspecao', `Devolução — ${r.code}`, { type: 'reservation', id: r.id });
    devolvidos++;
  });

  const items = db.where('reservation_item', i => i.reservation_id === reservation_id && i.item_state !== 'cancelado')
    .map(i => db.get('reservation_item', i.id));
  const aindaFora = items.filter(i => i.item_state === 'retirado');
  const completa = aindaFora.length === 0;

  /* Multa: recalculada a cada devolução. Enquanto houver peça na rua, o
     relógio continua correndo — por isso a referência é hoje, não a última
     peça devolvida. */
  const ref = completa
    ? items.filter(i => i.returned_at).map(i => String(i.returned_at).slice(0, 10)).sort().pop() || hoje
    : hoje;
  const atraso = Math.max(0, SZ.diffDays(r.return_due_date, ref));
  const fee = atraso > 0 ? Math.round(r.total_net * (E.cfg().late_fee_percent / 100) * atraso * 100) / 100 : 0;

  db.update('reservation', reservation_id, {
    returned_at: completa ? now : null, late_fee: fee
  }, { silent: true, batch: true });

  // uma única cobrança de multa por reserva, sempre atualizada
  const multa = db.first('payment', p => p.reservation_id === reservation_id && p.kind === 'multa' && p.state === 'pendente');
  if (fee > 0) {
    const nota = `${atraso} dia(s) de atraso${aindaFora.length ? ` · ${aindaFora.length} peça(s) ainda na rua` : ''}`;
    if (multa) db.update('payment', multa.id, { amount: fee, notes: nota, due_at: hoje }, { silent: true, batch: true });
    else db.insert('payment', {
      reservation_id, kind: 'multa', method: 'pix', amount: fee, state: 'pendente',
      due_at: hoje, notes: nota, created_by: db.session.user_id
    }, { silent: true, batch: true });
  } else if (multa) {
    db.remove('payment', multa.id, { silent: true, batch: true });
  }

  db.where('appointment', a => a.reservation_id === reservation_id && a.kind === 'devolucao' && a.state === 'agendado')
    .forEach(a => { if (completa) db.update('appointment', a.id, { state: 'concluido' }, { silent: true, batch: true }); });

  db.persist();
  E.transition(reservation_id, completa ? 'em_inspecao' : 'aguardando_devolucao',
    completa
      ? (atraso > 0 ? `Devolvida com ${atraso} dia(s) de atraso` : 'Devolvida no prazo')
      : `Devolução parcial — ${devolvidos} peça(s) recebida(s), ${aindaFora.length} pendente(s)`);

  return { ok: true, devolvidos, pendentes: aindaFora.length, completa, late_days: atraso, fee };
};

/* Compatibilidade: devolução integral em uma chamada. */
E.returnReservation = (reservation_id, opts = {}) => {
  const items = db.where('reservation_item', i => i.reservation_id === reservation_id && i.item_state !== 'cancelado');
  return E.returnItems(reservation_id, items.map(i => ({ item_id: i.id, returned: true })), opts);
};

/**
 * INSPEÇÃO · v0.2 — quatro destinos, não dois.
 *
 *   aprovada  → higienização
 *   ressalva  → higienização, e abre ordem de reparo leve quando pedido
 *   reprovada → manutenção bloqueante
 *   perda     → BLOQUEADA para avaliação gerencial (possível perda da peça)
 *
 * O quarto destino existe porque "dano grave" e "peça provavelmente perdida"
 * exigem decisões diferentes: uma é do ateliê, a outra é da gestão — envolve
 * cobrança da cliente, valor de reposição e baixa do acervo.
 */
E.registerInspection = (garment_id, payload) => {
  const g = db.get('garment', garment_id);
  if (!g) return null;
  const hoje = SZ.today();
  const danos = (payload.findings || []).filter(f => !f.ok);
  const grave = danos.some(f => f.severity === 'grave');
  const result = payload.result || (danos.length ? (grave ? 'reprovada' : 'ressalva') : 'aprovada');

  const insp = db.insert('garment_inspection', {
    garment_id, reservation_id: payload.reservation_id || null,
    inspected_at: SZ.nowISO(), inspector_id: db.session.user_id,
    result, findings: payload.findings || [], notes: payload.notes || null
  });

  /* Fotos simuladas — no protótipo são referências; em produção são objetos
     no Supabase Storage. A estrutura já é a definitiva. */
  (payload.photos || []).forEach((p, i) => db.insert('garment_photo', {
    garment_id, inspection_id: insp.id, reservation_id: payload.reservation_id || null,
    url: `storage://inspecoes/${insp.id}/${p.kind}-${i + 1}.jpg`,
    kind: p.kind || 'devolucao', label: p.label || null,
    position: i, is_cover: false
  }, { silent: true, batch: true }));

  const descricao = danos.map(d => d.label + (d.severity ? ` (${d.severity})` : '') + (d.note ? ' — ' + d.note : '')).join('; ');

  if (result === 'perda') {
    /* Sai do fluxo operacional e vai para decisão da gestão. */
    db.insert('garment_calendar_block', {
      garment_id, kind: 'bloqueio_manual', start_date: hoje, end_date: SZ.addDays(hoje, 30),
      note: 'Avaliação gerencial — possível perda da peça', created_by: db.session.user_id
    }, { silent: true, batch: true });
    E.setGarmentState(garment_id, 'bloqueado',
      'Dano grave — bloqueada para avaliação gerencial', { type: 'inspection', id: insp.id });

  } else if (result === 'reprovada' || grave) {
    const m = db.insert('garment_maintenance', {
      garment_id, inspection_id: insp.id, reservation_id: payload.reservation_id || null,
      kind: payload.maintenance_kind || 'costura', state: 'aberta', opened_at: SZ.nowISO(),
      due_at: SZ.addDays(hoje, 5),
      description: descricao || payload.notes, provider: payload.provider || null,
      cost: 0, blocks_garment: true, created_by: db.session.user_id
    });
    db.insert('garment_calendar_block', {
      garment_id, kind: 'manutencao', maintenance_id: m.id,
      start_date: hoje, end_date: SZ.addDays(hoje, 5),
      note: 'Manutenção aberta na inspeção', created_by: db.session.user_id
    }, { silent: true, batch: true });
    E.setGarmentState(garment_id, 'manutencao', 'Dano identificado na inspeção', { type: 'inspection', id: insp.id });

  } else {
    const b = E.buffer(g);
    const m = db.insert('garment_maintenance', {
      garment_id, inspection_id: insp.id, reservation_id: payload.reservation_id || null,
      kind: 'higienizacao', state: 'em_andamento',
      opened_at: SZ.nowISO(), due_at: SZ.addDays(hoje, Math.max(1, b.cleaning)),
      description: 'Higienização pós-locação', provider: payload.provider || null,
      cost: 0, blocks_garment: true, created_by: db.session.user_id
    });
    E.setGarmentState(garment_id, 'higienizacao', 'Enviada para higienização', { type: 'maintenance', id: m.id });

    /* Ressalva leve com reparo: a peça é higienizada E ganha uma ordem de
       ajuste, em vez de "seguir como se nada tivesse acontecido". */
    if (result === 'ressalva' && payload.open_repair) {
      db.insert('garment_maintenance', {
        garment_id, inspection_id: insp.id, reservation_id: payload.reservation_id || null,
        kind: payload.maintenance_kind || 'ajuste', state: 'aberta', opened_at: SZ.nowISO(),
        due_at: SZ.addDays(hoje, Math.max(2, b.cleaning + 1)),
        description: descricao || 'Reparo leve identificado na inspeção',
        cost: 0, blocks_garment: false, created_by: db.session.user_id
      }, { silent: true, batch: true });
    }
  }

  /* Marca o item da reserva como inspecionado e finaliza a reserva quando
     a última peça tiver passado pela conferência. */
  if (payload.reservation_id) {
    const meu = db.first('reservation_item',
      i => i.reservation_id === payload.reservation_id && i.garment_id === garment_id);
    if (meu) db.update('reservation_item', meu.id, { item_state: 'inspecionado' }, { silent: true, batch: true });

    const items = db.where('reservation_item', i => i.reservation_id === payload.reservation_id && i.item_state !== 'cancelado')
      .map(i => db.get('reservation_item', i.id));
    const done = items.every(i => ['inspecionado', 'nao_entregue'].includes(i.item_state));
    if (done) E.transition(payload.reservation_id, 'finalizada', 'Todas as peças inspecionadas');
  }
  db.persist();
  return insp;
};

/* Fecha manutenção/higienização e devolve a peça ao acervo. */
E.closeMaintenance = (maintenance_id, cost, note) => {
  const m = db.get('garment_maintenance', maintenance_id); if (!m) return;
  db.update('garment_maintenance', maintenance_id, {
    state: 'concluida', closed_at: SZ.nowISO(), cost: Number(cost) || 0,
    description: note ? (m.description ? m.description + ' · ' + note : note) : m.description
  }, { silent: true });
  if (Number(cost) > 0) {
    db.insert('expense', {
      garment_id: m.garment_id, maintenance_id,
      kind: m.kind === 'higienizacao' ? 'higienizacao' : (m.kind === 'ajuste' ? 'ajuste' : 'manutencao'),
      amount: Number(cost), incurred_at: SZ.today(),
      description: m.description || m.kind, created_by: db.session.user_id
    }, { batch: true });
  }
  E.releaseBlocks(b => b.maintenance_id === maintenance_id);
  db.persist();
  return m;
};

/* Libera a peça: encerra higienização, remove bloqueios operacionais. */
E.releaseGarment = (garment_id, note) => {
  const abertas = db.where('garment_maintenance',
    m => m.garment_id === garment_id && ['aberta', 'em_andamento'].includes(m.state));
  abertas.forEach(m => E.closeMaintenance(m.id, m.cost || 0, note));
  E.releaseBlocks(b => b.garment_id === garment_id &&
    ['higienizacao', 'manutencao', 'ajuste', 'inspecao'].includes(b.kind) &&
    b.end_date >= SZ.today());
  const s = E.deriveState(Object.assign({}, db.get('garment', garment_id), { state: 'disponivel' }));
  E.setGarmentState(garment_id, s, note || 'Liberada para o acervo');
  return s;
};

E.blockGarment = (garment_id, from, to, note) => {
  db.insert('garment_calendar_block', {
    garment_id, kind: 'bloqueio_manual', start_date: from, end_date: to,
    note: note || 'Bloqueio manual', created_by: db.session.user_id
  });
  if (from <= SZ.today() && to >= SZ.today()) E.setGarmentState(garment_id, 'bloqueado', note || 'Bloqueio manual');
};

/* ------------------------------------------------------------ financeiro */
E.payments = (r) => db.where('payment', p => p.reservation_id === r.id);
E.balance = (r) => {
  const ps = E.payments(r);
  const pago = SZ.sum(ps.filter(p => p.state === 'pago' && p.kind !== 'caucao' && p.kind !== 'estorno'), p => p.amount);
  const estorno = SZ.sum(ps.filter(p => p.kind === 'estorno' && p.state === 'pago'), p => p.amount);
  const caucao = SZ.sum(ps.filter(p => p.kind === 'caucao' && p.state === 'pago'), p => p.amount);
  const devido = (r.total_net || 0) + (r.late_fee || 0);
  const liquido = pago - estorno;
  return {
    devido, pago: liquido, caucao, due: Math.max(0, Math.round((devido - liquido) * 100) / 100),
    status: liquido <= 0 ? 'nao_pago' : (liquido >= devido - 0.009 ? 'pago' : 'parcial')
  };
};
E.PAYSTATE = {
  nao_pago: { label: 'Não pago', tone: 'red' },
  parcial:  { label: 'Parcial',  tone: 'amber' },
  pago:     { label: 'Pago',     tone: 'green' }
};

E.registerPayment = (reservation_id, payload) => {
  const p = db.insert('payment', Object.assign({
    reservation_id, state: 'pago', paid_at: SZ.nowISO(), created_by: db.session.user_id
  }, payload));
  const r = db.get('reservation', reservation_id);
  const bal = E.balance(r);
  if (bal.due <= 0 && r.state === 'aguardando_pagamento') {
    E.transition(reservation_id, 'confirmada', 'Pagamento integral recebido');
  }
  return p;
};

/* ---------------------------------------------- economia unitária da peça
   Nunca há campo acumulador. Tudo é recalculado a partir de reservation_item
   e expense — o mesmo cálculo da view v_garment_economics no Postgres.      */
E.economics = (g) => {
  const items = db.where('reservation_item', i => i.garment_id === g.id)
    .map(i => ({ i, r: db.get('reservation', i.reservation_id) }))
    .filter(x => x.r && SZ.REALIZED_RESERVATION_STATES.includes(x.r.state));
  const revenue = SZ.sum(items, x => E.itemRevenue(x.i));
  const exps = db.where('expense', e => e.garment_id === g.id);
  const cleaning = SZ.sum(exps.filter(e => e.kind === 'higienizacao'), e => e.amount);
  const maint = SZ.sum(exps.filter(e => ['manutencao', 'ajuste'].includes(e.kind)), e => e.amount);
  const cost = Number(g.acquisition_cost) || 0;
  const result = revenue - cost - cleaning - maint;
  const last = items.length ? SZ.sortBy(items, x => x.r.event_date || x.r.pickup_date, -1)[0] : null;
  return {
    rentals: items.length, revenue, cleaning, maintenance: maint, acquisition: cost,
    result, payback: cost > 0 ? revenue / cost : null,
    paid_back: cost > 0 && revenue >= cost,
    rentals_to_payback: cost > 0 && g.rental_price > 0 ? Math.ceil(cost / g.rental_price) : null,
    avg: items.length ? revenue / items.length : 0,
    margin: revenue > 0 ? result / revenue : 0,
    last_rental: last ? (last.r.event_date || last.r.pickup_date) : null,
    idle_days: last ? SZ.diffDays(last.r.event_date || last.r.pickup_date, SZ.today()) : null
  };
};

E.customerStats = (c) => {
  const rs = db.where('reservation', r => r.customer_id === c.id);
  const realizadas = rs.filter(r => SZ.REALIZED_RESERVATION_STATES.includes(r.state));
  const spent = SZ.sum(realizadas, r => r.total_net);
  const next = SZ.sortBy(rs.filter(r => SZ.ACTIVE_RESERVATION_STATES.includes(r.state) &&
    (r.event_date || r.pickup_date) >= SZ.today()), r => r.event_date || r.pickup_date)[0] || null;
  const inter = db.where('customer_interaction', i => i.customer_id === c.id);
  return {
    reservations: rs.length, rentals: realizadas.length, spent,
    ticket: realizadas.length ? spent / realizadas.length : 0,
    cancels: rs.filter(r => ['cancelada', 'no_show'].includes(r.state)).length,
    next, interactions: inter.length,
    last_contact: inter.length ? SZ.sortBy(inter, i => i.occurred_at, -1)[0].occurred_at : null,
    garments: realizadas.flatMap(r => db.where('reservation_item', i => i.reservation_id === r.id))
  };
};

/* ----------------------------------------------------------- alertas
   Derivados ao vivo — nunca ficam desatualizados, nunca precisam de job. */
E.alerts = () => {
  const hoje = SZ.today(), cfg = E.cfg(), out = [];
  const push = (o) => out.push(o);

  db.all('reservation').forEach(r => {
    const c = db.get('customer', r.customer_id);
    const nome = c ? c.full_name : '—';
    if (['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state)) {
      const d = SZ.diffDays(r.return_due_date, hoje);
      if (d > 0) push({ sev: 'critico', kind: 'devolucao_atrasada', icon: 'alerta',
        title: `Devolução atrasada — ${nome}`, detail: `${r.code} · ${d} dia(s) · prevista ${SZ.fd(r.return_due_date)}`,
        route: `#/reservas/${r.id}` });
      else if (d === 0) push({ sev: 'atencao', kind: 'devolucao_hoje', icon: 'relogio',
        title: `Devolução hoje — ${nome}`, detail: `${r.code}`, route: `#/reservas/${r.id}` });
    }
    if (['confirmada', 'pronta_retirada', 'aguardando_pagamento'].includes(r.state)) {
      const d = SZ.diffDays(hoje, r.pickup_date);
      if (d === 1) push({ sev: 'info', kind: 'retirada_amanha', icon: 'presente',
        title: `Retirada amanhã — ${nome}`, detail: `${r.code} · ${SZ.fd(r.pickup_date)}`, route: `#/reservas/${r.id}` });
      const bal = E.balance(r);
      if (bal.due > 0 && d <= 3 && SZ.can('financeiro.view')) push({ sev: d <= 1 ? 'critico' : 'atencao', kind: 'pagamento_pendente', icon: 'moeda',
        title: `Pagamento pendente — ${nome}`, detail: `${r.code} · falta ${SZ.brl(bal.due)} · retirada ${SZ.fd(r.pickup_date)}`,
        route: `#/reservas/${r.id}` });
    }
    if (r.state === 'pre_reserva' && r.hold_expires_at) {
      const h = (new Date(r.hold_expires_at) - Date.now()) / 3600e3;
      if (h > 0 && h <= 8) push({ sev: 'atencao', kind: 'pre_reserva_expirando', icon: 'relogio',
        title: `Pré-reserva expira em ${Math.max(1, Math.round(h))}h — ${nome}`,
        detail: `${r.code} · confirme ou libere a peça`, route: `#/reservas/${r.id}` });
    }
  });

  db.all('garment').forEach(g => {
    if (g.state === 'inspecao') {
      const h = db.where('garment_state_history', x => x.garment_id === g.id && x.to_state === 'inspecao');
      const since = h.length ? SZ.sortBy(h, x => x.occurred_at, -1)[0].occurred_at : null;
      const dias = since ? SZ.diffDays(String(since).slice(0, 10), hoje) : 0;
      if (dias >= 1) push({ sev: 'atencao', kind: 'inspecao_parada', icon: 'alerta',
        title: `${g.code} aguarda inspeção há ${dias} dia(s)`, detail: g.name, route: `#/acervo/${g.id}` });
      else push({ sev: 'info', kind: 'inspecao_pendente', icon: 'operacao',
        title: `${g.code} devolvida — aguardando inspeção`, detail: g.name, route: `#/operacao` });
    }
  });

  db.where('garment_maintenance', m => ['aberta', 'em_andamento'].includes(m.state)).forEach(m => {
    const dias = Math.floor((Date.now() - new Date(m.opened_at)) / 864e5);
    if (dias >= 7) {
      const g = db.get('garment', m.garment_id);
      push({ sev: 'atencao', kind: 'manutencao_longa', icon: 'costura',
        title: `${g ? g.code : '—'} há ${dias} dias em ${m.kind}`,
        detail: m.description || '', route: `#/operacao` });
    }
  });

  db.all('customer').forEach(c => {
    if (!c.birth_date) return;
    const [, mm, dd] = c.birth_date.split('-');
    const ano = new Date().getFullYear();
    const prox = `${ano}-${mm}-${dd}`;
    const d = SZ.diffDays(hoje, prox);
    if (d === 0) push({ sev: 'info', kind: 'aniversario', icon: 'presente',
      title: `Aniversário hoje — ${c.full_name}`, detail: 'Boa hora para um contato', route: `#/clientes/${c.id}` });
    else if (d > 0 && d <= 3) push({ sev: 'info', kind: 'aniversario', icon: 'presente',
      title: `Aniversário em ${d} dia(s) — ${c.full_name}`, detail: SZ.fd(prox), route: `#/clientes/${c.id}` });
  });

  const ordem = { critico: 0, atencao: 1, info: 2 };
  return out.sort((a, b) => ordem[a.sev] - ordem[b.sev]);
};

/* ---------------------------------------------------------- agenda do dia */
E.agendaFor = (date) => {
  const items = [];
  db.all('appointment').filter(a => String(a.starts_at).slice(0, 10) === date && a.state !== 'cancelado')
    .forEach(a => {
      const c = a.customer_id ? db.get('customer', a.customer_id) : null;
      const r = a.reservation_id ? db.get('reservation', a.reservation_id) : null;
      const gs = r ? db.where('reservation_item', i => i.reservation_id === r.id)
        .map(i => db.get('garment', i.garment_id)).filter(Boolean) : [];
      items.push({
        id: a.id, time: SZ.ftime(a.starts_at), kind: a.kind,
        customer: c, reservation: r, garments: gs,
        fitting: a.fitting_id ? db.get('fitting_session', a.fitting_id) : null,
        title: a.title || a.kind, state: a.state, appointment: a
      });
    });
  return SZ.sortBy(items, i => i.time);
};

LOCADORA: Senzie Club — locação de vestuário feminino.
LOCATÁRIA: ${c.full_name}${c.document ? ' — CPF ' + c.document : ''}
Telefone: ${c.phone || c.whatsapp || '—'}${c.email ? ' · ' + c.email : ''}

1. OBJETO
A LOCADORA cede à LOCATÁRIA, a título de locação temporária, a(s) peça(s):
${linhas}

Valor de referência do acervo cedido: ${SZ.brl(ref)}.

2. PRAZO
Retirada: ${SZ.fdy(r.pickup_date)}
Evento: ${SZ.fdy(r.event_date)}${r.event_type ? ' — ' + r.event_type : ''}
Devolução prevista: ${SZ.fdy(r.return_due_date)} até as 18h.

3. VALORES
Locação: ${SZ.brl(r.total_gross)}
Desconto: ${SZ.brl(r.discount)}
Total: ${SZ.brl(r.total_net)}
Caução: ${r.deposit_amount ? SZ.brl(r.deposit_amount) : 'dispensada'}

4. RESPONSABILIDADES DA LOCATÁRIA
4.1 Utilizar a peça exclusivamente no evento indicado, zelando por sua conservação.
4.2 Não lavar, passar, tingir, cortar ou submeter a peça a qualquer processo de
    higienização por conta própria. A higienização é realizada pela LOCADORA.
4.3 Não ceder, sublocar ou emprestar a peça a terceiros.

${c.full_name}                          Senzie Club

E.generateContract = (r) => {
  const existing = db.first('contract', c => c.reservation_id === r.id);
  const body = E.contractBody(r);
  if (existing) return db.update('contract', existing.id, { body_rendered: body, version: (existing.version || 1) + 1, generated_at: SZ.nowISO() });
  return db.insert('contract', {
    reservation_id: r.id, number: r.code.replace('RS', 'CT'), version: 1,
    body_rendered: body, generated_at: SZ.nowISO(),
    terms: { late_fee_daily_percent: E.cfg().late_fee_percent, deposit: r.deposit_amount },
    created_by: db.session.user_id
  });
};

/* -------------------------------------------------------- busca global */
E.search = (q) => {
  const t = q.trim().toLowerCase();
  if (!t) return [];
  const out = [];
  const norm = SZ.norm;
  const nt = norm(t);

  db.all('garment').forEach(g => {
    if (norm(g.code).includes(nt) || norm(g.name).includes(nt) || norm(g.color_primary).includes(nt))
      out.push({ type: 'Peça', label: `${g.code} · ${g.name}`, sub: `${g.color_primary} · tam. ${g.label_size} · ${SZ.GARMENT_STATE[g.state].label}`, route: `#/acervo/${g.id}`, rank: norm(g.code) === nt ? 0 : 2 });
  });
  db.all('customer').forEach(c => {
    if (norm(c.full_name).includes(nt) || norm(c.phone).includes(nt) || norm(c.whatsapp).includes(nt)
      || norm(c.instagram).includes(nt) || norm(c.code).includes(nt))
      out.push({ type: 'Cliente', label: c.full_name, sub: `${c.code} · ${c.whatsapp || c.phone || ''} ${c.instagram || ''}`.trim(), route: `#/clientes/${c.id}`, rank: 1 });
  });
  db.all('reservation').forEach(r => {
    const c = db.get('customer', r.customer_id);
    if (norm(r.code).includes(nt) || (c && norm(c.full_name).includes(nt)))
      out.push({ type: 'Reserva', label: `${r.code} · ${c ? c.full_name : ''}`, sub: `${SZ.RESERVATION_STATE[r.state].label} · evento ${SZ.fd(r.event_date)}`, route: `#/reservas/${r.id}`, rank: 3 });
  });
  db.all('contract').forEach(ct => {
    if (norm(ct.number).includes(nt))
      out.push({ type: 'Contrato', label: ct.number, sub: 'Contrato de locação', route: `#/reservas/${ct.reservation_id}`, rank: 4 });
  });
  return out.sort((a, b) => a.rank - b.rank).slice(0, 12);
};

E.nextFittingCode = () => {
  const y = new Date().getFullYear();
  const n = db.all('fitting_session').filter(f => String(f.code).includes(String(y))).length + 1;
  return `PR-${y}-${String(n).padStart(4, '0')}`;
};

E.createFitting = (input) => {
  const f = db.insert('fitting_session', {
    code: E.nextFittingCode(),
    customer_id: input.customer_id,
    state: input.state || 'agendada',
    scheduled_at: input.scheduled_at,
    started_at: null, ended_at: null,
    attendant_id: input.attendant_id || db.session.user_id,
    event_type: input.event_type || null,
    event_date: input.event_date || null,
    budget: input.budget || null,
    notes: input.notes || null,
    outcome_notes: null,
    reservation_id: null,
    created_by: db.session.user_id
  });
  (input.garment_ids || []).forEach((gid, i) => E.addFittingGarment(f.id, gid, i));
  db.insert('appointment', {
    kind: 'prova', customer_id: input.customer_id, fitting_id: f.id,
    starts_at: input.scheduled_at, title: 'Prova', state: 'agendado',
    assigned_to: f.attendant_id, notes: input.notes || null
  }, { silent: true, batch: true });
  db.persist();
  return f;
};

E.addFittingGarment = (fitting_id, garment_id, position) => {
  if (db.first('fitting_item', i => i.fitting_session_id === fitting_id && i.garment_id === garment_id)) return null;
  const row = db.insert('fitting_item', {
    fitting_session_id: fitting_id, garment_id,
    outcome: 'nao_provou', needs_alteration: false,
    note: null, position: position || 0,
    recorded_by: null, recorded_at: null
  }, { silent: true, batch: true });
  db.persist();
  return row;
};

E.removeFittingGarment = (fitting_id, garment_id) => {
  const it = db.first('fitting_item', i => i.fitting_session_id === fitting_id && i.garment_id === garment_id);
  if (it) { db.remove('fitting_item', it.id, { silent: true }); }
};

E.setFittingOutcome = (fitting_id, garment_id, payload) => {
  const it = db.first('fitting_item', i => i.fitting_session_id === fitting_id && i.garment_id === garment_id);
  if (!it) return null;
  db.update('fitting_item', it.id, {
    outcome: payload.outcome,
    needs_alteration: !!payload.needs_alteration,
    note: payload.note || null,
    recorded_by: db.session.user_id,
    recorded_at: SZ.nowISO()
  });
  const f = db.get('fitting_session', fitting_id);
  if (f && f.state === 'agendada') db.update('fitting_session', fitting_id, { state: 'em_curso', started_at: SZ.nowISO() }, { silent: true });
  // "favorita" vira favorito de verdade na ficha da cliente
  if (payload.outcome === 'favorita' && f) E.setFavorite(f.customer_id, garment_id, true, 'prova', payload.note);
  db.persist();
  return it;
};

E.closeFitting = (fitting_id, state, outcome_notes) => {
  const f = db.get('fitting_session', fitting_id); if (!f) return null;
  db.update('fitting_session', fitting_id, {
    state, ended_at: SZ.nowISO(), outcome_notes: outcome_notes || f.outcome_notes
  }, { note: `Prova encerrada como ${(SZ.FITTING_STATE[state] || {}).label || state}` });
  db.where('appointment', a => a.fitting_id === fitting_id && a.state === 'agendado')
    .forEach(a => db.update('appointment', a.id, {
      state: state === 'no_show' ? 'no_show' : 'concluido'
    }, { silent: true, batch: true }));
  db.persist();
  return db.get('fitting_session', fitting_id);
};

E.linkFittingToReservation = (fitting_id, reservation_id) => {
  db.update('fitting_session', fitting_id, {
    reservation_id, state: 'convertida', ended_at: SZ.nowISO()
  }, { note: 'Prova convertida em reserva' });
  db.where('appointment', a => a.fitting_id === fitting_id && a.state === 'agendado')
    .forEach(a => db.update('appointment', a.id, { state: 'concluido' }, { silent: true, batch: true }));
  db.persist();
};

/** Conversão de prova por peça — o indicador que revela peça que encanta e não fecha. */
E.fittingStats = (garment_id) => {
  const tried = db.where('fitting_item', i => i.garment_id === garment_id && i.outcome !== 'nao_provou');
  const sessions = tried.map(i => db.get('fitting_session', i.fitting_session_id)).filter(Boolean);
  let converted = 0;
  sessions.forEach(f => {
    if (!f.reservation_id) return;
    if (db.first('reservation_item', ri => ri.reservation_id === f.reservation_id && ri.garment_id === garment_id)) converted++;
  });
  const favs = tried.filter(i => i.outcome === 'favorita').length;
  const descartes = tried.filter(i => ['descartada', 'nao_gostou'].includes(i.outcome)).length;
  const ajustes = tried.filter(i => i.needs_alteration || i.outcome === 'precisa_ajuste').length;
  return {
    fittings: tried.length, converted,
    rate: tried.length ? converted / tried.length : null,
    favorites: favs, discards: descartes, alterations: ajustes,
    reasons: tried.filter(i => i.note).slice(-4).map(i => ({ outcome: i.outcome, note: i.note }))
  };
};

/* ======================================================================
   v0.2 · FAVORITOS / WISHLIST
   ====================================================================== */
E.setFavorite = (customer_id, garment_id, on, source, note) => {
  const ex = db.first('customer_favorite', f => f.customer_id === customer_id && f.garment_id === garment_id);
  if (on) {
    if (ex) return db.update('customer_favorite', ex.id, { note: note || ex.note, source: source || ex.source }, { silent: true });
    const row = db.insert('customer_favorite', {
      customer_id, garment_id, source: source || 'manual', note: note || null,
      created_by: db.session.user_id
    });
    db.persist();
    return row;
  }
  if (ex) db.remove('customer_favorite', ex.id);
  return null;
};
E.isFavorite = (customer_id, garment_id) =>
  !!db.first('customer_favorite', f => f.customer_id === customer_id && f.garment_id === garment_id);
E.favorites = (customer_id) =>
  db.where('customer_favorite', f => f.customer_id === customer_id)
    .map(f => ({ fav: f, g: db.get('garment', f.garment_id) })).filter(x => x.g);

/* ======================================================================
   v0.2 · ALERTAS DE RISCO OPERACIONAL
   Não é "o que já deu errado" — é "o que vai dar errado se ninguém agir".
   ====================================================================== */
E.riskAlerts = () => {
  const hoje = SZ.today(), out = [];

  /* Peça presa na operação com compromisso próximo. */
  db.all('garment').forEach(g => {
    if (!['inspecao', 'higienizacao', 'ajuste', 'manutencao', 'bloqueado'].includes(g.state)) return;
    const prox = SZ.sortBy(E.activeBlocks(g.id).filter(b =>
      b.kind === 'locacao' && b.end_date >= hoje && !E.isHistoric(b)), b => b.start_date)[0];
    if (!prox) return;
    const dias = SZ.diffDays(hoje, prox.start_date);
    if (dias > 7) return;
    const r = prox.reservation_id ? db.get('reservation', prox.reservation_id) : null;
    const c = r ? db.get('customer', r.customer_id) : null;
    out.push({
      sev: dias <= 2 ? 'critico' : 'atencao', kind: 'peca_em_risco', icon: 'alerta',
      title: `${g.code} está em ${SZ.GARMENT_STATE[g.state].label.toLowerCase()} e tem retirada ${dias === 0 ? 'hoje' : dias === 1 ? 'amanhã' : 'em ' + dias + ' dias'}`,
      detail: `${g.name}${r ? ` · ${r.code}${c ? ' — ' + c.full_name : ''}` : ''} · retirada ${SZ.fd(prox.start_date)}`,
      route: `#/acervo/${g.id}`
    });
  });

  /* Devolução atrasada COM reserva subsequente — o caso mais caro de todos. */
  db.all('reservation').forEach(r => {
    if (!['retirada', 'em_uso', 'aguardando_devolucao'].includes(r.state)) return;
    if (r.return_due_date >= hoje) return;
    const c = db.get('customer', r.customer_id);
    db.where('reservation_item', i => i.reservation_id === r.id).forEach(it => {
      const seguinte = SZ.sortBy(db.where('garment_calendar_block', b =>
        b.garment_id === it.garment_id && !b.released_at && b.kind === 'locacao'
        && b.reservation_id !== r.id && b.start_date >= hoje && !E.isHistoric(b)), b => b.start_date)[0];
      if (!seguinte) return;
      const r2 = db.get('reservation', seguinte.reservation_id);
      const c2 = r2 ? db.get('customer', r2.customer_id) : null;
      const g = db.get('garment', it.garment_id);
      out.push({
        sev: 'critico', kind: 'atraso_com_fila', icon: 'alerta',
        title: `Atraso de ${c ? c.full_name.split(' ')[0] : '—'} compromete a próxima reserva de ${g ? g.code : ''}`,
        detail: `${r.code} venceu ${SZ.fd(r.return_due_date)} · ${r2 ? r2.code : ''}${c2 ? ' — ' + c2.full_name : ''} retira ${SZ.fd(seguinte.start_date)}`,
        route: `#/reservas/${r.id}`
      });
    });
  });

  /* Peças não entregues na retirada e ainda pendentes. */
  db.all('reservation_item').forEach(it => {
    if (it.item_state !== 'nao_entregue') return;
    const r = db.get('reservation', it.reservation_id);
    if (!r || !SZ.ACTIVE_RESERVATION_STATES.includes(r.state)) return;
    const g = db.get('garment', it.garment_id), c = db.get('customer', r.customer_id);
    out.push({
      sev: 'atencao', kind: 'item_nao_entregue', icon: 'alerta',
      title: `${g ? g.code : 'Peça'} não foi entregue na retirada`,
      detail: `${r.code} — ${c ? c.full_name : ''} · ${SZ.esc(it.pickup_note || '')}`,
      route: `#/reservas/${r.id}`
    });
  });

  /* Prova de hoje sem resultado registrado. */
  db.all('fitting_session').forEach(f => {
    if (!['agendada', 'em_curso'].includes(f.state)) return;
    if (String(f.scheduled_at).slice(0, 10) > hoje) return;
    const c = db.get('customer', f.customer_id);
    const pend = db.where('fitting_item', i => i.fitting_session_id === f.id && i.outcome === 'nao_provou').length;
    out.push({
      sev: String(f.scheduled_at).slice(0, 10) < hoje ? 'atencao' : 'info',
      kind: 'prova_sem_resultado', icon: 'prova',
      title: `Prova de ${c ? c.full_name : '—'} sem resultado registrado`,
      detail: `${f.code} · ${SZ.fdt(f.scheduled_at)}${pend ? ` · ${pend} peça(s) sem avaliação` : ''}`,
      route: `#/provas/${f.id}`
    });
  });

  return out;
};

/* Funde os alertas de risco à lista original, mantendo a ordem por severidade. */
const _baseAlerts = E.alerts;
E.alerts = () => {
  const ordem = { critico: 0, atencao: 1, info: 2 };
  return _baseAlerts().concat(E.riskAlerts()).sort((a, b) => ordem[a.sev] - ordem[b.sev]);
};

/* ======================================================================
   v0.2 · PRESSÃO DO ACERVO
   Demanda ÷ oferta, não volume absoluto. Um tamanho com muitas locações
   pode simplesmente ter muitas peças; o que importa é quantas vezes cada
   peça daquele segmento foi procurada.
   ====================================================================== */
E.pressure = (dimension, dias) => {
  const hoje = SZ.today(), from = SZ.addDays(hoje, -dias + 1);
  const garments = db.all('garment').filter(g => g.state !== 'baixado');
  const keyOf = (g) => {
    if (dimension === 'size') return g.size_equiv || '—';
    if (dimension === 'color') return g.color_primary || '—';
    const c = db.get('garment_category', g.category_id);
    return c ? c.name : '—';
  };
  const seg = {};
  garments.forEach(g => {
    const k = keyOf(g);
    seg[k] = seg[k] || { key: k, pecas: 0, locacoes: 0, provas: 0, diasOcupados: 0, receita: 0 };
    seg[k].pecas++;
    db.where('reservation_item', i => i.garment_id === g.id).forEach(it => {
      const r = db.get('reservation', it.reservation_id);
      if (!r || !SZ.REALIZED_RESERVATION_STATES.includes(r.state)) return;
      if (r.pickup_date < from || r.pickup_date > hoje) return;
      seg[k].locacoes++; seg[k].receita += E.itemRevenue(it);
    });
    db.where('fitting_item', i => i.garment_id === g.id && i.outcome !== 'nao_provou').forEach(fi => {
      const f = db.get('fitting_session', fi.fitting_session_id);
      if (!f) return;
      const d = String(f.scheduled_at).slice(0, 10);
      if (d >= from && d <= hoje) seg[k].provas++;
    });
    db.where('garment_calendar_block', b => b.garment_id === g.id && b.kind === 'locacao').forEach(b => {
      const ini = b.start_date > from ? b.start_date : from;
      const fim = b.end_date < hoje ? b.end_date : hoje;
      if (fim >= ini) seg[k].diasOcupados += SZ.diffDays(ini, fim) + 1;
    });
  });
  return Object.values(seg).map(s => Object.assign(s, {
    // procura por peça: cada prova pesa metade de uma locação
    pressao: s.pecas ? (s.locacoes + s.provas * 0.5) / s.pecas : 0,
    ocupacao: s.pecas ? s.diasOcupados / (s.pecas * dias) : 0
  })).sort((a, b) => b.pressao - a.pressao);
};

/* ======================================================================
   v0.2 · VALIDAÇÕES DE QUALIDADE DE DADOS
   Retornam lista de mensagens; a interface decide como mostrar.
   → EM PRODUÇÃO: as mesmas regras viram CHECK constraints e triggers.
   ====================================================================== */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;

E.validateReservation = (input) => {
  const e = [];
  if (!input.customer_id) e.push('Selecione a cliente — toda reserva pertence a alguém.');
  if (!input.items || !input.items.length) e.push('Selecione ao menos uma peça.');
  if (!input.event_date) e.push('Informe a data do evento.');
  if (input.pickup_date && input.return_due_date && input.return_due_date < input.pickup_date)
    e.push('A devolução não pode ser anterior à retirada.');
  if (input.event_date && input.pickup_date && input.event_date < input.pickup_date)
    e.push('O evento não pode acontecer antes da retirada.');
  if (input.event_date && input.return_due_date && input.event_date > input.return_due_date)
    e.push('O evento não pode acontecer depois da devolução prevista.');
  if (input.pickup_date && input.pickup_date < SZ.addDays(SZ.today(), -1))
    e.push('A retirada está no passado. Revise as datas.');
  const bruto = SZ.sum(input.items || [], i => Number(i.unit_price) || 0);
  const desc = Number(input.discount) || 0;
  if (desc < 0) e.push('O desconto não pode ser negativo.');
  if (desc > bruto) e.push(`O desconto (${SZ.brl(desc)}) é maior que o valor das peças (${SZ.brl(bruto)}).`);
  return e;
};

/** Desconto acima do limite exige autorização de gestor/administrador. */
E.discountNeedsAuthorization = (bruto, desconto) => {
  const limite = db.setting('discount_limit_percent', 15) / 100;
  return bruto > 0 && (desconto / bruto) > limite;
};

E.validateCustomer = (d, ignoreId) => {
  const e = [];
  if (!d.full_name || d.full_name.trim().length < 3) e.push('Informe o nome completo da cliente.');
  if (d.email && !EMAIL_RE.test(d.email)) e.push('O e-mail informado não é válido.');
  if (d.birth_date && d.birth_date > SZ.today()) e.push('A data de nascimento está no futuro.');
  if (d.code && db.all('customer').some(c => c.code === d.code && c.id !== ignoreId))
    e.push(`O código ${d.code} já pertence a outra cliente.`);
  return e;
};

E.validateGarment = (d, ignoreId) => {
  const e = [];
  if (!d.name || d.name.trim().length < 2) e.push('Informe o nome ou modelo da peça.');
  if (!(Number(d.rental_price) > 0)) e.push('Informe o valor da locação.');
  if (Number(d.acquisition_cost) < 0) e.push('O custo de aquisição não pode ser negativo.');
  if (Number(d.retail_reference) < 0) e.push('O valor de referência não pode ser negativo.');
  if (d.code && db.all('garment').some(g => g.code === d.code && g.id !== ignoreId))
    e.push(`O código ${d.code} já pertence a outra peça do acervo.`);
  return e;
};

E.validatePayment = (d, saldo) => {
  const e = [];
  if (!(Number(d.amount) > 0)) e.push('O valor do pagamento deve ser maior que zero.');
  if (d.kind !== 'estorno' && d.kind !== 'caucao' && Number(d.amount) > saldo + 0.01)
    e.push(`O valor excede o saldo em aberto (${SZ.brl(saldo)}).`);
  return e;
};

/* ======================================================================
   v0.2 · BUSCA GLOBAL EXPANDIDA
   ====================================================================== */
const _baseSearch = E.search;
E.search = (q) => {
  const t = SZ.norm(q.trim());
  if (!t) return [];
  const out = _baseSearch(q);

  db.all('fitting_session').forEach(f => {
    const c = db.get('customer', f.customer_id);
    const pecas = db.where('fitting_item', i => i.fitting_session_id === f.id)
      .map(i => db.get('garment', i.garment_id)).filter(Boolean);
    const hit = SZ.norm(f.code).includes(t) || (c && SZ.norm(c.full_name).includes(t))
      || pecas.some(g => SZ.norm(g.code + ' ' + g.name).includes(t));
    if (hit) out.push({
      type: 'Prova', label: `${f.code} · ${c ? c.full_name : ''}`,
      sub: `${(SZ.FITTING_STATE[f.state] || {}).label || f.state} · ${SZ.fdt(f.scheduled_at)} · ${pecas.length} peça(s)`,
      route: `#/provas/${f.id}`, rank: 3
    });
  });

  db.all('garment_maintenance').forEach(m => {
    const g = db.get('garment', m.garment_id); if (!g) return;
    if (!SZ.norm(g.code + ' ' + g.name + ' ' + (m.kind || '') + ' ' + (m.description || '')).includes(t)) return;
    out.push({
      type: 'Serviço', label: `${SZ.MAINTENANCE_KIND[m.kind] || m.kind} · ${g.code}`,
      sub: `${SZ.esc(m.description || '')} · ${m.state === 'concluida' ? 'concluída' : 'em aberto'}`,
      route: `#/acervo/${g.id}`, rank: 5
    });
  });

  /* reservas que contêm a peça procurada — "Verona" devolve as locações dela */
  db.all('garment').forEach(g => {
    if (!SZ.norm(g.code + ' ' + g.name).includes(t)) return;
    db.where('reservation_item', i => i.garment_id === g.id).slice(-6).forEach(it => {
      const r = db.get('reservation', it.reservation_id); if (!r) return;
      if (out.some(o => o.route === `#/reservas/${r.id}`)) return;
      const c = db.get('customer', r.customer_id);
      out.push({
        type: 'Reserva', label: `${r.code} · ${g.name}`,
        sub: `${c ? c.full_name : ''} · ${(SZ.RESERVATION_STATE[r.state] || {}).label} · evento ${SZ.fd(r.event_date)}`,
        route: `#/reservas/${r.id}`, rank: 4
      });
    });
  });

  db.all('customer_favorite').forEach(f => {
    const c = db.get('customer', f.customer_id), g = db.get('garment', f.garment_id);
    if (!c || !g) return;
    if (!SZ.norm(c.full_name + ' ' + g.code + ' ' + g.name).includes(t)) return;
    out.push({
      type: 'Favorito', label: `${g.name} — favorita de ${c.full_name.split(' ')[0]}`,
      sub: `${g.code} · marcada ${SZ.fdy(String(f.created_at).slice(0, 10))}`,
      route: `#/clientes/${c.id}`, rank: 6
    });
  });

  return out.sort((a, b) => a.rank - b.rank).slice(0, 14);
};

/* ======================================================================
   v0.2 · AGREGADOS DE RESERVA POR ITEM
   ====================================================================== */
E.itemsOf = (reservation_id) => db.where('reservation_item', i => i.reservation_id === reservation_id)
  .map(i => ({ i, g: db.get('garment', i.garment_id) })).filter(x => x.g);

E.itemSummary = (reservation_id) => {
  const items = E.itemsOf(reservation_id).map(x => x.i);
  const by = (s) => items.filter(i => (i.item_state || 'pendente') === s).length;
  return {
    total: items.length,
    pendente: by('pendente'), retirado: by('retirado'),
    nao_entregue: by('nao_entregue'), devolvido: by('devolvido'),
    inspecionado: by('inspecionado'),
    naRua: items.filter(i => i.item_state === 'retirado').length
  };
};
